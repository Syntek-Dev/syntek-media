# Development settings for Codex. Nothing here ships, and nothing here may name a product skill.
# Codex 0.160.1 reads [[skills.config]] only from the user's ~/.codex/config.toml and -c flags,
# never from a project file (codex-rs/config/src/skills_config.rs, user and session layers only),
# so product skills cannot be disabled here. Start Codex at the repository root, where it finds
# none; for the user-level rule that hides them under template/ too, see CLAUDE.md beside this.

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph==2.3.9", "serve", "--tools", "build_or_update_graph_tool,run_postprocess_tool,get_minimal_context_tool,get_impact_radius_tool,query_graph_tool,get_review_context_tool,semantic_search_nodes_tool,list_graph_stats_tool,get_docs_section_tool,find_large_functions_tool,list_flows_tool,get_flow_tool,get_affected_flows_tool,list_communities_tool,get_community_tool,get_architecture_overview_tool,detect_changes_tool,refactor_tool,apply_refactor_tool,generate_wiki_tool,get_wiki_page_tool,get_hub_nodes_tool,get_bridge_nodes_tool,get_knowledge_gaps_tool,get_surprising_connections_tool,get_suggested_questions_tool,traverse_graph_tool,list_repos_tool,cross_repo_search_tool"]

[mcp_servers.code-review-graph.env]
GOOGLE_API_KEY = ""
VOYAGE_API_KEY = ""
MINIMAX_API_KEY = ""
CRG_OPENAI_API_KEY = ""
CRG_OPENAI_BASE_URL = ""
CRG_ACCEPT_CLOUD_EMBEDDINGS = ""
