# Development settings for Codex. Nothing here ships, and nothing here may name a product skill.
# Codex 0.160.1 reads [[skills.config]] only from the user's ~/.codex/config.toml and -c flags,
# never from a project file (codex-rs/config/src/skills_config.rs, user and session layers only),
# so product skills cannot be disabled here. Start Codex at the repository root, where it finds
# none; for the user-level rule that hides them under template/ too, see CLAUDE.md beside this.

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph==2.3.9", "serve"]
