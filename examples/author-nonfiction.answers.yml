# author-nonfiction.answers.yml — an INVENTED example of answers for a non-fiction author.
#
# A shape to copy, not a project: every value below is made up. Copy this file outside the
# project you are applying the template to, change every value, then pass it to `copier copy`
# with --data-file (README.md, "Applying to a syntek-author project"). Keys are the questions in
# copier.yml, and the lists hold choice values, never their labels; a question left out here is
# asked, or takes its default under --defaults.
BRAND_NAME: Robin Example
BRAND_SLUG: robin-example
BRAND_KIND: author-nonfiction
BRAND_DESCRIPTION: >-
  Recorded talks, a podcast and the audiobook of a book on the shared table in a small
  congregation, for church members with no theological training.
AUDIENCE_TEST: A thoughtful listener with no specialist training, hearing it on a commute.
OWNER_NAME: Robin Example
OWNER_FIRST_NAME: Robin
PLATFORMS:
  - youtube
  - podcast
  - facebook
  - website
MEDIA_KINDS:
  - long-video
  - podcast
  - audiobook
  - short-video
SEED_EXAMPLES: false
MODEL_MECHANICAL: sonnet
TIMEZONE: Europe/London
DATE: 03/10/2026
# The coding agents besides Claude Code, and where binary files are kept: syntek-author's
# family-shared questions (DESIGN.md D80), answered here as the matching syntek-author example
# answers them, so a combined render tells one story. A key a `when:` hides (GEMINI_MODEL
# without gemini-cli, say) is never recorded: its line is here because every example answers
# every question. Over a syntek-author project, set AGENT_CLIENTS and the model lines to what
# .copier-answers.syntek-author.yml records: media never reads them from it, and the copy writes
# the files of every client listed here that the project lacks.
AGENT_CLIENTS:
  - codex
  - opencode
CODEX_MODEL: ""
GEMINI_MODEL: ""
# user: OpenCode uses each person's own settings, so no model, address or context is asked.
OPENCODE_PROVIDER: user
OPENCODE_BASE_URL: ""
OPENCODE_MODEL: ""
OPENCODE_CONTEXT: 32768
# Where binary files are kept: repo keeps them in the repository, as a project already in use
# does. Media files nothing under a data root yet, so these answers only keep the two
# templates' records in agreement. Over a syntek-author project that records DATA_STORE (every
# one from its v0.5.0 on), delete DATA_STORE, the six folder lines and DATA_PROVIDER: the copy
# then takes syntek-author's answers, and refuses a first store or folder that differs. The
# folders are asked only with external.
DATA_STORE: repo
DATA_AREA: business
DATA_SLUG: robin-example
DATA_KIND_DOCS: docs
DATA_KIND_PHOTOS: photos
DATA_KIND_AUDIO: audio
DATA_KIND_VIDEOS: videos
# The service that keeps a copy of the data root once files move there; none until then.
DATA_PROVIDER: none
