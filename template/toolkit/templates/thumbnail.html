<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail — <%BRAND_NAME%></title>
<link rel="stylesheet" href="../../brand/src/design-system/tokens.css">
<!--
  The toolkit's fallback thumbnail and cover layout, used only where the brand has no
  brand/src/design-system/previews/thumbnail.html (the brand's own layout always wins).
  thumbnail-brief copies it to publishing/src/thumbnails/<piece>[--cNN].html, fixing the path
  to tokens.css, and changes only the copy: the words, and the picture, set on the frame as
  style="--picture: url('../renders/<still>.png')". One file serves every aspect ratio:
  1.91:1 share images, 16:9 thumbnails, posters and previews, 1:1 and 4:5 covers and 9:16
  covers. uv run toolkit/card.py sets --safe-top, --safe-right, --safe-bottom and --safe-left
  (px) and --frame-width and --frame-height from the deliverable, and marks :root with
  data-deliverable and data-platform; every colour, face, weight and space comes from
  tokens.css, and nothing loads over the network.
  The play button (the element carrying data-play-button) shows only on a newsletter
  deliverable (:root[data-deliverable^="newsletter."]): a solid disc with its own outline, so
  it survives an email client's dark-mode inversion. Rendered with --transparent for a
  newsletter deliverable, the layout keeps only the play button and the words: that PNG is the
  newsletter GIF's overlay (media.py cut … --overlay). A brand layout without this element and
  its rules gets them in the piece's copy.
-->
<!-- AUTHOR TO CONFIRM: the words and the picture of this thumbnail (this is the toolkit's fallback layout; the brand's own layout lives in brand/src/design-system/previews/thumbnail.html). -->
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-weight: var(--weight-body);
  }
  .frame { position: relative; width: 100%; height: 100%; }
  .picture {
    position: absolute;
    inset: 0;
    background: var(--picture, none) center / cover no-repeat, var(--color-surface);
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, var(--color-bg) 0%, transparent 70%);
    opacity: 0.9;
  }
  .safe {
    position: absolute;
    top: var(--safe-top, 0px);
    right: var(--safe-right, 0px);
    bottom: var(--safe-bottom, 0px);
    left: var(--safe-left, 0px);
    box-sizing: border-box;
    padding: calc(var(--space-unit) * 5);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: calc(var(--space-unit) * 2);
  }
  .kicker {
    margin: 0;
    align-self: flex-start;
    padding: calc(var(--space-unit) * 0.75) calc(var(--space-unit) * 2);
    border-radius: var(--radius);
    background: var(--color-accent);
    color: var(--color-on-accent);
    font-size: 4vmin;
  }
  .title {
    margin: 0;
    max-width: 75%;
    font-family: var(--font-display);
    font-weight: var(--weight-display);
    font-size: 11vmin;
    line-height: 1.02;
  }
  .name { margin: 0; font-size: 3.5vmin; color: var(--color-text-muted); }

  /* Square and portrait covers (1:1, 4:5, 3:4): the title takes the full width. */
  @media (max-aspect-ratio: 1/1) {
    .title { max-width: 100%; font-size: 12vmin; }
  }
  /* Tall vertical covers (9:16): the words sit in the middle band, inside the crop a profile
     grid shows (platform.instagram.grid_aspect) and clear of the platforms' controls. */
  @media (max-aspect-ratio: 2/3) {
    .safe { justify-content: center; }
    .scrim { background: linear-gradient(to top, transparent 0%, var(--color-bg) 50%, transparent 100%); opacity: 0.75; }
    .title { font-size: 13vmin; }
  }
  /* Wide share images (1.91:1 and wider): a smaller title, so two lines stay clear of a 2:1
     centre crop. */
  @media (min-aspect-ratio: 185/100) {
    .title { font-size: 10vmin; max-width: 70%; }
  }

  /* The play button: hidden unless the deliverable is a newsletter's (a preview image or a
     GIF's overlay). It sits centred in the space above the words, so it never covers them. */
  [data-play-button] { display: none; }
  :root[data-deliverable^="newsletter."] [data-play-button] {
    display: block;
    position: relative;
    align-self: center;
    margin: auto 0;
    flex: none;
    width: 24vmin;
    height: 24vmin;
    box-sizing: border-box;
    border-radius: 50%;
    background: var(--color-accent);
    border: 1.2vmin solid var(--color-on-accent);
    box-shadow: 0 0 0 0.8vmin var(--color-accent);
  }
  :root[data-deliverable^="newsletter."] [data-play-button]::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 54%;
    width: 9vmin;
    height: 10vmin;
    transform: translate(-50%, -50%);
    background: var(--color-on-accent);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  /* A newsletter GIF's overlay (card.py render --transparent): only the play button and the
     words, over a transparent background, the words outlined so they read over any frame. */
  :root[data-transparent][data-deliverable^="newsletter."] body { background: transparent; }
  :root[data-transparent][data-deliverable^="newsletter."] .picture,
  :root[data-transparent][data-deliverable^="newsletter."] .scrim { display: none; }
  :root[data-transparent][data-deliverable^="newsletter."] .title,
  :root[data-transparent][data-deliverable^="newsletter."] .name {
    text-shadow: 0 0 0.6vmin var(--color-bg), 0 0 1.2vmin var(--color-bg);
  }
</style>
</head>
<body>
<main class="frame">
  <div class="picture"></div>
  <div class="scrim"></div>
  <div class="safe">
    <div class="play" data-play-button aria-hidden="true"></div>
    <p class="kicker">Kicker</p>
    <h1 class="title">The promise, in a few words</h1>
    <p class="name"><%BRAND_NAME%></p>
  </div>
</main>
</body>
</html>
