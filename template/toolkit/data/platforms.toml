checked = "04/10/2026"
source = "https://developers.google.com/search/docs/appearance/google-discover"
extra_sources = ["https://developers.google.com/search/docs/appearance/structured-data/article", "https://www.w3.org/TR/WCAG22/", "https://www.w3.org/WAI/media/av/transcripts/", "https://developers.google.com/search/docs/appearance/video"]
