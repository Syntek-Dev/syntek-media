audio_codec_alt = "mp3"
audio_bitrate = "128k"              # stereo 128-256 kbps at 44.1/48 kHz; mono 64-128 kbps
audio_bitrate_max = "256k"
audio_sample_rate = 44100           # 44.1 or 48 kHz
loudness_lufs = -16.0               # "around -16 dB LKFS, with a +/- 1 dB tolerance" (ITU-R BS.1770-5)
loudness_tolerance_db = 1.0
true_peak_db = -1.0                 # "doesn't exceed -1 dB FS"
checked = "03/10/2026"
source = "https://podcasters.apple.com/support/893-audio-requirements"

[platform.podcast.apple_connect_audio]
