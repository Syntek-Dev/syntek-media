# platforms.toml — delivery specs for every platform deliverable syntek-media cuts, encodes or briefs
#
# Read by the toolkit's ffmpeg presets (cut-for-platform, captions burn-in, repurpose), by its
# image encoder and its podcast feed, and by the thumbnail-brief skill. Each
# [platform.<name>.<format>] table is one deliverable; each [platform.<name>] table holds that
# platform's own limits; each [audiobook.<store>] table is a mastering and delivery target. Values
# come from the platform's own help centre, developer documentation or ads guide, or, for the
# brand's own sites, blogs and newsletters (which no one publishes a spec for), from browser,
# standards-body and email-vendor guidance, checked on the date in `checked`.
# Read by `python3 toolkit/media.py` and `uv run toolkit/card.py`; `media.py presets` prints it.
#
# Rules for readers:
# - A key named in `verify` was NOT confirmed from an official source on `checked`; re-check it
#   before relying on it. A key that is ABSENT means "no published value": presets keep the
#   source value (frame rate, sample rate) or skip that check (loudness, safe zone).
# - `max_size` strings are copied as the platform states them ("4 GB"); never convert units.
# - `safe_zone` is in pixels at this table's width x height; scale it for other sizes. Inside
#   safe_zone, 0 means "no margin published for that edge".
# - `caption_formats = []` means no sidecar upload is documented: burn captions in. A table with
#   kind = "image" or audio_tracks = 0 carries no caption_formats: it has no speech and takes no
#   captions (DESIGN.md D57).
# - `chosen = [...]` names keys this file fixed inside an official range (e.g. 1920x1080 inside
#   LinkedIn's 256x144-4096x2304); they are house choices, not platform rules.
# - `formats` lists an image deliverable's file formats, the first being what `media.py image`
#   writes unless --format names another of them; formats = ["gif"] marks an animated GIF, which
#   `media.py cut` makes.
#
# Template-owned: `copier update` may refresh it. Platforms change specs without notice:
# re-check every `source` at least every six months and update `checked` (DD/MM/YYYY).
# The brand's confirmed corrections never go here: each is an [[override]] table in
# brand/src/platforms/overrides.toml, which the toolkit applies and prints, so an update to this
# file never loses them (`media.py presets --stale-after 183 --today DD/MM/YYYY` lists old tables).
#
# Fields: kind (video | image | audio) · width · height · aspect ("W:H") · min_seconds ·
# max_seconds · fps_min · fps_max · container · video_codec · video_bitrate · audio_codec ·
# audio_bitrate · audio_sample_rate · loudness_lufs · true_peak_db · safe_zone {top, bottom,
# left, right} · caption_formats · max_size · max_size_mobile · checked · source · extra_sources ·
# verify · chosen · notes; and, read by the toolkit since 0.2.0, formats · alpha (false: no
# transparency; `image` flattens it, `feed check` refuses it on a cover or episode art) ·
# min_width (`feed check`, for the cover and episode art) · audio_tracks (0: no sound track) ·
# colours_max (a GIF's palette) · cbr · enclosure_type (the feed's type for the enclosed audio) ·
# id3_version (the ID3 version `feed tag` writes) · and in [platform.podcast] tag_max_chars ·
# show_description_max_bytes · episode_description_max_chars · chapters_min ·
# chapter_min_seconds · chapters_per_hour_max · chapter_title_max_chars ·
# chapter_title_max_words · explicit_values · episode_types · show_types.
# Documentary (read by people, guides and checklists, never by the toolkit): pix_fmt (the toolkit
# always writes and checks yuv420p for video) · min_height · max_width · audio_codec_alt ·
# audio_bitrate_max · loudness_tolerance_db (the toolkit's tolerance is 1 LU) · the own channels'
# platform-wide keys (embed_*, autoplay_muted_allowed, captions_required, featured_min_width and
# the other structured-data minimums, display_width, html_clip_kb, html_target_kb, image_formats,
# video_tag_supported) · and the rest of [platform.podcast] (display_max_chars,
# episodes_shown_max, max_seconds, chapters_auto_min_seconds, transcript_formats,
# transcript_max_size_spotify, feed_move_min_days, artwork_dpi).

# ---------------------------------------------------------------------------------------------
# House values: decisions, NOT platform specs (DESIGN.md D24, D62).
# No social video platform publishes a loudness target ("-14 LUFS for YouTube" is folklore, not in
# YouTube's help), and no web or blog source publishes one either, so every video deliverable,
# social or for the brand's own sites, masters to -14 LUFS integrated and -1 dBTP by house
# decision: one master's cuts go to both. Podcast loudness, the self-hosted feed's audio included,
# comes from [platform.podcast.apple_rss_audio]; audiobook targets from [audiobook.acx], which ACX
# measures in RMS, peak and noise floor, not LUFS.
[house]
social_loudness_lufs = -14.0
social_true_peak_db = -1.0
basis = "house decision: no social or web platform publishes a loudness target for video"
checked = "04/10/2026"
source = "DESIGN.md D24"

# =============================================================================================
# YouTube
# =============================================================================================
[platform.youtube]
title_max_chars = 100
description_max_chars = 5000
hashtags_ignored_over = 60          # "more than 60 hashtags" -> every hashtag on that content ignored
hashtags_shown_by_title = 3         # up to three, chosen by YouTube from the description
checked = "03/10/2026"
source = "https://support.google.com/youtube/answer/57404?hl=en"
extra_sources = ["https://support.google.com/youtube/answer/6390658?hl=en"]   # scrub: allow — a help-centre article ID, not personal data

[platform.youtube.long]
kind = "video"
width = 1920
height = 1080
aspect = "16:9"
max_seconds = 43200                 # 12 hours or 256 GB, whichever is less
max_seconds_unverified = 900        # default 15-minute cap until the account is verified
container = "mp4"                   # moov atom at the front (faststart), no edit lists
video_codec = "h264"                # High profile, progressive, 2 consecutive B-frames, closed GOP, CABAC, 4:2:0
pix_fmt = "yuv420p"
colour = "bt709"
video_bitrate = "8M"                # 1080p at 24/25/30 fps; 12M at 48/50/60 fps
video_bitrate_high_fps = "12M"
fps_allowed = [24, 25, 30, 48, 50, 60]   # "should match original recording" - presets keep source fps
audio_codec = "aac"                 # AAC-LC (Opus also accepted)
audio_bitrate = "384k"              # stereo; mono 128k; 5.1 512k
audio_sample_rate = 48000
caption_formats = ["srt", "sbv", "sub", "mpsub", "lrc", "cap", "smi", "sami", "rt", "vtt", "ttml", "dfxp", "scc", "stl", "tds", "cin", "asc"]
max_size = "256 GB"
checked = "03/10/2026"
source = "https://support.google.com/youtube/answer/1722171?hl=en"   # scrub: allow — a help-centre article ID, not personal data
extra_sources = ["https://support.google.com/youtube/answer/71673?hl=en", "https://support.google.com/youtube/answer/2734698?hl=en"]   # scrub: allow — a help-centre article ID, not personal data
notes = "No safe zone published for 16:9 long-form; 4K (3840x2160) bitrate 35-45M at 24-30 fps."

[platform.youtube.short]
