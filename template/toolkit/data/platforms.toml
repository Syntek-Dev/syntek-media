# =============================================================================================
# Website (the sites the brand publishes media to, its own and any it writes for: one `website`
# platform covers every such site; the specs are the same for each, and which site a piece goes
# to is a row of the brand's website profile, never a table here, DESIGN.md D53)
# No web platform publishes a delivery spec: the deliverable tables below are house choices
# inside browser and standards guidance (MDN, web.dev, Apple's HLS authoring ladder), so their
# sizes and bit rates are named in `chosen`. Loudness: none published for the web; video takes
# [house] (DESIGN.md D62).
# =============================================================================================
[platform.website]
embed_min_viewport = 200            # YouTube: "Embedded players must have a viewport that is at least 200px by 200px"
embed_min_width = 480               # YouTube: 16:9 players "at least 480 pixels wide and 270 pixels tall"
embed_min_height = 270
embed_host = "www.youtube-nocookie.com"   # privacy-enhanced mode: views do not personalise YouTube or ads
autoplay_muted_allowed = true       # Chrome, Safari and Firefox all allow muted autoplay; sound needs a user gesture
captions_required = true            # WCAG 2.2 SC 1.2.2 Captions (Prerecorded), Level A
checked = "04/10/2026"
source = "https://developers.google.com/youtube/player_parameters"
extra_sources = ["https://support.google.com/youtube/answer/171780?hl=en", "https://developer.chrome.com/blog/autoplay", "https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Autoplay", "https://www.w3.org/TR/WCAG22/"]   # scrub: allow — a help-centre article ID, not personal data
notes = "Embedding a YouTube upload instead of self-hosting: use the youtube.long render and its captions; embed from www.youtube-nocookie.com behind a click-to-load facade. Muted autoplay also needs playsinline for iPhone Safari; iOS Low Power Mode blocks even muted autoplay (WebKit bug 219889, by design: unconfirmed from WebKit's own text), so every autoplaying video needs a poster that stands on its own."

[platform.website.video]
kind = "video"
width = 1920
height = 1080
aspect = "16:9"
container = "mp4"                   # +faststart: moov atom at the front, so playback starts before the download ends
video_codec = "h264"                # MDN: H.264 plays in every browser; the baseline every page serves
pix_fmt = "yuv420p"
video_bitrate = "6M"                # Apple HLS ladder: 1920x1080 at 6000 kbps (top rung 7800 kbps)
audio_codec = "aac"                 # AAC-LC stereo; Apple HLS: 32-160 kbps
audio_bitrate = "128k"
audio_sample_rate = 48000
caption_formats = ["vtt"]           # WebVTT through <track kind="captions" srclang="en-GB">, never burned in
checked = "04/10/2026"
source = "https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Formats/Video_codecs"
extra_sources = ["https://developer.apple.com/documentation/http-live-streaming/hls-authoring-specification-for-apple-devices", "https://ffmpeg.org/ffmpeg-formats.html", "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/video", "https://web.dev/learn/performance/video-performance"]
chosen = ["width", "height", "video_bitrate", "audio_bitrate"]
notes = "Self-hosted <video controls preload=\"metadata\" playsinline poster=…>. No browser or standard publishes a size, length or file-size limit: the hosting or CMS sets one. The bit rates are Apple's HLS ladder rungs used as caps for a single progressive file. A WebM (AV1 or VP9) source offered before the MP4 is deferred (DESIGN.md D57): the MP4 plays in every browser, and AV1 in Safari needs hardware decode (M3 Macs, iPhone 15 Pro and later)."

[platform.website.video_720]
kind = "video"
width = 1280
height = 720
aspect = "16:9"
container = "mp4"
video_codec = "h264"
pix_fmt = "yuv420p"
video_bitrate = "3M"                # Apple HLS ladder: 1280x720 at 3000 kbps (also 4500 kbps)
audio_codec = "aac"
audio_bitrate = "128k"
audio_sample_rate = 48000
caption_formats = ["vtt"]
checked = "04/10/2026"
source = "https://developer.apple.com/documentation/http-live-streaming/hls-authoring-specification-for-apple-devices"
extra_sources = ["https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Formats/Video_codecs"]
chosen = ["width", "height", "video_bitrate", "audio_bitrate"]
notes = "The lighter cut for an in-page player narrower than about 960 CSS px, or a page where weight matters more than sharpness. Its poster is website.poster_720."

[platform.website.hero_loop]
kind = "video"
width = 1280
height = 720
aspect = "16:9"
container = "mp4"
video_codec = "h264"
pix_fmt = "yuv420p"
video_bitrate = "3M"
audio_tracks = 0                    # no sound track at all: <video autoplay muted loop playsinline>; the toolkit writes none and fails a file with one
checked = "04/10/2026"
source = "https://web.dev/articles/replace-gifs-with-videos"
extra_sources = ["https://developer.chrome.com/blog/autoplay", "https://webkit.org/blog/6784/new-video-policies-for-ios/", "https://hacks.mozilla.org/2019/02/firefox-66-to-block-automatically-playing-audible-video-and-audio/", "https://www.w3.org/TR/WCAG22/", "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media/prefers-reduced-motion"]
chosen = ["width", "height", "video_bitrate", "audio_tracks"]
notes = "A silent background or hero loop. WebKit lets a video with no audio track autoplay without a gesture; Chrome and Firefox allow muted autoplay. WCAG 2.2 SC 2.2.2 (Level A): motion that starts by itself and lasts over 5 s needs a visible pause control; honour prefers-reduced-motion by showing the poster (website.poster_720) instead; SC 2.3.1: nothing flashes more than three times a second. A decorative loop carries no words and takes no captions. A WebM source offered before the MP4 is deferred (DESIGN.md D57)."

[platform.website.poster]
kind = "image"
width = 1920
height = 1080
aspect = "16:9"
formats = ["jpg", "webp"]           # the poster attribute takes one URL (no <picture> fallback): AVIF is not safe there
checked = "04/10/2026"
source = "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/video"
extra_sources = ["https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Formats/Image_types", "https://web.dev/learn/performance/video-performance"]
chosen = ["width", "height"]
notes = "Same size and aspect as the video it fronts (website.video); website.video_720 and website.hero_loop take website.poster_720. It is the LCP candidate above the fold: never lazy-load it there. WebP plays in every current browser (Safari 14+ on macOS 11+)."

[platform.website.poster_720]
kind = "image"
width = 1280
height = 720
aspect = "16:9"
formats = ["jpg", "webp"]           # the poster attribute takes one URL (no <picture> fallback): AVIF is not safe there
checked = "04/10/2026"
source = "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/video"
extra_sources = ["https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Formats/Image_types", "https://web.dev/learn/performance/video-performance"]
chosen = ["width", "height"]
notes = "Fronts website.video_720 and website.hero_loop, at their size; otherwise as website.poster."

[platform.website.og_image]
kind = "image"
width = 1200
height = 630
aspect = "1.91:1"
min_width = 1200                    # LinkedIn: "Minimum image dimensions: 1200 (w) x 627 (h) pixels"
formats = ["jpg", "png"]
max_size = "5 MB"                   # LinkedIn 5 MB and X 5 MB are the tightest; Facebook allows 8 MB
safe_zone = { top = 15, bottom = 15, left = 0, right = 0 }
checked = "04/10/2026"
source = "https://developers.facebook.com/docs/sharing/webmasters/images/"
extra_sources = ["https://www.linkedin.com/help/linkedin/answer/46687", "https://ogp.me/", "https://developer.x.com/en/docs/x-for-websites/cards/overview/summary-card-with-large-image"]
chosen = ["formats"]
verify = ["safe_zone", "max_size"]
notes = "og:image with og:image:width, og:image:height and og:image:alt. Facebook: at least 1200x630, about 1.91:1, minimum 200x200, at most 8 MB. LinkedIn: minimum 1200x627, 1.91:1, at most 5 MB; under 401 px wide shows as a thumbnail. X (summary_large_image): 2:1, 300x157 to 4096x4096, under 5 MB, JPG/PNG/WEBP/GIF (first frame), alt text up to 420 characters: X's card documentation no longer loads (redirects to docs.x.com/overview, 04/10/2026), so the X values come from search snippets of it. The safe_zone is DERIVED: X's 2:1 centre crop of 1200x630 removes 15 px top and bottom."

# =============================================================================================
# Blog (dated posts on those sites: the video, its transcript and its images)
# =============================================================================================
[platform.blog]
featured_min_width = 1200           # Google Discover: large images "at least 1200 px wide", with max-image-preview:large
featured_min_pixels = 300000        # Discover: "more than 300,000 total pixels"
featured_aspect = "16:9"            # Discover: 16x9
