loudness_lufs = -16.0
loudness_tolerance_db = 1.0
true_peak_db = -1.0
checked = "03/10/2026"
source = "https://podcasters.apple.com/support/893-audio-requirements"
notes = "A single-channel file is rejected: mono sources must be sent as two identical channels."

[platform.podcast.spotify_audio]
