# =============================================================================================
# Podcast (Apple Podcasts and Spotify, from the show's own feed or a host)
# =============================================================================================
# Platform-wide limits and the self-hosted feed (DESIGN.md D58, D59). A show kept on a podcast
# host delivers podcast.apple_rss_audio to that host; a self-hosted show's feed encloses
# podcast.feed_audio, and `media.py feed` writes the feed from the show's register.
[platform.podcast]
show_description_max_bytes = 4000       # Apple: <description> "maximum amount of text allowed for this tag is 4000 bytes"
episode_description_max_chars = 10000   # Apple: episode <description> "up to 10,000 characters"
tag_max_chars = 255                     # Apple: "Tag values are limited to 255 characters unless otherwise specified"
display_max_chars = 20                  # Spotify spec 4.3: consumer-facing elements other than descriptions "should not exceed 20 characters" (advice)
episodes_shown_max = 2000               # Apple "will display the latest 2,000 episodes"
max_seconds = 43200                     # Spotify: "A maximum duration of 12 hours ... is recommended/supported"
chapters_min = 3                        # Apple, Spotify and YouTube all ask for at least three, the first at 00:00
chapter_min_seconds = 120               # Apple best practice "no shorter than two minutes" (Spotify 30 s, YouTube 10 s)
chapters_per_hour_max = 6               # Apple best practice "no more than six chapters per hour"
chapter_title_max_chars = 45            # Apple: chapter titles "no more than 45 characters"
chapter_title_max_words = 4             # Apple: "less than five words"
chapters_auto_min_seconds = 600         # Apple generates chapters for English full and bonus episodes of 10 minutes or more unless supplied or switched off
transcript_formats = ["vtt", "srt"]     # Apple: text/vtt, application/srt, application/x-subrip, VTT preferred; Spotify upload: VTT or SRT
transcript_max_size_spotify = "5 MB"    # Spotify for Creators transcript upload
feed_move_min_days = 28                 # Apple: keep the 301 and <itunes:new-feed-url> "for at least four weeks"
explicit_values = ["true", "false"]     # Apple; Spotify also reads yes, no and clean
episode_types = ["full", "trailer", "bonus"]   # lower case, as Apple's sample feed writes them
show_types = ["episodic", "serial"]     # serial needs <itunes:episode> on every episode
artwork_dpi = 72                        # Apple: show and episode art "72 dpi ... RGB colorspace", no alpha channel
checked = "04/10/2026"
source = "https://help.apple.com/itc/podcasts_connect/en.lproj/itcb54353390.html"
extra_sources = ["https://podcasters.apple.com/support/823-podcast-requirements", "https://podcasters.apple.com/support/5482-using-chapters-on-apple-podcasts", "https://podcasters.apple.com/support/5316-transcripts-on-apple-podcasts", "https://podcasters.apple.com/support/change-the-rss-feed-url", "https://help.apple.com/itc/podcasts_connect/en.lproj/itcbaf351599.html", "https://providersupport.spotify.com/article/podcast-delivery-specification-1-9", "https://support.spotify.com/us/creators/article/transcripts/", "https://support.spotify.com/us/creators/article/episode-chapters/", "https://support.google.com/youtube/answer/9884579?hl=en-GB"]   # scrub: allow — a help-centre article ID, not personal data
verify = ["display_max_chars", "chapter_title_max_words"]
notes = "One feed per show, served from a site the brand owns: Apple Podcasts and Spotify ingest it and YouTube may (RSS ingestion builds a still video from the show art). Apple needs HTTP HEAD and byte-range requests on the audio host, HEAD with Last-Modified on the artwork host, ASCII file names and URLs, a GUID that never changes, RFC 2822 dates and a unique enclosure per episode. Spotify re-downloads audio or art only when its file name or path changes, and YouTube never replaces an ingested episode's audio: a corrected file is published under a new URL with the same GUID. Spotify reads chapters from Podlove Simple Chapters (psc 1.1) or description timestamps; Apple from podcast:chapters JSON, ID3 or description timestamps. Spotify's spec has no podcast:transcript; its transcript is uploaded in Spotify for Creators (VERIFY whether it now reads the tag)."

[platform.podcast.feed_audio]
kind = "audio"
audio_codec = "mp3"                     # the file the brand's own feed encloses; Apple RSS accepts MP3 or AAC, Spotify MP3 (128k+) or AAC-LC
audio_bitrate = "128k"                  # inside Apple's RSS ranges (mono 64-128k, stereo 128-256k at 44.1/48 kHz) and Spotify's "128kbps+"
cbr = true                              # constant bit rate: byte offset is proportional to time for byte-range seeking
audio_sample_rate = 44100
max_seconds = 43200                     # Spotify: 12 hours recommended/supported
enclosure_type = "audio/mpeg"           # Apple's and RSS 2.0's type for MP3
id3_version = 3                         # ID3v2.3, as the toolkit already writes for audiobook masters
checked = "04/10/2026"
source = "https://podcasters.apple.com/support/893-audio-requirements"
extra_sources = ["https://podcasters.apple.com/support/823-podcast-requirements", "https://providersupport.spotify.com/article/podcast-delivery-specification-1-9", "https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Formats/Audio_codecs"]
chosen = ["audio_codec", "audio_bitrate", "cbr", "audio_sample_rate", "id3_version"]
notes = "One file serves Apple Podcasts, Spotify, the website's <audio> player and, where used, YouTube's RSS ingestion. MP3 is a house choice against Apple's advice ('For RSS feeds, we strongly recommend using AAC'): MDN notes AAC is not available in Chromium builds and Firefox relies on the platform's AAC decoder, while MP3 plays in every browser; an AAC brand overrides audio_codec to aac and enclosure_type to audio/x-m4a. Loudness is [platform.podcast.apple_rss_audio]'s (DESIGN.md D24), set on the master before encoding; the encoded file is measured too, because Apple warns that encoding 'might clip the signal'. 128k is the one rate inside both Apple's mono and stereo ranges and Spotify's floor. Encoded untagged at M5; `media.py feed tag` writes its ID3 tags, chapters and cover at M7."

[platform.podcast.id3_cover]
kind = "image"
width = 1400
height = 1400
aspect = "1:1"
formats = ["jpg"]
alpha = false
checked = "04/10/2026"
source = "https://podcasters.apple.com/support/5514-show-cover-template"
chosen = ["width", "height", "formats"]
notes = "The copy of the show's cover embedded in feed_audio's ID3 APIC frame, for players that read the file and not the feed, encoded with `media.py image` from the cover's design export, as podcast.cover is. Apple and Spotify read <itunes:image>, never this copy; 1400 is Apple's RSS minimum, chosen to keep the file small."

[platform.podcast.apple_rss_audio]
kind = "audio"
