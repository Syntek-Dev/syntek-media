# =============================================================================================
# Newsletter (email: no client plays video reliably, so a piece reaches a newsletter as a still
# or a short GIF linking to its watch page)
# =============================================================================================
[platform.newsletter]
display_width = 600                 # house: inside the 600-640 px body width; Mailchimp's builders are 600 and 660 px
html_clip_kb = 102                  # Gmail clips a message whose HTML passes about 102 KB (images not counted)
html_target_kb = 80                 # Email on Acid: stay under 80 KB, since the sender's tracking links add weight
image_formats = ["jpg", "png", "gif"]   # WebP: no classic Outlook for Windows, Gmail converts it to JPEG
video_tag_supported = false         # Gmail strips <video>; about a quarter of clients play it (caniemail)
checked = "04/10/2026"
source = "https://www.emailonacid.com/blog/article/email-development/gmail-email-clipping/"
extra_sources = ["https://mailchimp.com/help/image-requirements-for-templates/", "https://www.caniemail.com/features/html-video/", "https://www.caniemail.com/features/image-webp/", "https://www.litmus.com/blog/video-in-email", "https://www.litmus.com/blog/the-ultimate-guide-to-dark-mode-for-email-marketers"]
chosen = ["display_width", "html_target_kb"]
verify = ["html_clip_kb", "image_formats", "video_tag_supported"]
notes = "Google publishes no clipping size: 102 KB comes from Email on Acid and Litmus testing, and clipping can come sooner; html_target_kb is Email on Acid's 80 KB used as a house budget. image_formats and video_tag_supported come from third-party client testing (caniemail, Litmus). The pattern for a video: a still or GIF from the piece with a play button drawn on it, linked to the watch page (website, blog or YouTube), and a text link beside it. Every image takes alt text (WCAG 2.2 SC 1.1.1): classic Outlook blocks downloaded pictures by default. Dark mode (Litmus, 27/02/2025): Apple Mail and desktop Gmail change no colours; Outlook.com and the Outlook mobile apps invert partly; the Gmail iOS app, Outlook 2021 for Windows and Windows Mail invert fully; Gmail supports no prefers-color-scheme (caniemail). Use transparent PNGs with a light outline for logos and dark text."

[platform.newsletter.preview_image]
kind = "image"
width = 1200
height = 675
aspect = "16:9"
formats = ["jpg", "png"]
max_size = "1 MB"                   # Mailchimp: "We recommend a maximum file size of 1MB for images"
checked = "04/10/2026"
source = "https://mailchimp.com/help/image-requirements-for-templates/"
extra_sources = ["https://www.litmus.com/blog/video-in-email", "https://www.litmus.com/blog/the-ultimate-guide-to-dark-mode-for-email-marketers"]
chosen = ["width", "height", "max_size"]
notes = "Twice the 600 px display width (Mailchimp: images 600-1200 px in its 600 px builder, 660-1320 px in its 660 px one), shown with width=\"600\". A frame of the piece with a large play button on it, linked to the watch page; alt text names the video and says it opens a video. A JPEG for a photo, a PNG only where it needs transparency. max_size is Mailchimp's recommendation, used as a house budget."

[platform.newsletter.preview_gif]
kind = "image"
width = 600
height = 338
aspect = "16:9"
formats = ["gif"]
max_seconds = 5                     # WCAG 2.2 SC 2.2.2: motion over 5 s that starts by itself needs a pause control, which email cannot give
fps_max = 15
colours_max = 128
max_size = "1 MB"                   # Litmus and Mailchimp: keep a GIF under 1 MB
checked = "04/10/2026"
source = "https://www.litmus.com/blog/a-guide-to-animated-gifs-in-email"
extra_sources = ["https://www.litmus.com/blog/animated-gifs-in-email-10-tips-for-keeping-files-sizes-small", "https://www.caniemail.com/features/image-gif/", "https://support.microsoft.com/en-US/Outlook/the-animated-graphic-in-my-e-mail-message-doesn-t-work", "https://learn.microsoft.com/en-us/microsoft-365-apps/outlook/get-started/guide-product-availability", "https://email-dev.com/animated-gifs-in-email/", "https://www.w3.org/TR/WCAG22/"]
chosen = ["width", "height", "max_seconds", "colours_max", "max_size"]
verify = ["fps_max"]
notes = "The FIRST FRAME carries the message and the play button: classic Outlook for Windows 2007-2019 shows only the first frame, Outlook for Microsoft 365 plays it three times and then shows a play button (caniemail), and Outlook for Microsoft 365, 2021 and 2024 show only the first frame where Windows animation effects are off (Microsoft). Classic Outlook stays supported until at least 2029; new Outlook (Chromium-based) animates. Litmus asks for 2x size for retina; this table keeps 1x because a 2x GIF of footage rarely fits 1 MB. Colours: Litmus suggests 128-256 for video and 64-128 for illustration. fps_max (10-15) comes from a third-party guide only. It plays floor(max_seconds / clip seconds) times, written as the GIF's loop count, so motion stops within max_seconds; nothing flashes more than three times a second (SC 2.3.1). Over max_size it is made again at half the frame rate, keeping every second frame, then at a quarter (Litmus: 'keep every second frame, or one in four'). max_size is a house budget inside Litmus's and Mailchimp's advice."

