<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type — <%BRAND_NAME%></title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    box-sizing: border-box;
    padding: calc(var(--space-unit) * 5);
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-weight: var(--weight-body);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: calc(var(--space-unit) * 3);
  }
  .token { margin: 0; font-family: var(--font-body); font-size: 2.2vmin; color: var(--color-text-muted); }
  .display { margin: 0; font-family: var(--font-display); font-weight: var(--weight-display); font-size: 11vmin; line-height: 1.02; }
  .heading { margin: 0; font-family: var(--font-display); font-weight: var(--weight-display); font-size: 6vmin; line-height: 1.1; }
  .body { margin: 0; font-size: 3.4vmin; line-height: 1.4; max-width: 60ch; }
  .muted { margin: 0; font-size: 2.8vmin; color: var(--color-text-muted); }
</style>
</head>
<body>
<p class="token">--font-display · --weight-display</p>
<p class="display">Seen at a glance</p>
<p class="heading">A heading for a title card</p>
<p class="token">--font-body · --weight-body</p>
<p class="body">Body text for longer lines on a card, set in the body face at its weight, so a sentence reads at a distance and on a small screen alike.</p>
<p class="muted">Muted text for a byline, a date or a credit.</p>
</body>
</html>
