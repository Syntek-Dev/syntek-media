<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail — 000-example-piece</title>
<link rel="stylesheet" href="../../../brand/src/design-system/tokens.css">
<!--
  The worked example's thumbnail layout, seeded once with the project. It is a copy of the
  brand's thumbnail component, brand/src/design-system/previews/thumbnail.html, with the path
  to tokens.css fixed for this folder and only the words changed. It sets no picture yet, so
  the brand's surface colour stands in; the brief beside it, 000-example-piece.md, says which
  frame goes there once the master exists. A layout change belongs in the brand's component.
-->
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-weight: var(--weight-body);
  }
  .frame { position: relative; width: 100%; height: 100%; }
  .picture {
    position: absolute;
    inset: 0;
    background: var(--picture, none) center / cover no-repeat, var(--color-surface);
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, var(--color-bg) 0%, transparent 70%);
    opacity: 0.9;
  }
  .safe {
    position: absolute;
    top: var(--safe-top, 0px);
    right: var(--safe-right, 0px);
    bottom: var(--safe-bottom, 0px);
    left: var(--safe-left, 0px);
    box-sizing: border-box;
    padding: calc(var(--space-unit) * 5);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: calc(var(--space-unit) * 2);
  }
  .kicker {
    margin: 0;
    align-self: flex-start;
    padding: calc(var(--space-unit) * 0.75) calc(var(--space-unit) * 2);
    border-radius: var(--radius);
    background: var(--color-accent);
    color: var(--color-on-accent);
    font-size: 4vmin;
  }
  .title {
    margin: 0;
    max-width: 75%;
    font-family: var(--font-display);
    font-weight: var(--weight-display);
    font-size: 11vmin;
    line-height: 1.02;
  }
  .name { margin: 0; font-size: 3.5vmin; color: var(--color-text-muted); }

  /* Square and portrait covers (1:1, 4:5, 3:4): the title takes the full width. */
  @media (max-aspect-ratio: 1/1) {
    .title { max-width: 100%; font-size: 12vmin; }
  }
  /* Tall vertical covers (9:16): the words sit in the middle band, inside the crop a profile
     grid shows (platform.instagram.grid_aspect) and clear of the platforms' controls. */
  @media (max-aspect-ratio: 2/3) {
    .safe { justify-content: center; }
    .scrim { background: linear-gradient(to top, transparent 0%, var(--color-bg) 50%, transparent 100%); opacity: 0.75; }
    .title { font-size: 13vmin; }
  }
</style>
</head>
<: if BRAND_KIND == 'business' :><body>
<main class="frame">
  <div class="picture"></div>
  <div class="scrim"></div>
  <div class="safe">
    <p class="kicker">Meetings</p>
    <h1 class="title">Write the decision first</h1>
    <p class="name"><%BRAND_NAME%></p>
  </div>
</main>
</body>
<: elif BRAND_KIND == 'author-fiction' :><body>
<main class="frame">
  <div class="picture"></div>
  <div class="scrim"></div>
  <div class="safe">
    <p class="kicker">A new novel</p>
    <h1 class="title">What moves in the river?</h1>
    <p class="name"><%BRAND_NAME%></p>
  </div>
</main>
</body>
<: else :><body>
<main class="frame">
  <div class="picture"></div>
  <div class="scrim"></div>
  <div class="safe">
    <p class="kicker">From the next book</p>
    <h1 class="title">Remember their name?</h1>
    <p class="name"><%BRAND_NAME%></p>
  </div>
</main>
</body>
<: endif :></html>
