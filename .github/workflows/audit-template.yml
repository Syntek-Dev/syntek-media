name: Audit — Template Integrity

# Every audit and test in DESIGN.md Section 7, on every push to every branch.
#
# NO PATH FILTER AND NO BRANCH FILTER ON PUSH. A template-integrity defect is invisible until
# somebody generates, and whoever generates is not whoever broke it (syntek-base, 15–16/08/2026:
# seventeen commits ran blind and five shipped a template that could not generate at all). A
# gate that waits for a pull request lets a feature branch drift for as long as it lives.
#
# THREE JOBS, in parallel, and an advisory fourth. [1/3] reads the template source and the repository root (its
# settings and community files); [2/3] renders every brand kind and profile once, standalone
# and over syntek-author, and audits the renders; [3/3] performs a real update, and applies
# media over a real syntek-author project and the other way round, each in its own scratch
# project. Every script's --self-test runs before its real run: a detector nobody
# has seen fail is a detector nobody knows works. Failures ACCUMULATE as ::error:: lines and the
# job fails at the end, so one broken gate never hides the next. The fourth, 'syntek-author main
# (advisory)', runs coexist-test.sh against syntek-author's default branch and reports what it
# finds as warnings only: it never fails the run and is not a required check.
#
# SYNTEK-AUTHOR ARRIVES BY A PLAIN SHELL STEP (DESIGN.md D27), AT A PINNED TAG (D85). Jobs 2 and
# 3 clone it at SYNTEK_AUTHOR_TAG, the release media vendors from, into the
# runner's temporary folder and export SYNTEK_AUTHOR_DIR through the environment file. A clone
# that fails prints a warning and the scripts that need it report a named SKIP, exit 0 — never a
# pass, and never grounds for a release tag. A second checkout action would turn a missing or
# private repository into a red job, and a token would need expression syntax.
#
# NO JOB MATRIX AND NO SECRET. Both need GitHub's expression syntax, which GitHub parses
# anywhere in a workflow file, even inside a run block. The dollar-brace-brace sequence appears
# only in the concurrency block (group and cancel-in-progress); no run: step, matrix or secret
# uses it. Render paths are a shell loop instead, and values pass between steps through
# $GITHUB_ENV. No step has an ElevenLabs key: no test calls the service.
#
# Locally, one command does all three: bash .github/scripts/run-all.sh --author ../syntek-author
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run it replaces on the same branch or pull request, so that run is
# cancelled; the push and pull_request runs of one commit are separate groups and both finish.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Copier commits inside its own scratch repositories during an update, and the runner has no
  # git identity; without one, every update test fails on "Please tell me who you are".
  GIT_AUTHOR_NAME: syntek-media audit
  GIT_AUTHOR_EMAIL: audit@example.com
  GIT_COMMITTER_NAME: syntek-media audit
  GIT_COMMITTER_EMAIL: audit@example.com
  # The syntek-author release media vendors from (DESIGN.md D85, Section 7). Jobs 2 and 3 test
  # against it, so syntek-author's main moving never turns this run red; bump it at each
  # adoption, with coexist-test.sh --refresh-names (check 20 fails while the two disagree).
  SYNTEK_AUTHOR_TAG: v0.7.0
  # Python 3.14 is media's base (DESIGN.md D81). setup-python alone does not choose the Python
  # uvx runs Copier on: uv prefers a managed interpreter it already has. Below 3.14 the vendored
  # scripts' self-tests fail, and the outside-link stages do nothing, so update-test.sh check 20
  # stops with ForbiddenPathError. _common.sh refuses an older UV_PYTHON or python3 (exit 2).
  UV_PYTHON: "3.14"

jobs:
  source:
    name: "[1/3] Template source"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Tokens, the generated mode-file block, pairs and routed shapes, the line cap, personal
      # data, development isolation, the community files (D83), seeds and skills — every one
      # reads template/ or the repository root, and none renders anything. skill-conformance.sh
      # check 20 reads the frozen syntek-author names and never skips. Then the self-tests of
      # the family-shared scripts media vendors byte for byte from syntek-author (DESIGN.md D76,
      # D80, D85; syntek-author D48; family-shared.json records them and shipped-seeds.sh checks
      # 21 and 25 hold them to it): migrations/agents-outside-link.py, both stages in temporary
      # folders, after a normal update and after a stop that left a link, a folder or a file at
      # .agents, with the printed hand fix run step by step under sh; then the data-root resolver
      # and the permissions script every project receives, template/.claude/syntek-media-
      # dataroot.py and syntek-media-permissions.py, with SYNTEK_DATA_ROOT unset, so neither
      # self-test can reach a real data root. Since 0.6.0 (D81) also migrations/family-update.py,
      # the vendored update script, with SYNTEK_DATA_ROOT unset, on Python 3.14 as every step is.
      - name: Prove each detector, then run it on the template source
        run: |
          status=0
          for s in check-template-tokens gen-mode-excludes docs-pairing line-cap scrub \
                   dev-isolation community-files shipped-seeds skill-conformance; do
            echo "::group::$s"
            bash ".github/scripts/$s.sh" --self-test \
              || { echo "::error::$s — the self-test no longer separates good input from bad"; status=1; }
            if [ "$s" = gen-mode-excludes ]; then
              bash ".github/scripts/$s.sh" --check || { echo "::error::$s — copier.yml's mode-file block has drifted from the files on disk"; status=1; }
            else
              bash ".github/scripts/$s.sh" || { echo "::error::$s — findings in the template source"; status=1; }
            fi
            echo "::endgroup::"
          done
          echo "::group::agents-outside-link.py"
          python3 migrations/agents-outside-link.py --self-test \
            || { echo "::error::agents-outside-link.py — the vendored migration's self-test failed"; status=1; }
          echo "::endgroup::"
          echo "::group::family-update.py"
          env -u SYNTEK_DATA_ROOT python3 migrations/family-update.py --self-test \
            || { echo "::error::family-update.py — the vendored update script's self-test failed"; status=1; }
          echo "::endgroup::"
          echo "::group::syntek-media-dataroot.py"
          env -u SYNTEK_DATA_ROOT python3 template/.claude/syntek-media-dataroot.py --self-test \
            || { echo "::error::syntek-media-dataroot.py — the vendored data-root resolver's self-test failed"; status=1; }
          echo "::endgroup::"
          echo "::group::syntek-media-permissions.py"
          env -u SYNTEK_DATA_ROOT python3 template/.claude/syntek-media-permissions.py --self-test \
            || { echo "::error::syntek-media-permissions.py — the vendored permissions script's self-test failed"; status=1; }
          echo "::endgroup::"
          exit $status

  renders:
    name: "[2/3] Renders"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Copier reads the template over git

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # ffmpeg is a short apt install and runs the toolkit end to end on every render, so
      # toolkit-smoke.sh gets --require-ffmpeg: a missing ffmpeg is an error here, never a skip.
      # Playwright's Chromium is not installed (slow, and the card renders are proved locally);
      # toolkit-smoke.sh names the thumbnail and card checks it skipped, never passes them.
      # No audit builds WhisperX or fetches models: transcribe.py's stdlib self-test runs as
      # python3, and live alignment SKIPs by name unless a prepared interpreter is supplied.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Fetch syntek-author at its pinned tag, or warn
        run: |
          if git clone --quiet --depth 1 --branch "$SYNTEK_AUTHOR_TAG" https://github.com/Syntek-Dev/syntek-author "$RUNNER_TEMP/syntek-author"; then
            echo "SYNTEK_AUTHOR_DIR=$RUNNER_TEMP/syntek-author" >> "$GITHUB_ENV"
            echo "syntek-author at $SYNTEK_AUTHOR_TAG ($(git -C "$RUNNER_TEMP/syntek-author" rev-parse --short HEAD))"
          else
            echo "::warning::syntek-author could not be cloned — the renders over it will report SKIP, which is never a pass"
          fi

      - name: Prove the renderer
        run: bash .github/scripts/generate-all.sh --self-test

      # Every BRAND_KIND × profile: defaults, all (every platform and media kind) and minimal
      # (one of each, SEED_EXAMPLES=false), plus each kind over its syntek-author variant when
      # SYNTEK_AUTHOR_DIR is set. The negative paths are the ones that rot silently.
      - name: Render every brand kind and profile
        run: |
          status=0
          bash .github/scripts/generate-all.sh "$RUNNER_TEMP/renders" > "$RUNNER_TEMP/trees.txt" \
            || { echo "::error::generate-all — at least one render failed, or a check on the renders found something (its log is beside it)"; status=1; }
          echo "rendered:"; cat "$RUNNER_TEMP/trees.txt"
          [ -s "$RUNNER_TEMP/trees.txt" ] || { echo "::error::generate-all — nothing rendered at all"; exit 1; }
          exit $status

      # byte-identity.sh compares standalone renders only: a tree over syntek-author holds
      # syntek-author's shared files by design. Every other audit reads each over-author tree's
      # <render>.owned and checks only the paths media added (DESIGN.md Section 7).
      - name: Prove each detector, then run it on every render
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/trees.txt" ] || { echo "::error::no renders to audit"; exit 1; }
          mapfile -t trees < "$RUNNER_TEMP/trees.txt"
          standalone=()
          for t in "${trees[@]}"; do
            case "$t" in
              *--over-author) ;;
              *) standalone+=("$t") ;;
            esac
          done
          status=0
          for s in shipped-brands byte-identity doc-references docs-pairing shipped-seeds \
                   skill-conformance line-cap toolkit-smoke; do
            echo "::group::$s"
            bash ".github/scripts/$s.sh" --self-test \
              || { echo "::error::$s — the self-test no longer separates good input from bad"; status=1; }
            case "$s" in
              byte-identity) set -- "${standalone[@]}" ;;
              toolkit-smoke) set -- --require-ffmpeg "${trees[@]}" ;;
              *)             set -- "${trees[@]}" ;;
            esac
            bash ".github/scripts/$s.sh" "$@" \
              || { echo "::error::$s — findings in the renders"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  lifecycle:
    name: "[3/3] Update and coexistence"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Fetch syntek-author at its pinned tag, or warn
        run: |
          if git clone --quiet --depth 1 --branch "$SYNTEK_AUTHOR_TAG" https://github.com/Syntek-Dev/syntek-author "$RUNNER_TEMP/syntek-author"; then
            echo "SYNTEK_AUTHOR_DIR=$RUNNER_TEMP/syntek-author" >> "$GITHUB_ENV"
            echo "syntek-author at $SYNTEK_AUTHOR_TAG ($(git -C "$RUNNER_TEMP/syntek-author" rev-parse --short HEAD))"
          else
            echo "::warning::syntek-author could not be cloned — coexist-test.sh will report SKIP, which is never a pass and never grounds for a release"
          fi

      # Each test renders its own scratch project from a snapshot of this checkout, acts as an
      # author (or as the second template), and asserts what an update or a second template left
      # behind. coexist-test.sh needs SYNTEK_AUTHOR_DIR, and so does the over-author half of
      # update-test.sh check 24, which also reads this checkout's release tags (fetch-depth: 0);
      # without either, each prints a named SKIP.
      - name: Prove each test, then run it
        run: |
          uvx copier --version
          status=0
          for s in update-test coexist-test; do
            echo "::group::$s"
            bash ".github/scripts/$s.sh" --self-test \
              || { echo "::error::$s — the self-test no longer separates good input from bad"; status=1; }
            bash ".github/scripts/$s.sh" \
              || { echo "::error::$s — an ownership promise was broken"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  author-main:
    name: syntek-author main (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Advisory only (DESIGN.md Section 7): syntek-author's default branch, not the pinned tag.
      # What coexist-test.sh finds here is printed as warnings and the job always exits 0, so a
      # syntek-author merge is seen before media adopts it, and never turns this run red. Job 3
      # runs the same script's self-test.
      - name: Coexist against syntek-author's main, or warn
        run: |
          if git clone --quiet --depth 1 https://github.com/Syntek-Dev/syntek-author "$RUNNER_TEMP/syntek-author-main"; then
            echo "syntek-author main at $(git -C "$RUNNER_TEMP/syntek-author-main" rev-parse --short HEAD); pinned for the required jobs: $SYNTEK_AUTHOR_TAG"
            uvx copier --version
            bash .github/scripts/coexist-test.sh --author "$RUNNER_TEMP/syntek-author-main" \
              || echo "::warning::coexist-test.sh against syntek-author's main reported findings or could not run (advisory: the release media vendors from is $SYNTEK_AUTHOR_TAG)"
          else
            echo "::warning::syntek-author's main could not be cloned (advisory)"
          fi
          exit 0
