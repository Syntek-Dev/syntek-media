name: Template improvement
description: Propose a change to what the template ships or how it is built — a platform, a media kind, a workflow, a skill, a toolkit command, a guide, an audit or a migration
title: "[Improvement]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Open this **before** writing the change for anything beyond a typo. `DESIGN.md` is the
        template's contract and wins over every other file; a change to it needs the maintainer's
        approval first, so it is cheaper to settle here than in a pull request that has to be
        unpicked. See
        [CONTRIBUTING.md](https://github.com/Syntek-Dev/syntek-media/blob/main/CONTRIBUTING.md).

        Use invented examples: Harbour Lane Studio, Morgan Example and Robin Example are the
        template's own.

  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: I removed personal data. This proposal holds no API key, voice ID, Claude Design link, channel handle, real brand or person, or private recording.
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change?
      options:
        - A platform
        - A media kind
        - A workflow
        - A skill
        - A toolkit command
        - Guide or rules wording
        - An audit
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What goes wrong today, in concrete terms, and for whom. 'Every author-fiction project I
        generate needs X fixed by hand' is a problem; 'it would be nice to have Y' is not, yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: What the template would ship or do instead, and what a generated project would then look like.
    validations:
      required: true

  - type: input
    id: design
    attributes:
      label: The DESIGN.md decisions or sections it touches, if you know them
      description: Decision numbers or sections, so the reasoning behind today's behaviour can be checked.
      placeholder: D82, or Section 3.5

  - type: checkboxes
    id: brand-kinds
    attributes:
      label: Brand kinds affected
      description: Tick every brand kind whose generated projects would change.
      options:
        - label: business
        - label: author-fiction
        - label: author-nonfiction
        - label: None (the template repository only, such as its audits)

  - type: textarea
    id: existing-projects
    attributes:
      label: Effect on existing projects
      description: >
        Projects already generated take changes with `copier update`. Copier never renders seeds
        and copy-only shared files on update, but the update script refreshes the family files it
        lists and adds the settings entries and MCP servers it lists, once each. Would this need
        a migration or a hand edit? Would removing an option delete files the owner has filled
        in? Leave it blank if you are not sure.

  - type: textarea
    id: coexistence
    attributes:
      label: Coexistence with syntek-author
      description: >
        Does this add a top-level name, a `.claude/` path, a skill or a rules file? If so, has the
        name been checked against `.github/scripts/syntek-author-names.txt`?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, including doing it in your own project's `docs/project/` or `workflows/local/` instead.

  - type: checkboxes
    id: agreements
    attributes:
      label: Before submitting
      options:
        - label: I understand that a change to `DESIGN.md` needs the maintainer's approval before any pull request.
          required: true
        - label: I will make no paid call (ElevenLabs or any other) to try or test this; fixtures are generated at run time.
          required: true
