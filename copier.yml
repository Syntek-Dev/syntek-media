# copier.yml — the contract a project's audio and video production layers are generated from.
#
#   uvx copier copy --trust gh:Syntek-Dev/syntek-media .
#
# Usually applied INTO a project generated by syntek-author, never with --overwrite (DESIGN.md
# D4, Section 8); it also renders on its own into an empty folder.
#
# User guide: README.md. Design contract: DESIGN.md — where this file and DESIGN.md disagree,
# DESIGN.md wins and this file is the one that is wrong.

# 9.6.0, not 9.0.0 (03/10/2026; DESIGN.md D2). The copy-only shared files, the seed-once
# example gates in _exclude and the copy-only _tasks below all read `_copier_operation`, which
# did not exist until Copier 9.6.0. On anything older the expression is undefined, and it fails
# in BOTH directions at once: the copy-only tasks hold SHUT, so a fresh generation never runs
# `git init` or sets the LFS tripwire, and the update gates hold OPEN, so every shared file and
# every example an author deleted comes back on the next update — the shared ones inside
# syntek-author's project. A floor that admits a Copier which cannot read the file's own safety
# mechanism is not a floor. `multiselect`, which PLATFORMS and MEDIA_KINDS need, predates it
# (proven on 9.18.2).
_min_copier_version: "9.6.0"

# Everything that ships lives at its real path under template/ (DESIGN.md D1). The repository
# root holds the template's OWN state — DESIGN.md, this file, VERSION, CHANGELOG.md, the audits
# in .github/scripts/ and the example answers in examples/ — and none of it is rendered.
#
# This is why there is no anchored list of root state files below, no .copier/ staging folder
# and no `mv` seed task: syntek-media is not itself a production project, so nothing at this
# root needs keeping out of a generated one. It also keeps this repository's own CI inert in
# every project: media ships no .github/ at all (D11).
_subdirectory: template

# A named answers file, not the default .copier-answers.yml (DESIGN.md D3, Section 9 rule 1).
# syntek-media is applied on top of a syntek-author project (D4), which already keeps its own
# record in .copier-answers.syntek-author.yml, and two templates writing one answers file would
# overwrite each other's record on every update.
#
# THE COST, AND IT IS REAL: `copier update` looks for .copier-answers.yml unless it is told
# otherwise (verified in the Copier 9.18.2 source, 03/10/2026), so every update must be run
# as `copier update --trust -a .copier-answers.syntek-media.yml`. Without `-a` it stops with
# no answers to read; it never updates the wrong thing. README.md, the rendered answers file
# and the message printed after a copy all say so.
#
# `copier copy` takes an absolute template path or gh:Syntek-Dev/syntek-media: Copier records
# the path as typed, and a relative one makes every later update fail (probe i1).
_answers_file: .copier-answers.syntek-media.yml

# The previous answers, read back so that BRAND_KIND's validator can refuse a change of brand
# kind on update (DESIGN.md D14; syntek-author D35). The path is the destination's: on
# `copier update` it is the project's own record. On a fresh `copier copy` — over a
# syntek-author project or into an empty folder — the file does not exist yet: Copier prints a
# MissingFileWarning and `_external_data.prev` is empty, which the validator's
# `default(BRAND_KIND, true)` reads as "no previous answer". Copier prints the warning on every
# update too, because its temporary renders of the old and new template read the path as well.
# That warning is the accepted cost. Never test `_copier_operation` in a validator instead: it
# is undefined there.
#
# THIS IS THE ONLY READ OF EXTERNAL DATA, AND IT STAYS IN THE VALIDATOR. Media never reads
# syntek-author's answers file at all, and never reads _external_data in a file body, a
# computed value, an _exclude gate or a message: an update's temporary renders find no answers
# file, so data rendered into a body differs between the old and the new render and leaves
# conflict markers on the first update (probe c2c), and a read in _message_before_update
# aborts the update (probe c3). A skill that needs to know whether syntek-author is present
# checks for its file at run time.
_external_data:
  prev: .copier-answers.syntek-media.yml

# Every file is a template — tokens are not confined to a suffixed subset. template/ ships no
# binary at all (DESIGN.md Section 10): no audio, video, image or font.
_templates_suffix: ""

# Nothing in v0.1 ships as a symbolic link. Kept from the house idiom so that a later alias
# renders as a link to its target rather than as a second copy that drifts from the first.
_preserve_symlinks: true

# Tokens are written <%TOKEN%> rather than {{TOKEN}} so they cannot collide with anything a
# media project holds or sits beside: CSS and HTML braces in the brand's layouts, ffmpeg
# filtergraphs, a Jinja-like {{ }} in other tooling, or GitHub Actions expressions (${{ }})
# in a syntek-author business project's Drive workflows. The set is syntek-author's, unchanged
# (DESIGN.md D2). Every text artefact media ships — HTML and CSS templates, ffmpeg filter
# strings, SRT, TOML, @dsCard comments — is scanned for <%, <: and <~ (check-template-tokens.sh
# on the source, shipped-brands.sh check 9 on every render): none may ship where no token is
# meant.
_envops:
  variable_start_string: "<%"
  variable_end_string: "%>"
  block_start_string: "<:"
  block_end_string: ":>"
  comment_start_string: "<~"
  comment_end_string: "~>"
  keep_trailing_newline: true

# Patterns are gitignore-style and are matched against DESTINATION paths, relative to
# template/ (verified in a probe template, 03/10/2026). ANCHORED (leading slash) means
# template content; UNANCHORED means "never part of a checkout" and matches at any depth.
#
# With _subdirectory set, Copier's default _exclude is [] rather than its usual list, and
# defining _exclude replaces the default in any case — so the defaults are re-listed here.
# Without them, a __pycache__ left by running toolkit/*.py inside template/ would ship.
_exclude:
  - .git
  - .svn
  - __pycache__
  - "*.py[co]"
  - .DS_Store
  - "~*"
  # Generated media. A render, a take or a test clip left in template/ by running the toolkit
  # there must never ship: it would carry this repository's output into every project as
  # binary nobody can review in a diff, and big binaries never sit in plain Git (D19). Audio
  # and video by extension, at any depth; `.pcm` is a raw ElevenLabs take (D21).
  - "*.mp4"
  - "*.mov"
  - "*.mkv"
  - "*.webm"
  - "*.wav"
  - "*.mp3"
  - "*.m4a"
  - "*.aac"
  - "*.flac"
  - "*.ogg"
  - "*.pcm"
  # Rendered stills, ANCHORED to the two folders the toolkit renders PNGs into, never an
  # unanchored *.png: an image is not by nature a render, and these are the only places a
  # card, a frame or a thumbnail lands by default (DESIGN.md Section 4.2).
  - /production/src/renders/*.png
  - /production/src/renders/*.jpg
  - /publishing/src/renders/*.png
  - /publishing/src/renders/*.jpg
  #
  # ── Shared root files: copy only, never on update (DESIGN.md D11, Section 3.6) ──
  #
  # The ten files syntek-author also ships. Each has TWO lines in this file and needs both:
  # this update gate, so an update never renders it and a copy the author deleted is never
  # recreated; and its anchored line in _skip_if_exists below, so a copy over a project that
  # already has it skips it (exit 0) instead of stopping with 'Interactive session required'.
  # With both lines the file is written by a copy into an empty place, skipped by a copy over
  # an existing file, never touched by an update and never recreated after deletion (probes
  # b1–b4, h1 and gate.sh, 03/10/2026). That is stricter than syntek-author's seed-if-missing
  # shared files (overrides syntek-author D17), because coexistence rule 3 says they render on
  # copy only, never on update. In a combined project they are syntek-author's, and nothing
  # media needs lives only in them (D5).
  #
  # NEVER DELETE ONE OF THESE LINES. Without it the file becomes seed-if-missing, and a shared
  # file the author deleted is recreated from media's copy on the next update — inside
  # syntek-author's project (DESIGN.md Section 10). Nor is the file ever removed from template/
  # or renamed in a later release: a renamed shared file is a second shared path neither
  # template seeds.
  - "<: if _copier_operation == 'update' :>/README.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.gitignore<: endif :>"
  - "<: if _copier_operation == 'update' :>/.mcp.json<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/MEMORY.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/settings.json<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/CLAUDE.md<: endif :>"
  #
  # ── Gated paths ──────────────────────────────────────────────────────────────
  #
  # A templated _exclude entry is the SINGLE conditionalisation mechanism for paths, as in
  # syntek-author and syntek-base. When a gate is shut the path is never rendered at all; when
  # it is open the entry renders to an empty string, which Copier ignores. One line per path,
  # never a multi-pattern block.
  #
  # EVERY LINE READS  "<: if not (GATE) :>/path<: endif :>"  where GATE is the "ships when"
  # expression of DESIGN.md Section 3.5, copied verbatim (D15): `'youtube' in PLATFORMS`,
  # `'audiobook' in MEDIA_KINDS`, the item single-quoted and no parentheses inside the gate, so
  # the audits can negate it mechanically. The index files (a CONTEXT.md or CLAUDE.md whose
  # folder is an ancestor of a gated path, and rules 01 and 02) wrap the same path's row in
  # "<: if GATE :>…<: endif :>" with the SAME string — so an audit can pair every exclusion
  # with every index row, and a gate that drifts in one place shows up as a mismatch rather
  # than as a dangling citation in one render. The one exception is the generated mode-file
  # block at the end, whose lines test BRAND_KIND as gen-mode-excludes.sh writes them.
  #
  # No gate here carries a BRAND_KIND test (D15, overrides syntek-author Section 2, where every
  # gate carries its DOC_TYPE test because its option questions are hidden per variant).
  # PLATFORMS and MEDIA_KINDS are always asked and refuse an empty list, so no hidden default
  # can open a membership gate. A list question added later and hidden by `when:` carries its
  # BRAND_KIND test in every gate, as syntek-author's do.
  #
  # Bare paths name whole directories. That is safe only because nothing under a gated
  # directory is negated back in; a future allowlist inside one needs `/**` and quoted
  # `"!…"` negations instead.
  #
  # Everything not listed ships always — the voiceover skill, its workflow, its folder and its
  # guide included (D51). toolkit/data/platforms.toml ships whole, and every nested .gitignore
  # ships in every render, so removing a media kind never removes an ignore rule while the
  # author's files remain.
  #
  # ── brand/: one platform profile per platform (DESIGN.md Section 3.5) ──
  # Each profile is also a seed (Section 3.1), so it has a second line in _skip_if_exists.
  # Removing the platform deletes it, filled in or not (D16).
  - "<: if not ('youtube' in PLATFORMS) :>/brand/src/platforms/youtube.md<: endif :>"
  - "<: if not ('tiktok' in PLATFORMS) :>/brand/src/platforms/tiktok.md<: endif :>"
  - "<: if not ('instagram' in PLATFORMS) :>/brand/src/platforms/instagram.md<: endif :>"
  - "<: if not ('linkedin' in PLATFORMS) :>/brand/src/platforms/linkedin.md<: endif :>"
  - "<: if not ('facebook' in PLATFORMS) :>/brand/src/platforms/facebook.md<: endif :>"
  - "<: if not ('podcast' in PLATFORMS) :>/brand/src/platforms/podcast.md<: endif :>"
  #
  # ── scripts/: one guide per media kind (DESIGN.md Section 4.3, guide table) ──
  - "<: if not ('short-video' in MEDIA_KINDS) :>/scripts/docs/reference/short-video.md<: endif :>"
  - "<: if not ('long-video' in MEDIA_KINDS) :>/scripts/docs/reference/long-video.md<: endif :>"
  - "<: if not ('podcast' in MEDIA_KINDS) :>/scripts/docs/reference/podcast-episodes.md<: endif :>"
  - "<: if not ('trailer' in MEDIA_KINDS) :>/scripts/docs/reference/trailers.md<: endif :>"
  # The guide to a piece that is a voiceover and nothing else; the voiceover skill and its
  # workflow, folder and guide carry no line at all (D51).
  - "<: if not ('voiceover' in MEDIA_KINDS) :>/scripts/docs/reference/standalone-voiceovers.md<: endif :>"
  #
  # ── production/: the podcast workflow and the audiobook kit ──
  # A media kind travels with everything that serves only it. production/src/audiobook/ goes
  # whole — its pair and the generated/ and renders/ READMEs; the chapter registers the author
  # wrote there are not template files and stay (D16).
  - "<: if not ('podcast' in MEDIA_KINDS) :>/production/workflows/04-master-a-podcast-episode<: endif :>"
  - "<: if not ('audiobook' in MEDIA_KINDS) :>/production/src/audiobook<: endif :>"
  - "<: if not ('audiobook' in MEDIA_KINDS) :>/production/workflows/05-narrate-an-audiobook<: endif :>"
  - "<: if not ('audiobook' in MEDIA_KINDS) :>/production/workflows/06-master-an-audiobook<: endif :>"
  - "<: if not ('audiobook' in MEDIA_KINDS) :>/production/docs/reference/audiobook-narration.md<: endif :>"
  #
  # ── publishing/: one platform guide per platform ──
  - "<: if not ('youtube' in PLATFORMS) :>/publishing/docs/reference/youtube.md<: endif :>"
  - "<: if not ('tiktok' in PLATFORMS) :>/publishing/docs/reference/tiktok.md<: endif :>"
  - "<: if not ('instagram' in PLATFORMS) :>/publishing/docs/reference/instagram.md<: endif :>"
  - "<: if not ('linkedin' in PLATFORMS) :>/publishing/docs/reference/linkedin.md<: endif :>"
  - "<: if not ('facebook' in PLATFORMS) :>/publishing/docs/reference/facebook.md<: endif :>"
  - "<: if not ('podcast' in PLATFORMS) :>/publishing/docs/reference/podcast.md<: endif :>"
  #
  # ── Media-kind skills (DESIGN.md Section 5.1) ──
  #
  # Governance goes with the tree: a skill fires on DESCRIPTION MATCH rather than on being
  # named, so an audiobook skill shipped to a brand that makes no audiobook would compete for
  # work it cannot do. narrate-audiobook is moded: its folder is gated here and its mode files
  # sit in the generated block below.
  - "<: if not ('audiobook' in MEDIA_KINDS) :>/.claude/skills/narrate-audiobook<: endif :>"
  #
  # ── Seed-once examples (DESIGN.md Section 3.2): copy only, and they stay deleted ──
  #
  # Rendered on `copy` when SEED_EXAMPLES is true, and never again. The difference from
  # _skip_if_exists is the whole point: a skip-if-exists file the author DELETES is recreated
  # by the next update, which is right for a register that skills cite and wrong for an
  # example the author has finished with. Excluding on `update` means an update never renders
  # the example at all — not when it exists, not when it was deleted. Copier keeps the
  # operation as 'update' while it renders the old template copy during an update (checked in
  # the 9.18.2 source, 03/10/2026), so a kept example is never mistaken for one the template
  # removed. Applying media to a project already in use passes SEED_EXAMPLES=false (Section 8).
  #
  # One worked piece, 000-example-piece (D43): a plan-only walk-through that stops at
  # `storyboarded`, carried through brief, script, storyboard, shot list, edit decision list,
  # title card, cut-down plan, captions, thumbnail and post package. Its content follows
  # BRAND_KIND and its plan and post package hold one gated section per platform, so these are
  # spine files. No template-owned file names these paths (D43).
  - "<: if _copier_operation == 'update' or not SEED_EXAMPLES :>/scripts/src/pieces/000-example-piece<: endif :>"
  - "<: if _copier_operation == 'update' or not SEED_EXAMPLES :>/production/src/edits/000-example-piece.toml<: endif :>"
  - "<: if _copier_operation == 'update' or not SEED_EXAMPLES :>/production/src/cards/000-example-piece.title.html<: endif :>"
  - "<: if _copier_operation == 'update' or not SEED_EXAMPLES :>/publishing/src/cut-downs/000-example-piece.md<: endif :>"
  - "<: if _copier_operation == 'update' or not SEED_EXAMPLES :>/publishing/src/captions/000-example-piece.en-GB.srt<: endif :>"
  - "<: if _copier_operation == 'update' or not SEED_EXAMPLES :>/publishing/src/thumbnails/000-example-piece.md<: endif :>"
  - "<: if _copier_operation == 'update' or not SEED_EXAMPLES :>/publishing/src/thumbnails/000-example-piece.html<: endif :>"
  - "<: if _copier_operation == 'update' or not SEED_EXAMPLES :>/publishing/src/posts/000-example-piece.md<: endif :>"
  #
  # ── Mode files (DESIGN.md D7, Section 3.5): GENERATED, never edited by hand ──
  #
  # Every moded skill carries exactly one of BUSINESS.md, FICTION.md or NONFICTION.md in a
  # generated project; the other two are excluded here, one line per file that exists on disk,
  # three lines per moded skill. `.github/scripts/gen-mode-excludes.sh` writes everything
  # between the two markers from the files under template/, and `--check` fails CI when the
  # block and the disk disagree. Add or remove a mode file, then regenerate — never type a
  # line here.
  # BEGIN generated mode excludes
  - "<: if BRAND_KIND != 'business' :>/.claude/skills/narrate-audiobook/BUSINESS.md<: endif :>"
  - "<: if BRAND_KIND != 'author-fiction' :>/.claude/skills/narrate-audiobook/FICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'author-nonfiction' :>/.claude/skills/narrate-audiobook/NONFICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'business' :>/.claude/skills/prepare-post/BUSINESS.md<: endif :>"
  - "<: if BRAND_KIND != 'author-fiction' :>/.claude/skills/prepare-post/FICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'author-nonfiction' :>/.claude/skills/prepare-post/NONFICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'business' :>/.claude/skills/repurpose/BUSINESS.md<: endif :>"
  - "<: if BRAND_KIND != 'author-fiction' :>/.claude/skills/repurpose/FICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'author-nonfiction' :>/.claude/skills/repurpose/NONFICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'business' :>/.claude/skills/storyboard/BUSINESS.md<: endif :>"
  - "<: if BRAND_KIND != 'author-fiction' :>/.claude/skills/storyboard/FICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'author-nonfiction' :>/.claude/skills/storyboard/NONFICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'business' :>/.claude/skills/thumbnail-brief/BUSINESS.md<: endif :>"
  - "<: if BRAND_KIND != 'author-fiction' :>/.claude/skills/thumbnail-brief/FICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'author-nonfiction' :>/.claude/skills/thumbnail-brief/NONFICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'business' :>/.claude/skills/voiceover/BUSINESS.md<: endif :>"
  - "<: if BRAND_KIND != 'author-fiction' :>/.claude/skills/voiceover/FICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'author-nonfiction' :>/.claude/skills/voiceover/NONFICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'business' :>/.claude/skills/write-script/BUSINESS.md<: endif :>"
  - "<: if BRAND_KIND != 'author-fiction' :>/.claude/skills/write-script/FICTION.md<: endif :>"
  - "<: if BRAND_KIND != 'author-nonfiction' :>/.claude/skills/write-script/NONFICTION.md<: endif :>"
  # END generated mode excludes

# Seed-if-missing (DESIGN.md D12, Section 3.1): written when absent, never overwritten once
# they exist, and recreated by the next update if the author deletes one. They are the files
# skills and rules cite by path, so they must always exist; and they are the files the author
# fills in — the registers and logs, the brand's tokens and layout components, the spoken
# voice, the platform profiles and overrides — so the template must never write over them. A
# seed therefore receives no template improvement once it exists, which is why each ships
# EMPTY of entries (headings, writing rules and the seeded-stub banner in Markdown; header
# comments only in TOML; neutral values with AUTHOR TO CONFIRM slots in tokens.css and the
# preview cards) and why that emptiness is audited by `.github/scripts/shipped-seeds.sh`, not
# trusted.
#
# The ten shared root files are here for a second reason (D11): a copy over a project that
# already has one must skip it rather than abort. Their update-gated lines in _exclude above
# make them copy-only as well, so unlike every other line here they are never recreated.
#
# EVERY PATTERN IS ANCHORED. These are gitignore-style patterns like _exclude: an unanchored
# `CONTEXT.md` would match every governance pair in the tree and freeze all of them against
# every update, and an unanchored `.gitignore` would freeze the nested, template-owned
# .gitignore files with it.
#
# Listed UNCONDITIONALLY: a pattern for a path that does not ship in this render is a no-op
# (verified in the probe, 03/10/2026). A gated seed — a platform profile — therefore needs two
# lines in total: its gate in _exclude above, and its line here.
#
# THE ONE THING A SEED DOES NOT SURVIVE is its platform or media kind being removed. `copier
# update` with PLATFORMS or MEDIA_KINDS answered without it deletes every file that answer
# generated, seeds included, even ones the author has filled in (D16; probe c9). The
# _message_before_update below names them. Nor does a seed survive the template dropping it:
# a release that stops shipping a seed deletes the project's copy on the next update, filled
# in or not (probe h2), so a seed is never removed without a migration that preserves it first.
#
# A seed is listed only once its file is on disk: shipped-seeds.sh fails on a seed that is
# not. Add each line in the change that adds its file, and keep the list explicit (no globs):
# the audits read it path by path.
_skip_if_exists:
  # ── Shared root files (DESIGN.md D11, Section 3.6; also update-gated in _exclude) ──
  - /README.md
  - /CONTEXT.md
  - /.gitignore
  - /.mcp.json
  - /.claude/CLAUDE.md
  - /.claude/CONTEXT.md
  - /.claude/MEMORY.md
  - /.claude/settings.json
  - /.claude/skills/CONTEXT.md
  - /.claude/skills/CLAUDE.md
  # ── brand/: the design register, the design system and the spoken voice ──
  # tokens.css and the two layout components (previews/thumbnail.html and previews/card.html)
  # are the brand's source of truth, synced with its Claude Design project by the author (D18).
  - /brand/src/design-register.md
  - /brand/src/design-system/tokens.css
  - /brand/src/design-system/previews/colors.html
  - /brand/src/design-system/previews/type.html
  - /brand/src/design-system/previews/spacing.html
  - /brand/src/design-system/previews/brand.html
  - /brand/src/design-system/previews/captions.html
  - /brand/src/design-system/previews/thumbnail.html
  - /brand/src/design-system/previews/card.html
  - /brand/src/voice/voice.md
  # ── brand/: the platform overrides (always) and one profile per platform (gated above) ──
  # overrides.toml ships in every render, so removing a platform never deletes a confirmed
  # correction (D26).
  - /brand/src/platforms/overrides.toml
  - /brand/src/platforms/youtube.md
  - /brand/src/platforms/tiktok.md
  - /brand/src/platforms/instagram.md
  - /brand/src/platforms/linkedin.md
  - /brand/src/platforms/facebook.md
  - /brand/src/platforms/podcast.md
  # ── scripts/, production/ and publishing/: the registers and logs ──
  - /scripts/src/piece-register.md
  - /production/src/rights-register.md
  - /production/src/credits-log.md
  - /production/src/footage/manifest.toml
  - /publishing/src/schedule.md
  - /publishing/src/publish-log.md
  # ── Author-filled index pairs (DESIGN.md Section 3.1): the author adds a row to each
  #    docs/project/ and workflows/local/ pair, so an update must never merge into them ──
  - /brand/docs/project/CONTEXT.md
  - /brand/docs/project/CLAUDE.md
  - /brand/workflows/local/CONTEXT.md
  - /brand/workflows/local/CLAUDE.md
  - /scripts/docs/project/CONTEXT.md
  - /scripts/docs/project/CLAUDE.md
  - /scripts/workflows/local/CONTEXT.md
  - /scripts/workflows/local/CLAUDE.md
  - /production/docs/project/CONTEXT.md
  - /production/docs/project/CLAUDE.md
  - /production/workflows/local/CONTEXT.md
  - /production/workflows/local/CLAUDE.md
  - /publishing/docs/project/CONTEXT.md
  - /publishing/docs/project/CLAUDE.md
  - /publishing/workflows/local/CONTEXT.md
  - /publishing/workflows/local/CLAUDE.md

# ── Identity ─────────────────────────────────────────────────────────────────

# The brand's name in the exact form a viewer meets it. It renders into every skill's H1 and
# the brand section of the media rules, and the toolkit writes it into double-quoted metadata
# (ID3 tags, MP4 titles), so its FORM is load-bearing: 'Harbour Lane Studio' and 'Harbour
# Lane' are different names to every caption, credit and search.
BRAND_NAME:
  type: str
  help: >-
    The brand's name exactly as it appears on screen, in captions and in credits: a trading
    name or a pen name.
  placeholder: Harbour Lane Studio
  validator: >-
    <: if not BRAND_NAME | trim :>
    Give the brand's name — every skill and the brand section of the rules read it.
    <: endif :>
    <: if '"' in BRAND_NAME or '\\' in BRAND_NAME :>
    Avoid double quotation marks and backslashes — the toolkit writes this name into
    double-quoted metadata such as ID3 tags, and the house style uses single quotation marks
    anyway.
    <: endif :>

# The default keeps only letters, digits, spaces and hyphens and joins the words with
# hyphens, so a name with an ampersand or an apostrophe ('Morgan's Ferry & Co') still yields a
# valid slug instead of a default the validator rejects.
#
# The validator is DESIGN.md's ^[a-z][a-z0-9-]+$ written as character-set tests, because
# Jinja has no regular expressions without an extension and this template loads none.
BRAND_SLUG:
  type: str
  help: >-
    The brand's machine name in kebab-case. It names anything that needs a file-safe name.
  default: "<% (BRAND_NAME | lower | select('in', 'abcdefghijklmnopqrstuvwxyz0123456789 -') | join).split() | join('-') %>"
  validator: >-
    <: if BRAND_SLUG | length < 2 or BRAND_SLUG[0] not in 'abcdefghijklmnopqrstuvwxyz'
       or BRAND_SLUG | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list | length > 0 :>
    Use kebab-case that starts with a letter: lower-case letters, digits and hyphens only,
    at least two characters (the pattern ^[a-z][a-z0-9-]+$).
    <: endif :>

# ── Variant ──────────────────────────────────────────────────────────────────
#
# The one answer that decides which single mode file sits beside every moded skill —
# BUSINESS.md, FICTION.md or NONFICTION.md (DESIGN.md D7) — which worked example ships, and
# the defaults of the questions after it. Asked straight after the name, so every later
# question's help, default and placeholder can speak to it.
#
# NO DEFAULT, ON PURPOSE. `copier copy --defaults` without it stops with 'Question "BRAND_KIND"
# is required' rather than quietly generating a business brand, so CI, the audits and every
# application over a syntek-author project must say which kind they mean. It is never derived
# from syntek-author's DOC_TYPE: media does not read that answers file (D14).
#
# Changing it later is REFUSED (DESIGN.md D14; syntek-author D35). The mode files, the worked
# example, the brand seeds and the brand section of the rules are written for one kind of
# brand, and `copier update` only moves what it generated. The validator compares the answer
# with the previous one, read from the project's answers file through _external_data; on a
# copy there is no previous answer and it always passes. Proven on 9.18.2: a changed
# BRAND_KIND stops the update before a single file is touched (probe c8; update-test.sh checks
# 10 and 11). A different brand kind is a new project.
BRAND_KIND:
  type: str
  help: >-
    What kind of brand is this? 'business' — a business's social video, recorded talks and
    explainers; 'author-fiction' — a novelist's book trailers, audiobook and author socials;
    'author-nonfiction' — a non-fiction author's talks, podcast, audiobook and author socials.
    This cannot be changed later: an update refuses a different answer.
  choices:
    - business
    - author-fiction
    - author-nonfiction
  validator: >-
    <: if (_external_data.prev.BRAND_KIND | default(BRAND_KIND, true)) != BRAND_KIND :>
    BRAND_KIND cannot change on update. This project was generated as
    '<% _external_data.prev.BRAND_KIND %>', and its mode files, worked example and brand seeds
    were written for that kind of brand, which a different kind would strand. A different
    brand kind is a new project: generate one and copy your work across.
    <: endif :>

# ── The brief and the audience ───────────────────────────────────────────────

# The first question about the WORK rather than its labels. It renders into the brand section
# of .claude/rules/syntek-media/01-layout-and-routing.md, which is the brand brief in a
# combined project (D5), and into the standalone .claude/CLAUDE.md, README.md and CONTEXT.md —
# so a vague answer here is a vague answer echoed through every brief and script downstream.
BRAND_DESCRIPTION:
  type: str
  help: >-
    What the channel is for and for whom, in one or two full sentences. Every skill reads this
    brief before anything else — write it as a brief, not a tagline.
  placeholder: >-
    <: if BRAND_KIND == 'business' :>Short explainers, recorded talks and behind-the-scenes
    clips from a two-person design studio, for small businesses deciding whether to commission
    a new identity.<: elif BRAND_KIND == 'author-fiction' :>Trailers, read-aloud clips and the
    audiobook of a fantasy novel about a ferry pilot on a drowned coast, for readers who have
    not yet opened the book.<: else :>Recorded talks, a podcast and the audiobook of a book on
    the shared table in a small congregation, for church members with no theological
    training.<: endif :>
  validator: >-
    <: if BRAND_DESCRIPTION | trim | length < 40 :>
    Write at least a full sentence — a tagline is not a brief, and this is what every skill
    reads before it reads anything else.
    <: endif :>

# The one viewer or listener every piece must work for. The comprehension skill
# (syntek-author), where present, reads every script as this person, and the brand section of
# the media rules names them. One default per brand kind; the business and fiction defaults
# assume a feed that plays with the sound off, because most of them do.
AUDIENCE_TEST:
  type: str
  help: >-
    One sentence naming the viewer or listener every piece must work for — the lowest common
    denominator, for example 'a small-business owner watching on a phone between meetings,
    with the sound off'.
  default: "<% {'business': 'A small-business owner watching on a phone between meetings, with the sound off.', 'author-fiction': 'A reader who has never heard of the book, scrolling with the sound off.', 'author-nonfiction': 'A thoughtful listener with no specialist training, hearing it on a commute.'}[BRAND_KIND] %>"
  validator: >-
    <: if AUDIENCE_TEST | trim | length < 20 :>
    Name a real viewer or listener in a real moment — a sentence, not a label.
    <: endif :>

# ── The owner ────────────────────────────────────────────────────────────────

# Who maintains the project, in its exact written form: 'Maintained By' in every metadata
# header media ships (D14). It defaults to the brand's name, which is right for a business and
# for an author whose pen name is the brand; an owner who signs differently changes it.
OWNER_NAME:
  type: str
  help: >-
    The person or business who maintains the project, exactly as written: it is 'Maintained
    By' in every metadata header.
  default: "<% BRAND_NAME %>"
  validator: >-
    <: if not OWNER_NAME | trim :>
    Give the owner's name as it is written — every metadata header carries it.
    <: endif :>
    <: if '"' in OWNER_NAME or '\\' in OWNER_NAME :>
    Avoid double quotation marks and backslashes — this value can be written into
    double-quoted metadata, and the house style uses single quotation marks anyway.
    <: endif :>

# How skills address the owner in chat. Derived from the first word of OWNER_NAME, which is
# wrong whenever that is a business's name or opens with an initial or a title — hence a
# question rather than a computed value.
OWNER_FIRST_NAME:
  type: str
  help: >-
    What should the skills call you in chat? Defaults to the first word of the owner's name;
    change it if that is a business name, an initial or a title.
  default: "<% (OWNER_NAME.split() or [''])[0] %>"
  validator: >-
    <: if not OWNER_FIRST_NAME | trim :>
    Give the name the skills should use when they speak to you.
    <: endif :>

# ── Platforms and media ──────────────────────────────────────────────────────
#
# Two lists, each a multiple choice (`multiselect: true`; DESIGN.md Section 2). Each value
# opens its own gated files (Section 3.5): a platform its profile seed in brand/src/platforms/
# and its guide in publishing/docs/reference/; a media kind its guide in
# scripts/docs/reference/ and, for podcast and audiobook, its workflows, folder and skill.
# The labels are what the person answering reads, in syntek-author's `"label": value` form
# (its BUSINESS_FAMILIES); the answers file, every gate, every default and `--data` take the
# VALUES: `--data 'PLATFORMS=[youtube, podcast]'`. Both are always asked and refuse an empty
# list, which is what lets every gate be a bare membership test (D15).
#
# Each default is one dictionary lookup on BRAND_KIND, rendered with `| tojson` so that Copier
# reads a list (proven on 9.18.2), and holds values, never labels.
#
# REMOVING A VALUE LATER DELETES WHAT IT GENERATED (D16): `copier update` with a list that no
# longer names it deletes that value's template files, seeds included — a platform profile the
# author has filled in among them — and leaves every file the author created. A list passed on
# update replaces the whole list. Nothing refuses it (D14 guards BRAND_KIND only):
# _message_before_update names what each removal deletes, and each help below says so.

PLATFORMS:
  type: str
  multiselect: true
  help: >-
    Where will this brand publish? Choose every platform: each adds its profile in
    brand/src/platforms/, which you fill in, and its guide in publishing/docs/reference/.
    Removing one later deletes every file it generated, including the platform profile you
    filled in.
  choices:
    "youtube — long videos, Shorts and thumbnails": youtube
    "tiktok — vertical video": tiktok
    "instagram — reels, stories and covers": instagram
    "linkedin — landscape and vertical video posts": linkedin
    "facebook — reels and feed video": facebook
    "podcast — Apple Podcasts and Spotify feeds": podcast
  default: "<% {'business': ['youtube', 'linkedin', 'instagram'], 'author-fiction': ['youtube', 'tiktok', 'instagram', 'facebook'], 'author-nonfiction': ['youtube', 'podcast', 'instagram', 'facebook']}[BRAND_KIND] | tojson %>"
  validator: >-
    <: if not PLATFORMS :>
    Choose at least one platform — every piece is made for somewhere.
    <: endif :>

# `voiceover` gates only the guide to a piece that is a voiceover and nothing else. The
# voiceover skill, its workflow, its folder and its guide ship whatever is chosen, because
# every brand kind narrates explainers, trailers or episodes (D51); the label says so.
MEDIA_KINDS:
  type: str
  multiselect: true
  help: >-
    What will this brand make? Choose every kind: each adds its guide in
    scripts/docs/reference/, and podcast and audiobook add their workflows, and audiobook its
    folder and the narrate-audiobook skill. Removing one later deletes every file it
    generated, including any seed in it you filled in; your own files stay.
  choices:
    "short-video — vertical shorts and clips": short-video
    "long-video — explainers and talks": long-video
    "podcast — episodes": podcast
    "audiobook — narrated or recorded books": audiobook
    "trailer — book and launch trailers": trailer
    "voiceover — pieces that are only a voiceover (the voiceover skill ships whatever you choose)": voiceover
  default: "<% {'business': ['short-video', 'long-video', 'voiceover'], 'author-fiction': ['short-video', 'trailer', 'audiobook', 'voiceover'], 'author-nonfiction': ['long-video', 'short-video', 'podcast', 'audiobook', 'voiceover']}[BRAND_KIND] | tojson %>"
  validator: >-
    <: if not MEDIA_KINDS :>
    Choose at least one kind of media — the guides and workflows follow what you make.
    <: endif :>

# ── Options ──────────────────────────────────────────────────────────────────

# Copy-only, through the seed-once block of _exclude: an example the author deletes stays
# deleted (DESIGN.md D43, Section 3.2). Applying media to a project already in use passes
# false (Section 8).
SEED_EXAMPLES:
  type: bool
  help: >-
    Include one worked example to learn from: a 30-second <: if BRAND_KIND == 'business'
    :>explainer<: elif BRAND_KIND == 'author-fiction' :>teaser for the novel<: else :>clip from
    a talk<: endif :>, spoken on camera and carried from its brief to its post package, planned
    but never rendered. Delete it when you are done and it never comes back. Answer false when
    applying to a project already in use.
  default: true

# ── Policy and locale ────────────────────────────────────────────────────────

# The tier for mechanical work only — renders, encodes, file moves, logging and ticks. What a
# viewer or listener will read or hear, and every judgement, is always Opus, and Haiku is never
# used (.claude/rules/syntek-media/05-model-allocation.md; D38). The defaults are
# syntek-author's own — opus for business, otherwise sonnet — so a combined project's two
# always-loaded model tables agree unless the owner answers differently.
MODEL_MECHANICAL:
  type: str
  help: >-
    Which model does mechanical work — renders, encodes, file moves and ticks? Anything a
    viewer or listener will read or hear always uses Opus, and Haiku is never used.
  choices:
    - sonnet
    - opus
  default: "<% 'opus' if BRAND_KIND == 'business' else 'sonnet' %>"

TIMEZONE:
  type: str
  help: >-
    Your timezone, as an IANA name — skills use it for dates in filenames and headers and for
    the times in the posting schedule
  default: Europe/London
  validator: >-
    <: if '/' not in TIMEZONE and TIMEZONE != 'UTC' :>
    Use an IANA timezone name, for example Europe/London.
    <: endif :>

# ── Meta ─────────────────────────────────────────────────────────────────────

DATE:
  type: str
  help: >-
    Baseline date stamped into every metadata header (DD/MM/YYYY, day first). It is answered
    once and kept, so `copier update` never churns every header in the project.
  placeholder: 03/10/2026
  validator: >-
    <: if DATE | length != 10 or DATE[2] != '/' or DATE[5] != '/'
       or (DATE[0:2] ~ DATE[3:5] ~ DATE[6:10]) | reject('in', '0123456789') | list | length > 0 :>
    Use DD/MM/YYYY, for example 03/10/2026.
    <: elif (DATE[0:2] | int) < 1 or (DATE[0:2] | int) > 31 or (DATE[3:5] | int) < 1 or (DATE[3:5] | int) > 12 :>
    Use DD/MM/YYYY — day first, then month (01–12).
    <: endif :>

# There are no computed values at 0.1.0 (DESIGN.md Section 2). A later one is `when: false`,
# derived only from answers and never from _external_data (D14), and like every variant token
# it may appear only in the spine set.

# ── Migrations ───────────────────────────────────────────────────────────────
#
# Run on `copier update` only, never on `copier copy`, when the update crosses the declared
# version. They exist for the one thing Copier's merge cannot do on its own: move files the
# AUTHOR wrote. Copier only tracks what it generated, so a renamed folder takes its
# governance pair to the new path and leaves every brief, script, edit decision list and
# register behind — with no conflict and no error.
#
# NONE AT 0.1.0. The rule from the first release: folder names and workflow numbers are
# frozen and append-only (DESIGN.md D32), and any release that renames or moves a folder that
# can hold author work ships a version-keyed migration IN THE SAME COMMIT, or it silently
# strands that work.
#
# Seeds are the second case. The seeds of DESIGN.md Section 3.1 are never re-rendered once
# they exist, so a release that changes what a seed must contain ships that change as a
# migration too. And a release that stops shipping a seed ships a migration that preserves it
# first: a seed dropped from template/ is deleted from the project by the next update, filled
# in or not (probe h2; Section 10). The ten shared files are not seeds of media's to migrate:
# media never mutates a shared file (D11), so a change to what one should hold reaches a
# project only as a hand edit that the release's notes and README.md name.
#
# House shape for a migration script: it lives in migrations/ at this repository's root
# (outside template/, so it never ships) and is read from the template clone through
# _copier_conf.src_path. It is idempotent; it never overwrites and never deletes; it acts only
# where exactly one destination or value is correct and reports everything else with file and
# line; it guards on the folders' CONTEXT.md markers, so a folder Copier has not retired (or a
# destination it has not delivered) is never touched; and it always exits 0, because a
# non-zero exit aborts every migration declared after it and leaves the project half-upgraded.
# Key it to the release the folder MOVED in, never the release somebody noticed. Migrations
# run in declaration order. The first entry will look like:
#
#   - version: v0.2.0
#     command: bash "<% _copier_conf.src_path %>/migrations/v0.2.0-<what>.sh"
#     when: "<% _stage == 'after' %>"
#
# A `version:` entry runs only when the update crosses that version, which Copier reads from
# the template's git tags (PEP 440): an update to an untagged HEAD that is still numbered
# 0.1.x does not run it.
_migrations: []

# ── Before an update ─────────────────────────────────────────────────────────
#
# DESIGN.md D16, Section 3.5. Printed on every `copier update`, BEFORE the questions are asked
# — which is also why it cannot be tailored to the project: Copier renders it before any
# answer, the previous ones included, is loaded (checked in the 9.18.2 source, 03/10/2026),
# and an _external_data read here aborts the update (probe c3). So it is static text naming
# what removing each platform and each media kind deletes, workflows by full folder name
# (D32), and the author reads the lines for theirs. update-test.sh check 12 proves it is
# printed, naming every platform and media kind; a quiet run (--quiet) suppresses it.
_message_before_update: |

  Before you answer: removing a platform or a media kind deletes EVERY file it generated,
  including the seeds you have filled in (git history keeps the last committed copy). Copy out
  and commit anything you need first. Your own files are never deleted.

    PLATFORMS without <platform>     brand/src/platforms/<platform>.md (your profile) and
                                     publishing/docs/reference/<platform>.md — for each of
                                     youtube, tiktok, instagram, linkedin, facebook, podcast
    MEDIA_KINDS without audiobook    the narrate-audiobook skill; production/src/audiobook/ (its
                                     pair and the generated/ and renders/ READMEs; your chapter
                                     registers stay); production/workflows/05-narrate-an-audiobook/,
                                     production/workflows/06-master-an-audiobook/ and
                                     production/docs/reference/audiobook-narration.md
    MEDIA_KINDS without podcast      scripts/docs/reference/podcast-episodes.md and
                                     production/workflows/04-master-a-podcast-episode/
    MEDIA_KINDS without trailer      scripts/docs/reference/trailers.md
    MEDIA_KINDS without short-video  scripts/docs/reference/short-video.md
    MEDIA_KINDS without long-video   scripts/docs/reference/long-video.md
    MEDIA_KINDS without voiceover    scripts/docs/reference/standalone-voiceovers.md (the
                                     voiceover skill and its workflow stay)

  A list answer replaces the whole list: --data 'PLATFORMS=[youtube, podcast]' removes every
  platform not named.

  BRAND_KIND never changes: the update refuses it, because a different brand kind is a new
  project. After a platform or media-kind change, edit by hand the files that describe your
  options: README.md, CONTEXT.md and .claude/CLAUDE.md Section 1 in a standalone project (over
  syntek-author they are syntek-author's), and any rows for a removed platform in
  brand/src/platforms/overrides.toml. The brand section of the media rules updates itself.

# ── After a copy ─────────────────────────────────────────────────────────────
#
# DESIGN.md D13 and Section 8: what coexistence leaves to the author, in D13's order — (1) the
# ten shared files and the skip rule (Copier prints an existing one as `conflict` then `skip`,
# or `identical`), with Section 8's hand edits 2 and 3: the optional index lines, and nothing
# to add to .gitignore or .mcp.json; (2) the allow, ask and Edit deny entries for an existing
# settings.json, exactly as the standalone seed holds them; (3) the ElevenLabs line, with the
# rule that its base path must contain the project; (4) the LFS tripwire's write to this
# repository's .git/config; (5) the setup check (D49); (6) the update command with `-a`.
# Unlike the message before an update it renders answers (probe c1), but never _external_data
# (D14). Messages go to stderr, and --quiet suppresses them.
#
# coexist-test.sh check 19 and generate-all.sh check 4 hold this output to the lists in
# .github/scripts/_common.sh, the same lists shipped-seeds.sh check 12 holds the standalone
# .claude/settings.json to, so the message and the seed cannot drift apart: change an entry
# here, there and in the seed in the same commit.
_message_after_copy: |

  syntek-media is in place for <% BRAND_NAME %> (<% BRAND_KIND %>).
    Platforms:    <% PLATFORMS | join(', ') %>
    Media kinds:  <% MEDIA_KINDS | join(', ') %>

  1. Shared files. README.md, CONTEXT.md, .gitignore, .mcp.json, .claude/CLAUDE.md,
     .claude/CONTEXT.md, .claude/MEMORY.md, .claude/settings.json, .claude/skills/CONTEXT.md
     and .claude/skills/CLAUDE.md are written only where they did not exist. Any that Copier
     reported as 'conflict' then 'skip', or as 'identical', was left exactly as it was, and no
     syntek-media update will touch it: that pair is expected and is not a collision.
     The media rules in .claude/rules/syntek-media/ load at launch whatever those files say,
     so naming the media layers in README.md and CONTEXT.md, and .claude/rules/syntek-media/
     in .claude/CLAUDE.md, is optional. Nothing needs adding to .gitignore or .mcp.json:
     media's ignore rules are nested, and the ElevenLabs server is user-scoped.

  2. Permissions. If .claude/settings.json was skipped, add these entries to it by hand.
     Under "permissions", in "allow" (syntek-author's settings already allow the last two):
       "Bash(python3 toolkit/*.py *)",
       "Bash(uv run toolkit/*.py *)",
       "Bash(ffmpeg *)",
       "Bash(ffprobe *)",
       "WebSearch",
       "WebFetch"
     and in "ask" (every ElevenLabs tool that spends credits; the server marks each one
     read-only, so only an ask rule makes Claude Code stop and ask):
       "mcp__elevenlabs__text_to_speech",
       "mcp__elevenlabs__speech_to_text",
       "mcp__elevenlabs__compose_music",
       "mcp__elevenlabs__text_to_sound_effects",
       "mcp__elevenlabs__speech_to_speech",
       "mcp__elevenlabs__voice_clone",
       "mcp__elevenlabs__isolate_audio",
       "mcp__elevenlabs__text_to_voice",
       "mcp__elevenlabs__create_voice_from_preview"
     and in "deny" (so nothing in a generated or renders folder is edited by hand):
       "Edit(**/generated/**)",
       "Edit(**/renders/**)"

  3. ElevenLabs. Add the server once, at user scope, with a base path that CONTAINS this
     project: speech-to-text refuses any file outside it. Use $HOME when every project lives
     under it, otherwise the nearest folder that holds them all. Remove an existing server
     first, then add it again:
       claude mcp remove elevenlabs --scope user
       claude mcp add --env ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY" --env ELEVENLABS_MCP_BASE_PATH="$HOME" \
         --transport stdio --scope user elevenlabs -- uvx elevenlabs-mcp
     Export the key in your shell first; never type it on the command line or commit it.

  4. Git LFS. Where no LFS filter was configured at any scope, this copy set
     filter.lfs.required in this repository's own .git/config, so that adding a large design
     export under brand/src/exports/large/ fails loudly instead of committing the whole file
     as a plain blob. Run `git lfs install` once before you use that folder: it sets the same
     value, and the tripwire is then harmless.

  5. Before the first credit-spending call, check the set-up and clear what it reports:
       python3 toolkit/media.py check --setup

  6. Update this template on its own, from a clean, committed tree, always naming its
     answers file:
       uvx copier update --trust -a .copier-answers.syntek-media.yml

# ── Post-generation ──────────────────────────────────────────────────────────

_tasks:
  # ORDER MATTERS IN THIS LIST: Copier runs _tasks top to bottom, on `copy` AND on `update`.
  # A task that must not touch a live project carries an explicit
  # `when: "<% _copier_operation == 'copy' %>"`; the absence of one means it runs on every
  # update. Both tasks below are copy-only: media has no hook to make executable and no
  # database to build, and an update never touches a repository's set-up. Every task is
  # non-fatal wherever git is installed (DESIGN.md Section 3.5), because a failing task aborts
  # the whole generation — or the whole update — after the files are already written. Task 1
  # is syntek-author's exact command, so without git it fails as syntek-author's does; the
  # toolkit and the skills need git in any case.
  #
  # There are no `mv` seed tasks. Seeds are _skip_if_exists, which is safe over an existing
  # project; an `mv` onto an existing file clobbers it (probe e1).
  #
  # 1. A repository first, because the toolkit and the skills locate the project with
  #    `git rev-parse --show-toplevel`, and the tripwire below writes the repository's own
  #    .git/config. Guarded by `[ -d .git ]` because media is usually applied INTO an existing
  #    repository, which must never be re-initialised.
  - command: "[ -d .git ] || git init --initial-branch=main"
    when: "<% _copier_operation == 'copy' %>"

  # 2. The LFS tripwire (DESIGN.md D19). Git LFS is used only for brand/src/exports/large/,
  #    whose nested .gitattributes marks every file `filter=lfs`. Where no LFS filter is
  #    configured at any scope — git-lfs absent, or installed without `git lfs install` — git
  #    treats that filter as a pass-through and commits the whole file as a plain blob,
  #    silently. Setting filter.lfs.required makes that `git add` fail loudly instead ("clean
  #    filter 'lfs' failed", exit 128). It tests the configured filter, never the program:
  #    `git lfs version` passes when git-lfs is installed but no filter is configured, and the
  #    blob went in whole (mechanics review probe, 03/10/2026). It writes this repository's
  #    own .git/config, which _message_after_copy says; `git lfs install` later sets the same
  #    value, so the setting is then harmless. Copy-only, and never undone by media. Non-fatal:
  #    the final `echo` runs only when `git config` itself failed. `media.py check` is the
  #    second guard (D19), and toolkit-smoke.sh check 8 applies this same condition.
  - command: >-
      git config --get filter.lfs.process >/dev/null 2>&1 ||
      git config --get filter.lfs.clean >/dev/null 2>&1 ||
      git config filter.lfs.required true ||
      echo 'LFS tripwire not set (git config failed): run python3 toolkit/media.py check before you add a large design export.'
    when: "<% _copier_operation == 'copy' %>"
