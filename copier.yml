# ── Identity ─────────────────────────────────────────────────────────────────

# The brand's name in the exact form a viewer meets it. It renders into every skill's H1 and
# the brand section of the media rules, and the toolkit writes it into double-quoted metadata
# (ID3 tags, MP4 titles), so its FORM is load-bearing: 'Harbour Lane Studio' and 'Harbour
# Lane' are different names to every caption, credit and search.
BRAND_NAME:
  type: str
  help: >-
    The brand's name exactly as it appears on screen, in captions and in credits: a trading
    name or a pen name.
  placeholder: Harbour Lane Studio
  validator: >-
    <: if not BRAND_NAME | trim :>
    Give the brand's name — every skill and the brand section of the rules read it.
    <: endif :>
    <: if '"' in BRAND_NAME or '\\' in BRAND_NAME :>
    Avoid double quotation marks and backslashes — the toolkit writes this name into
    double-quoted metadata such as ID3 tags, and the house style uses single quotation marks
    anyway.
    <: endif :>

# The default keeps only letters, digits, spaces and hyphens and joins the words with
# hyphens, so a name with an ampersand or an apostrophe ('Morgan's Ferry & Co') still yields a
# valid slug instead of a default the validator rejects.
#
# The validator is DESIGN.md's ^[a-z][a-z0-9-]+$ written as character-set tests, because
# Jinja has no regular expressions without an extension and this template loads none.
BRAND_SLUG:
  type: str
  help: >-
    The brand's machine name in kebab-case. It names anything that needs a file-safe name.
  default: "<% (BRAND_NAME | lower | select('in', 'abcdefghijklmnopqrstuvwxyz0123456789 -') | join).split() | join('-') %>"
  validator: >-
    <: if BRAND_SLUG | length < 2 or BRAND_SLUG[0] not in 'abcdefghijklmnopqrstuvwxyz'
       or BRAND_SLUG | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list | length > 0 :>
    Use kebab-case that starts with a letter: lower-case letters, digits and hyphens only,
    at least two characters (the pattern ^[a-z][a-z0-9-]+$).
    <: endif :>

# ── Variant ──────────────────────────────────────────────────────────────────
#
# The one answer that decides which single mode file sits beside every moded skill —
# BUSINESS.md, FICTION.md or NONFICTION.md (DESIGN.md D7) — which worked example ships, and
# the defaults of the questions after it. Asked straight after the name, so every later
# question's help, default and placeholder can speak to it.
#
# NO DEFAULT, ON PURPOSE. `copier copy --defaults` without it stops with 'Question "BRAND_KIND"
# is required' rather than quietly generating a business brand, so CI, the audits and every
# application over a syntek-author project must say which kind they mean. It is never derived
# from syntek-author's DOC_TYPE: media reads that answers file for the data-root answers
# alone (D14, as D80 widens it).
#
# Changing it later is REFUSED (DESIGN.md D14; syntek-author D35). The mode files, the worked
# example, the brand seeds and the brand section of the rules are written for one kind of
# brand, and `copier update` only moves what it generated. The validator compares the answer
# with the previous one, read from the project's answers file through _external_data; on a
# copy there is no previous answer and it always passes. Proven on 9.18.2: a changed
# BRAND_KIND stops the update before a single file is touched (probe c8; update-test.sh checks
# 10 and 11). A different brand kind is a new project.
BRAND_KIND:
  type: str
  help: >-
    What kind of brand is this? 'business' — a business's social video, recorded talks and
    explainers; 'author-fiction' — a novelist's book trailers, audiobook and author socials;
    'author-nonfiction' — a non-fiction author's talks, podcast, audiobook and author socials.
    This cannot be changed later: an update refuses a different answer.
  choices:
    - business
    - author-fiction
    - author-nonfiction
  validator: >-
    <: if (_external_data.prev.BRAND_KIND | default(BRAND_KIND, true)) != BRAND_KIND :>
    BRAND_KIND cannot change on update. This project was generated as
    '<% _external_data.prev.BRAND_KIND %>', and its mode files, worked example and brand seeds
    were written for that kind of brand, which a different kind would strand. A different
    brand kind is a new project: generate one and copy your work across.
    <: endif :>

# ── The brief and the audience ───────────────────────────────────────────────

# The first question about the WORK rather than its labels. It renders into the brand section
# of .claude/rules/syntek-media/01-layout-and-routing.md, which is the brand brief in a
# combined project (D5), and into the standalone .claude/CLAUDE.md, README.md and CONTEXT.md —
# so a vague answer here is a vague answer echoed through every brief and script downstream.
BRAND_DESCRIPTION:
  type: str
  help: >-
    What the channel is for and for whom, in one or two full sentences. Every skill reads this
    brief before anything else — write it as a brief, not a tagline.
  placeholder: >-
    <: if BRAND_KIND == 'business' :>Short explainers, recorded talks and behind-the-scenes
    clips from a two-person design studio, for small businesses deciding whether to commission
    a new identity.<: elif BRAND_KIND == 'author-fiction' :>Trailers, read-aloud clips and the
    audiobook of a fantasy novel about a ferry pilot on a drowned coast, for readers who have
    not yet opened the book.<: else :>Recorded talks, a podcast and the audiobook of a book on
    the shared table in a small congregation, for church members with no theological
    training.<: endif :>
  validator: >-
    <: if BRAND_DESCRIPTION | trim | length < 40 :>
    Write at least a full sentence — a tagline is not a brief, and this is what every skill
    reads before it reads anything else.
    <: endif :>

# The one viewer or listener every piece must work for. The comprehension skill
# (syntek-author), where present, reads every script as this person, and the brand section of
# the media rules names them. One default per brand kind; the business and fiction defaults
# assume a feed that plays with the sound off, because most of them do.
AUDIENCE_TEST:
  type: str
  help: >-
    One sentence naming the viewer or listener every piece must work for — the lowest common
    denominator, for example 'a small-business owner watching on a phone between meetings,
    with the sound off'.
  default: "<% {'business': 'A small-business owner watching on a phone between meetings, with the sound off.', 'author-fiction': 'A reader who has never heard of the book, scrolling with the sound off.', 'author-nonfiction': 'A thoughtful listener with no specialist training, hearing it on a commute.'}[BRAND_KIND] %>"
  validator: >-
    <: if AUDIENCE_TEST | trim | length < 20 :>
    Name a real viewer or listener in a real moment — a sentence, not a label.
    <: endif :>

# ── The owner ────────────────────────────────────────────────────────────────

# Who maintains the project, in its exact written form: 'Maintained By' in every metadata
# header media ships (D14). It defaults to the brand's name, which is right for a business and
# for an author whose pen name is the brand; an owner who signs differently changes it.
OWNER_NAME:
  type: str
  help: >-
    The person or business who maintains the project, exactly as written: it is 'Maintained
    By' in every metadata header.
  default: "<% BRAND_NAME %>"
  validator: >-
    <: if not OWNER_NAME | trim :>
    Give the owner's name as it is written — every metadata header carries it.
    <: endif :>
    <: if '"' in OWNER_NAME or '\\' in OWNER_NAME :>
    Avoid double quotation marks and backslashes — this value can be written into
    double-quoted metadata, and the house style uses single quotation marks anyway.
    <: endif :>

# How skills address the owner in chat. Derived from the first word of OWNER_NAME, which is
# wrong whenever that is a business's name or opens with an initial or a title — hence a
# question rather than a computed value.
OWNER_FIRST_NAME:
  type: str
  help: >-
    What should the skills call you in chat? Defaults to the first word of the owner's name;
    change it if that is a business name, an initial or a title.
  default: "<% (OWNER_NAME.split() or [''])[0] %>"
  validator: >-
    <: if not OWNER_FIRST_NAME | trim :>
    Give the name the skills should use when they speak to you.
    <: endif :>

# ── Platforms and media ──────────────────────────────────────────────────────
#
# Two lists, each a multiple choice (`multiselect: true`; DESIGN.md Section 2). Each value
# opens its own gated files (Section 3.5): a platform its profile seed in brand/src/platforms/
# and its guide in publishing/docs/reference/, and podcast also the self-hosted feed's folder,
# workflow and guide (D58, D59); a media kind its guide in scripts/docs/reference/ and, for
# podcast and audiobook, its workflows, folder and skill.
#
# Since 0.2.0 three platforms are the brand's own channels (DESIGN.md D53): `website` (every
# site the brand publishes media to, its own and any it writes for, each a row of the profile,
# never a value of its own), `blog` (dated posts on those sites) and `newsletter` (email
# issues: a linked still or GIF, never video). They stay three values so that each gates its
# own profile, guide and tables: a project may choose `blog` without `website`.
#
# THE DEFAULTS DID NOT CHANGE (D54): a value joins a kind's default only where every project of
# that kind should have it, and none of the three qualifies — a podcast may be served from any
# web server the brand controls or kept on a host, and over syntek-author the written side's
# documents decide which channels carry media (D56). The help recommends `website` beside
# `podcast` instead. A self-hosted podcast needs PLATFORMS `podcast` (and `website` for its
# episode pages), and MEDIA_KINDS `podcast` only for an episode of its own (D58 route 2): a
# talk published as an episode needs only the talk's own kind.
#
# The labels are what the person answering reads, in syntek-author's `"label": value` form
# (its BUSINESS_FAMILIES); the answers file, every gate, every default and `--data` take the
# VALUES: `--data 'PLATFORMS=[youtube, podcast]'`. Both are always asked and refuse an empty
# list, which is what lets every gate be a bare membership test (D15).
#
# Each default is one dictionary lookup on BRAND_KIND, rendered with `| tojson` so that Copier
# reads a list (proven on 9.18.2), and holds values, never labels.
#
# REMOVING A VALUE LATER DELETES WHAT IT GENERATED (D16): `copier update` with a list that no
# longer names it deletes that value's template files, seeds included — a platform profile the
# author has filled in among them — and leaves every file the author created. A list passed on
# update replaces the whole list. Nothing refuses it (D14 guards BRAND_KIND only):
# _message_before_update names what each removal deletes, and each help below says so.

PLATFORMS:
  type: str
  multiselect: true
  help: >-
    Where will this brand publish? Choose every platform: each adds its profile in
    brand/src/platforms/, which you fill in, and its guide in publishing/docs/reference/.
    podcast also adds a guide to its self-hosted feed, the folder for your show registers,
    publishing/src/podcast/, and the feed workflow,
    publishing/workflows/08-publish-the-podcast-feed/; choose website beside it when your
    own site serves the feed and its episode pages. One website covers every site you
    publish to. Removing one later deletes every file it generated, including the
    platform profile you filled in.
  choices:
    "youtube — long videos, Shorts and thumbnails": youtube
    "tiktok — vertical video": tiktok
    "instagram — reels, stories and covers": instagram
    "linkedin — landscape and vertical video posts": linkedin
    "facebook — reels and feed video": facebook
    "podcast — Apple Podcasts and Spotify, from your own feed or a podcast host": podcast
    "website — sites you publish to: self-hosted or embedded video, posters and share images": website
    "blog — posts on those sites: video, transcripts, featured and share images": blog
    "newsletter — email issues: a linked preview image or GIF, never video": newsletter
  default: "<% {'business': ['youtube', 'linkedin', 'instagram'], 'author-fiction': ['youtube', 'tiktok', 'instagram', 'facebook'], 'author-nonfiction': ['youtube', 'podcast', 'instagram', 'facebook']}[BRAND_KIND] | tojson %>"
  validator: >-
    <: if not PLATFORMS :>
    Choose at least one platform — every piece is made for somewhere.
    <: endif :>

# `voiceover` gates only the guide to a piece that is a voiceover and nothing else. The
# voiceover skill, its workflow, its folder and its guide ship whatever is chosen, because
# every brand kind narrates explainers, trailers or episodes (D51); the label says so.
MEDIA_KINDS:
  type: str
  multiselect: true
  help: >-
    What will this brand make? Choose every kind: each adds its guide in
    scripts/docs/reference/, and podcast and audiobook add their workflows, and audiobook its
    folder and the narrate-audiobook skill. Removing one later deletes every file it
    generated, including any seed in it you filled in; your own files stay.
  choices:
    "short-video — vertical shorts and clips": short-video
    "long-video — explainers and talks": long-video
    "podcast — episodes": podcast
    "audiobook — narrated or recorded books": audiobook
    "trailer — book and launch trailers": trailer
    "voiceover — pieces that are only a voiceover (the voiceover skill ships whatever you choose)": voiceover
  default: "<% {'business': ['short-video', 'long-video', 'voiceover'], 'author-fiction': ['short-video', 'trailer', 'audiobook', 'voiceover'], 'author-nonfiction': ['long-video', 'short-video', 'podcast', 'audiobook', 'voiceover']}[BRAND_KIND] | tojson %>"
  validator: >-
    <: if not MEDIA_KINDS :>
    Choose at least one kind of media — the guides and workflows follow what you make.
    <: endif :>

# ── Options ──────────────────────────────────────────────────────────────────

# Copy-only, through the seed-once block of _exclude: an example the author deletes stays
# deleted (DESIGN.md D43, Section 3.2). Applying media to a project already in use passes
# false (Section 8).
SEED_EXAMPLES:
  type: bool
  help: >-
    Include one worked example to learn from: a 30-second <: if BRAND_KIND == 'business'
    :>explainer<: elif BRAND_KIND == 'author-fiction' :>teaser for the novel<: else :>clip from
    a talk<: endif :>, spoken on camera and carried from its brief to its post package, planned
    but never rendered. Delete it when you are done and it never comes back. Answer false when
    applying to a project already in use.
  default: true

# ── Policy and locale ────────────────────────────────────────────────────────

# The tier for mechanical work only — renders, encodes, file moves, logging and ticks. What a
# viewer or listener will read or hear, and every judgement, is always Opus, and Haiku is never
# used (.claude/rules/syntek-media/05-model-allocation.md; D38). The defaults are
# syntek-author's own — opus for business, otherwise sonnet — so a combined project's two
# always-loaded model tables agree unless the owner answers differently.
MODEL_MECHANICAL:
  type: str
  help: >-
    Which model does mechanical work — renders, encodes, file moves and ticks? Anything a
    viewer or listener will read or hear always uses Opus, and Haiku is never used.
  choices:
    - sonnet
    - opus
  default: "<% 'opus' if BRAND_KIND == 'business' else 'sonnet' %>"

TIMEZONE:
  type: str
  help: >-
    Your timezone, as an IANA name — skills use it for dates in filenames and headers and for
    the times in the posting schedule
  default: Europe/London
  validator: >-
    <: if '/' not in TIMEZONE and TIMEZONE != 'UTC' :>
    Use an IANA timezone name, for example Europe/London.
    <: endif :>

# ── Meta ─────────────────────────────────────────────────────────────────────

DATE:
  type: str
  help: >-
    Baseline date stamped into every metadata header (DD/MM/YYYY, day first). It is answered
    once and kept, so `copier update` never churns every header in the project.
  placeholder: 03/10/2026
  validator: >-
    <: if DATE | length != 10 or DATE[2] != '/' or DATE[5] != '/'
       or (DATE[0:2] ~ DATE[3:5] ~ DATE[6:10]) | reject('in', '0123456789') | list | length > 0 :>
    Use DD/MM/YYYY, for example 03/10/2026.
    <: elif (DATE[0:2] | int) < 1 or (DATE[0:2] | int) > 31 or (DATE[3:5] | int) < 1 or (DATE[3:5] | int) > 12 :>
    Use DD/MM/YYYY — day first, then month (01–12).
    <: endif :>

# ── Coding agents and the data root (family-shared; DESIGN.md D80, Section 2) ──────────
#
# Fifteen questions shared with syntek-author: which coding agents besides Claude Code the
# project uses, and their models (syntek-author D47); where its binary files are kept, and
# with what layout (syntek-author D50); and which service keeps a copy of that data root
# (syntek-author D53). Since 0.5.0 (D80) the lines strictly between the two marker lines below
# are syntek-author's family-shared 'questions' block, byte for byte: since 0.6.0 at its v0.8.0
# tag, not its v0.5.0 (D81), as family-shared.json records it. Never edit them here: they come
# again only from a later syntek-author tag (one tag for all, D85). Its client and model
# defaults now read the project's previous answers, then syntek-author's record (syntek-author
# D47 and its Section 9 rule 7), so its peer read covers AGENT_CLIENTS, CODEX_MODEL,
# GEMINI_MODEL and the OPENCODE_* keys as well as DATA_* (D14's text, corrected by D81). The
# marker lines are syntek-author's too, byte for byte, so that its family-shared.sh finds the
# block: their D48 is syntek-author's decision, never media's D48. So the block names no
# template and no media path: where its comments and help say 'the other template' or 'the
# sibling', read syntek-author.
#
# Inside the block a delimiter reads only its own fifteen keys, `_external_data` (prev and
# peer, named above, outside the block), `_folder_name` (the slug's default), Copier's `UNSET`
# (the same default, where no slug can be derived; the floor above admits it) and the
# short local names its own `set` statements make (since v0.7.0's defaults). The one
# name besides them is syntek-author's retired INCLUDE_DRIVE_SYNC, inside two string literals
# in DATA_PROVIDER's default: media never asked it, so media's own record never holds it, and
# the default goes on to syntek-author's answer, then none. The block sits LAST, after DATE,
# so no media question reads these answers: one placed before the block reads '' under
# --defaults (syntek-author's probe, Copier 9.17.1 and 9.18.2).
#
# What the answers do here. AGENT_CLIENTS gates each client's files (the coding-agent block of
# _exclude, which acts on a copy only) and the rows of the model table in
# .claude/rules/syntek-media/05-model-allocation.md; a model answer is written into its
# client's own file on a copy only. The data-root answers place nothing yet: media's map,
# .claude/syntek-media-dataroot.json, names no folder (D80), so footage stays where
# production/src/footage/manifest.toml lists it. They keep the family's records in agreement,
# which the data-root resolver requires of every answers file in the project, and
# _message_after_update reports a difference from syntek-author's. Every gate, `when:` and
# content block that reads one of these answers repeats its question's `when:` test, and tests
# DATA_STORE by equality with a value, never `!=` (syntek-author D50).
#
# Existing projects need no migration (D80, D81): the update that first asks these writes no
# client's files, and records syntek-author's AGENT_CLIENTS where its record holds a list (an
# empty one included), otherwise [], and DATA_STORE repo, or the store syntek-author already
# records; _message_before_update says so. Over syntek-author, a first copy likewise takes
# syntek-author's recorded clients and models, so it writes no client file syntek-author's
# answers leave out.
# BEGIN family-shared questions (D48)
# The client values are the gate strings and never change; the labels may. Gemini CLI and
# Antigravity are two choices, not one: they share GEMINI.md and the .agents/skills link, but
# only Gemini CLI reads .gemini/settings.json and only Antigravity reads
# .agents/mcp_config.json.
#
# One project, one set of client files and one model table: the default reads this
# template's previous answers record, then the other template's, and takes from either only
# a list (never a string or a mapping), keeping only its values that are still choices. A
# previous record that holds this answer keeps it, so a copy over an existing project
# (re-adoption) never resets the clients, unless a Copier settings file sets them. Next
# comes the other template's list, an empty one included: the client files are written once,
# by whichever template comes first, so a template applied second writes no client file the
# first left out, and both records, and so both model tables, name the same clients. Where
# neither record holds a list, a previous record belongs to a project being updated, which
# must record no client whose files it never received, so the default there is none. So the
# update that first asks this question beside another template's record of clients takes
# those clients, not none. That update writes no client file, so the model table follows the
# answer and then matches the files the other template wrote; the update script, which
# offers its MCP servers only to the client files the answers name, may then add each once
# to those files where it never stood, and its report lists those clients' files the project
# lacks as not added. A fresh copy, alone or beside another template's record from before
# this question, gets all four. `_copier_operation` cannot make this test: it is undefined
# in question defaults.
AGENT_CLIENTS:
  type: str
  multiselect: true
  help: >-
    Which coding agents besides Claude Code will you use here? Each adds its entrypoint and
    settings; all of them read the same rules, skills and memory in .claude/. These files
    are written once: an update never adds, changes or recreates them. On an update that
    first asks this, the default is none, or the clients another template in this project
    records: tick a client to add its row to the model table, then follow the agents bridge
    in .claude/ (the .claude/syntek-*-agents.md file) to add its files. Tick none to keep the
    project Claude-only.
  choices:
    "Codex — OpenAI's coding agent (AGENTS.md, .codex/)": codex
    "Gemini CLI — Google's terminal agent (GEMINI.md, .gemini/)": gemini-cli
    "Antigravity — Google's agent IDE (GEMINI.md, .agents/mcp_config.json)": antigravity
    "OpenCode 2 or later — any model, including a local server (AGENTS.md, opencode.json)": opencode
  default: "<: set o = ['codex', 'gemini-cli', 'antigravity', 'opencode'] :><: set q = (_external_data.prev or {}).get('AGENT_CLIENTS') :><: set p = (_external_data.peer or {}).get('AGENT_CLIENTS') :><% (q | select('in', o) | list | tojson) if (q is sequence and q is not string and q is not mapping) else ((p | select('in', o) | list | tojson) if (p is sequence and p is not string and p is not mapping) else ('[]' if (_external_data.prev or {}).get('_commit') else '[codex, gemini-cli, antigravity, opencode]')) %>"

# Blank leaves the client's own default. Codex ignores `model_provider`, `model_providers` and
# `profile(s)` in a project file, with a warning (0.160.1), so running Codex on a local model
# is the owner's user-level setting, not this answer. Model names are checked as character
# sets (no Jinja regular expressions), so an answer can never break the TOML or JSON it is
# written into. Each model's default reads the previous answers record, then the other
# template's, as the clients' does, and takes a recorded name only where it is a string that
# passes the validator's character check; otherwise it is blank.
CODEX_MODEL:
  type: str
  help: >-
    Which model should Codex use for substantive work? Leave blank to use Codex's own
    default. Written to .codex/config.toml once; change it there later.
  default: "<: set c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-' :><: set q = (_external_data.prev or {}).get('CODEX_MODEL') :><: set p = (_external_data.peer or {}).get('CODEX_MODEL') :><% q if (q is string and q | reject('in', c) | list | length == 0) else (p if (p is string and p | reject('in', c) | list | length == 0) else '') %>"
  when: "<% 'codex' in AGENT_CLIENTS %>"
  validator: >-
    <: if 'codex' in AGENT_CLIENTS and CODEX_MODEL | reject('in', 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-') | list | length > 0 :>
    Use a model name: letters, digits and . _ : / @ + - only, no spaces or quotation marks.
    <: endif :>

GEMINI_MODEL:
  type: str
  help: >-
    Which model should Gemini CLI use for substantive work? Leave blank to use its own
    default. Written to .gemini/settings.json once; change it there later.
  default: "<: set c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-' :><: set q = (_external_data.prev or {}).get('GEMINI_MODEL') :><: set p = (_external_data.peer or {}).get('GEMINI_MODEL') :><% q if (q is string and q | reject('in', c) | list | length == 0) else (p if (p is string and p | reject('in', c) | list | length == 0) else '') %>"
  when: "<% 'gemini-cli' in AGENT_CLIENTS %>"
  validator: >-
    <: if 'gemini-cli' in AGENT_CLIENTS and GEMINI_MODEL | reject('in', 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-') | list | length > 0 :>
    Use a model name: letters, digits and . _ : / @ + - only, no spaces or quotation marks.
    <: endif :>

# OpenCode is the client for local models. `user` writes no model and no provider, so each
# person's own OpenCode settings apply; `named` writes a `provider/model` only. Every local
# server is written as one OpenAI-compatible provider in opencode.json, under the server's own
# id, so the model reads `<provider>/<model>` in OpenCode. No key is written: a server that
# needs one gets it from OpenCode's own credential store or an environment variable the owner
# sets. A committed provider replaces, for every collaborator, the address of any provider of
# theirs with the same id, which is why the default writes none.
#
# The OpenCode defaults read the previous answers record, then the other template's, as the
# clients' does. The provider takes a recorded value only where it is one of its choice
# values, which its default repeats: Copier checks `choices` even on a hidden value, so a
# value not offered must never reach it. The address, the model and the context take a
# recorded value only from a record whose provider equals this answer, and only where the
# question's validator would accept it, so a provider the person changes never inherits
# another provider's address, model or context.
OPENCODE_PROVIDER:
  type: str
  help: >-
    Where does OpenCode get its model? A local server keeps the writing on this machine. A
    local provider written here overrides, for every collaborator, any provider of theirs
    with the same id.
  choices:
    "Use my OpenCode settings (no model or provider written)": user
    "A model I name (provider/model)": named
    "llama.cpp — llama-server or llama-swap": llama-cpp
    "Ollama": ollama
    "vLLM": vllm
    "LM Studio": lmstudio
    "Another OpenAI-compatible server": openai-compatible
  default: "<: set o = ['user', 'named', 'llama-cpp', 'ollama', 'vllm', 'lmstudio', 'openai-compatible'] :><: set q = (_external_data.prev or {}).get('OPENCODE_PROVIDER') :><: set p = (_external_data.peer or {}).get('OPENCODE_PROVIDER') :><% q if q in o else (p if p in o else 'user') %>"
  when: "<% 'opencode' in AGENT_CLIENTS %>"

# The defaults are each server's documented local port. The validator matches
# ^https?://[^\s"]+/v1/?$ exactly, without a regular expression (fuzzed against re.fullmatch
# over 200,023 strings, Unicode whitespace included): the answer is written inside a JSON
# string, so whitespace or a quotation mark would break opencode.json. A trailing slash is
# accepted and dropped when the address is written.
OPENCODE_BASE_URL:
  type: str
  help: >-
    The server's OpenAI-compatible address, ending /v1. The default is the server's usual
    local port.
  default: >-
    <: set r = _external_data.prev or {} :><: set e = _external_data.peer or {} :><: set q =
    r.get('OPENCODE_BASE_URL') if r.get('OPENCODE_PROVIDER') == OPENCODE_PROVIDER else none :><: set p =
    e.get('OPENCODE_BASE_URL') if e.get('OPENCODE_PROVIDER') == OPENCODE_PROVIDER else none :><: set qb =
    (q[8:] if q.startswith('https://') else (q[7:] if q.startswith('http://') else '')) if q is string else '' :><: set
    qb = qb[:-1] if qb.endswith('/v1/') else qb :><: set pb = (p[8:] if p.startswith('https://') else (p[7:] if
    p.startswith('http://') else '')) if p is string else '' :><: set pb = pb[:-1] if pb.endswith('/v1/') else pb :><%
    q if (qb.endswith('/v1') and (qb[:-3] | length) > 0 and (q.split() | join) == q and '"' not in q) else (p if
    (pb.endswith('/v1') and (pb[:-3] | length) > 0 and (p.split() | join) == p and '"' not in p) else
    {'llama-cpp': 'http://127.0.0.1:8080/v1', 'ollama': 'http://127.0.0.1:11434/v1',
    'vllm': 'http://127.0.0.1:8000/v1', 'lmstudio': 'http://127.0.0.1:1234/v1'}.get(OPENCODE_PROVIDER, '')) %>
  when: "<% 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER not in ['user', 'named'] %>"
  validator: >-
    <: if 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER not in ['user', 'named'] :><: set u = OPENCODE_BASE_URL :><: set body = u[8:] if u.startswith('https://') else (u[7:] if u.startswith('http://') else '') :><: set body = body[:-1] if body.endswith('/v1/') else body :><: if not body.endswith('/v1') or (body[:-3] | length) < 1 or (u.split() | join) != u or '"' in u :>Use the server's address with http:// or https:// and ending /v1 or /v1/, for example http://127.0.0.1:8080/v1.<: endif :><: endif :>

# No default model: one machine's catalogue is no project's honest default, so a local server
# needs the owner to name its model, and the validator says so.
OPENCODE_MODEL:
  type: str
  help: >-
    The model's ID. For a local server, the name it lists at /v1/models (Ollama, for example,
    qwen3:30b). For a model you name, provider/model as OpenCode lists it.
  default: "<: set c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-' :><: set r = _external_data.prev or {} :><: set e = _external_data.peer or {} :><: set q = r.get('OPENCODE_MODEL') if r.get('OPENCODE_PROVIDER') == OPENCODE_PROVIDER else none :><: set p = e.get('OPENCODE_MODEL') if e.get('OPENCODE_PROVIDER') == OPENCODE_PROVIDER else none :><% q if (q is string and q and q | reject('in', c) | list | length == 0 and (OPENCODE_PROVIDER != 'named' or '/' in q)) else (p if (p is string and p and p | reject('in', c) | list | length == 0 and (OPENCODE_PROVIDER != 'named' or '/' in p)) else '') %>"
  when: "<% 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER != 'user' %>"
  validator: >-
    <: if 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER != 'user' :><: if not OPENCODE_MODEL :>Name the model: a local server's ID as it lists it at /v1/models, or provider/model.<: elif OPENCODE_MODEL | reject('in', 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-') | list | length > 0 :>Use a model ID: letters, digits and . _ : / @ + - only, no spaces or quotation marks.<: elif OPENCODE_PROVIDER == 'named' and '/' not in OPENCODE_MODEL :>Write a model you name as provider/model, as OpenCode lists it.<: endif :><: endif :>

# Never larger than the server loads: OpenCode plans its context from this number, and a
# figure above the server's makes long sessions fail rather than shrink. The defaults are a
# safe floor per server, not a recommendation: 4096 is small for agent work.
OPENCODE_CONTEXT:
  type: int
  help: >-
    The context length the server actually loads for this model, in tokens. Never more than
    the server's setting: raise the server's own setting and this number together. Ollama's
    default depends on the GPU's memory (4k, 32k or 256k) unless OLLAMA_CONTEXT_LENGTH or a
    model's num_ctx sets it.
  default: "<: set r = _external_data.prev or {} :><: set e = _external_data.peer or {} :><: set q = (r.get('OPENCODE_CONTEXT') if r.get('OPENCODE_PROVIDER') == OPENCODE_PROVIDER else 0) | string | int :><: set p = (e.get('OPENCODE_CONTEXT') if e.get('OPENCODE_PROVIDER') == OPENCODE_PROVIDER else 0) | string | int :><% q if (q >= 1024 and q <= 10000000) else (p if (p >= 1024 and p <= 10000000) else {'llama-cpp': 262144, 'ollama': 4096, 'lmstudio': 4096, 'vllm': 32768}.get(OPENCODE_PROVIDER, 32768)) %>"
  when: "<% 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER not in ['user', 'named'] %>"
  validator: >-
    <: if 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER not in ['user', 'named'] and (OPENCODE_CONTEXT | int < 1024 or OPENCODE_CONTEXT | int > 10000000) :>Use the server's context length in tokens, from 1024 to 10000000.<: endif :>

# The data-root questions. Portable and path-free: each machine names its root in the
# SYNTEK_DATA_ROOT environment variable, never in a file here, and the project's resolver
# (.claude/syntek-*-dataroot.py) reads these answers at run time. The defaults read this
# template's previous answers, then the sibling template's data-root answers, then
# whether the project already exists (a previous record, or a sibling's record from before
# the data root). Only a value offered here is ever taken from a record, and every gate on
# the store tests it by equality, so a value a newer template adds opens nothing.
#
# So a fresh copy defaults to external, and the update that first asks this to repo, as does
# a copy beside a sibling record that predates the data root; a store the sibling already
# records comes first. The validator binds a first answer only (no store recorded here yet):
# it must equal the sibling's, so one project keeps one store. A later difference is allowed,
# reported after the update and refused by the resolver's data commands until both agree, so
# neither template can deadlock the other. A sibling value this version does not offer is
# refused with a message, never fed to `choices`. The `!=` there compares two answers, not an
# answer with a value, and opens no path.
DATA_STORE:
  type: str
  help: >-
    Where are this project's binary files kept: documents, images, audio and video (scans,
    signed copies, footage, renders, issued copies)? Outside keeps Git to text: each file is
    filed under this machine's data root, which the SYNTEK_DATA_ROOT environment variable
    names (never the repository), and is listed with its checksum. Inside keeps them in the
    repository, as before. Every template in this project uses the same answer.
  choices:
    "Outside the repository, under this machine's data root (recommended)": external
    "Inside the repository, as before": repo
  default: "<% (_external_data.prev or {}).get('DATA_STORE') if (_external_data.prev or {}).get('DATA_STORE') in ['external', 'repo'] else ((_external_data.peer or {}).get('DATA_STORE') if (_external_data.peer or {}).get('DATA_STORE') in ['external', 'repo'] else ('repo' if ((_external_data.prev or {}).get('_commit') or (_external_data.peer or {})) else 'external')) %>"
  validator: >-
    <: set p = (_external_data.peer or {}).get('DATA_STORE') :><: set q = (_external_data.prev or {}).get('DATA_STORE') :><: if p and q not in ['external', 'repo'] and DATA_STORE != p :>One project, one store: the other template recorded '<% p %>'.<: endif :>

# The layout under the root: <root>/<area>/<kind folder>/<slug>/<the file's path in the
# repository>. Asked only under the external store. Each default reads this template's
# previous answer, then the sibling's, then a literal; `business` is the area in every
# variant, because nothing in this block may read the variant. A first answer (none recorded
# here yet) must equal the sibling's exactly, case included. A later change is allowed (the
# files already filed stay under their old folder, which the resolver names), except a
# change of case alone, which one disk treats as the same folder and another as a second one.
# Leaving external forgets these answers (Copier drops a hidden answer), so a return
# re-derives them. The rules are character-set tests, without a regular expression: no
# character Windows or a network disk refuses, no control character, no trailing dot or
# space and no leading space (so neither . nor ..), no device name before the first dot in
# any case, at most 64 characters.
DATA_AREA:
  type: str
  help: >-
    The first folder under this machine's data root that holds this project's files, named
    as you want it on disk, case kept: for example business, personal or Client Work. Every
    machine and every template in this project uses the same name.
  default: "<% (_external_data.prev or {}).get('DATA_AREA') or (_external_data.peer or {}).get('DATA_AREA') or 'business' %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set a = DATA_AREA :><: set p = (_external_data.peer or {}).get('DATA_AREA') :><: set q = (_external_data.prev or {}).get('DATA_AREA') :><: set stem = a.split('.')[0].rstrip(' ').upper() :><: if not a :>Name the area, the first folder under the data root: for example business.<: elif a | select('in', '<>:"/\\|?*') | list | length > 0 :>Leave out < > : " / \ | ? and *: Windows and network disks refuse them in a folder name.<: elif a | select('lt', ' ') | list | length > 0 or '\x7f' in a :>Leave out tabs and other control characters: no disk keeps them safely in a folder name.<: elif a[-1] in '. ' or a[0] == ' ' :>Do not end the name with a dot or a space, or begin it with a space: Windows drops them, which is also why . and .. are refused.<: elif stem in ['CON', 'PRN', 'AUX', 'NUL', 'CONIN$', 'CONOUT$'] or (stem | length == 4 and stem[:3] in ['COM', 'LPT'] and stem[3] in '123456789¹²³') :>Windows reserves that name in any case, before any dot (CON, PRN, AUX, NUL, COM1 to COM9, LPT1 to LPT9 and the like): choose another.<: elif a | length > 64 :>Keep the name to 64 characters or fewer.<: elif q and a != q and a | lower == q | lower :>This project's files are filed under '<% q %>'. A change of case alone makes a second folder on some disks and the same folder on others: keep '<% q %>', or choose another name.<: elif not q and p and a != p and a | lower == p | lower :>The other template files this project under '<% p %>'. A difference of case alone makes a second folder on some disks and the same folder on others: answer '<% p %>' exactly.<: elif not q and p and a != p :>One project, one layout: the other template files this project under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

# The slug's default is the project folder's name in kebab case (lower case; `_`, `.`, `-`
# and spaces separate words; other characters dropped), cut to 64 characters with no
# trailing hyphen. Where nothing is left, or a device name, it renders UNSET, so the question
# has no default and must be answered: Copier validates a shown question's default before any
# prompt, so a default that failed this validator would abort the copy. A literal fallback
# would put every such project in one shared folder. Never renamed once files are filed.
DATA_SLUG:
  type: str
  help: >-
    This project's own folder inside each kind folder, in kebab case (a to z, 0 to 9 and
    hyphens). Every template in this project uses the same name. Never change it once files
    are filed under it: they stay in the old folder.
  default: "<: set k = ((_folder_name | lower | replace('_', ' ') | replace('.', ' ') | replace('-', ' ') | select('in', 'abcdefghijklmnopqrstuvwxyz0123456789 ') | join).split() | join('-'))[:64].rstrip('-') :><% (_external_data.prev or {}).get('DATA_SLUG') or (_external_data.peer or {}).get('DATA_SLUG') or (k if k and k not in ['con', 'prn', 'aux', 'nul', 'com1', 'com2', 'com3', 'com4', 'com5', 'com6', 'com7', 'com8', 'com9', 'lpt1', 'lpt2', 'lpt3', 'lpt4', 'lpt5', 'lpt6', 'lpt7', 'lpt8', 'lpt9'] else UNSET) %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set s = DATA_SLUG :><: set p = (_external_data.peer or {}).get('DATA_SLUG') :><: set q = (_external_data.prev or {}).get('DATA_SLUG') :><: if not s :>Name this project's folder under each kind folder, in kebab case: for example client-documents.<: elif s | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list | length > 0 :>Use lower-case letters a to z, digits and hyphens only: for example client-documents.<: elif s[0] == '-' or s[-1] == '-' or '--' in s :>Do not begin or end the name with a hyphen, or put two hyphens together.<: elif s in ['con', 'prn', 'aux', 'nul', 'com1', 'com2', 'com3', 'com4', 'com5', 'com6', 'com7', 'com8', 'com9', 'lpt1', 'lpt2', 'lpt3', 'lpt4', 'lpt5', 'lpt6', 'lpt7', 'lpt8', 'lpt9'] :>Windows reserves that name (con, prn, aux, nul, com1 to com9, lpt1 to lpt9): choose another.<: elif s | length > 64 :>Keep the name to 64 characters or fewer.<: elif not q and p and s != p :>One project, one layout: the other template files this project under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

# The four kind folders under the area. Each takes the area's rules, and each must differ
# from the kinds asked before it, ignoring case, or two kinds would share one folder on a
# case-insensitive disk.
DATA_KIND_DOCS:
  type: str
  help: >-
    The folder under the area for documents: PDFs, Office files, archives and scans.
  default: "<% (_external_data.prev or {}).get('DATA_KIND_DOCS') or (_external_data.peer or {}).get('DATA_KIND_DOCS') or 'docs' %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set k = DATA_KIND_DOCS :><: set p = (_external_data.peer or {}).get('DATA_KIND_DOCS') :><: set q = (_external_data.prev or {}).get('DATA_KIND_DOCS') :><: set stem = k.split('.')[0].rstrip(' ').upper() :><: if not k :>Name the folder for documents: for example docs.<: elif k | select('in', '<>:"/\\|?*') | list | length > 0 :>Leave out < > : " / \ | ? and *: Windows and network disks refuse them in a folder name.<: elif k | select('lt', ' ') | list | length > 0 or '\x7f' in k :>Leave out tabs and other control characters: no disk keeps them safely in a folder name.<: elif k[-1] in '. ' or k[0] == ' ' :>Do not end the name with a dot or a space, or begin it with a space: Windows drops them, which is also why . and .. are refused.<: elif stem in ['CON', 'PRN', 'AUX', 'NUL', 'CONIN$', 'CONOUT$'] or (stem | length == 4 and stem[:3] in ['COM', 'LPT'] and stem[3] in '123456789¹²³') :>Windows reserves that name in any case, before any dot (CON, PRN, AUX, NUL, COM1 to COM9, LPT1 to LPT9 and the like): choose another.<: elif k | length > 64 :>Keep the name to 64 characters or fewer.<: elif q and k != q and k | lower == q | lower :>This project's documents are filed under '<% q %>'. A change of case alone makes a second folder on some disks and the same folder on others: keep '<% q %>', or choose another name.<: elif not q and p and k != p and k | lower == p | lower :>The other template files documents under '<% p %>'. A difference of case alone makes a second folder on some disks and the same folder on others: answer '<% p %>' exactly.<: elif not q and p and k != p :>One project, one layout: the other template files documents under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

DATA_KIND_PHOTOS:
  type: str
  help: >-
    The folder under the area for images: photographs, artwork and image exports.
  default: "<% (_external_data.prev or {}).get('DATA_KIND_PHOTOS') or (_external_data.peer or {}).get('DATA_KIND_PHOTOS') or 'photos' %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set k = DATA_KIND_PHOTOS :><: set p = (_external_data.peer or {}).get('DATA_KIND_PHOTOS') :><: set q = (_external_data.prev or {}).get('DATA_KIND_PHOTOS') :><: set stem = k.split('.')[0].rstrip(' ').upper() :><: if not k :>Name the folder for images: for example photos.<: elif k | select('in', '<>:"/\\|?*') | list | length > 0 :>Leave out < > : " / \ | ? and *: Windows and network disks refuse them in a folder name.<: elif k | select('lt', ' ') | list | length > 0 or '\x7f' in k :>Leave out tabs and other control characters: no disk keeps them safely in a folder name.<: elif k[-1] in '. ' or k[0] == ' ' :>Do not end the name with a dot or a space, or begin it with a space: Windows drops them, which is also why . and .. are refused.<: elif stem in ['CON', 'PRN', 'AUX', 'NUL', 'CONIN$', 'CONOUT$'] or (stem | length == 4 and stem[:3] in ['COM', 'LPT'] and stem[3] in '123456789¹²³') :>Windows reserves that name in any case, before any dot (CON, PRN, AUX, NUL, COM1 to COM9, LPT1 to LPT9 and the like): choose another.<: elif k | length > 64 :>Keep the name to 64 characters or fewer.<: elif k | lower == DATA_KIND_DOCS | lower :>Give images a folder of their own: documents already use '<% DATA_KIND_DOCS %>', and a difference of case alone is the same folder on some disks.<: elif q and k != q and k | lower == q | lower :>This project's images are filed under '<% q %>'. A change of case alone makes a second folder on some disks and the same folder on others: keep '<% q %>', or choose another name.<: elif not q and p and k != p and k | lower == p | lower :>The other template files images under '<% p %>'. A difference of case alone makes a second folder on some disks and the same folder on others: answer '<% p %>' exactly.<: elif not q and p and k != p :>One project, one layout: the other template files images under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

DATA_KIND_AUDIO:
  type: str
  help: >-
    The folder under the area for audio, such as pronunciation recordings and voiceover.
  default: "<% (_external_data.prev or {}).get('DATA_KIND_AUDIO') or (_external_data.peer or {}).get('DATA_KIND_AUDIO') or 'audio' %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set k = DATA_KIND_AUDIO :><: set p = (_external_data.peer or {}).get('DATA_KIND_AUDIO') :><: set q = (_external_data.prev or {}).get('DATA_KIND_AUDIO') :><: set stem = k.split('.')[0].rstrip(' ').upper() :><: if not k :>Name the folder for audio: for example audio.<: elif k | select('in', '<>:"/\\|?*') | list | length > 0 :>Leave out < > : " / \ | ? and *: Windows and network disks refuse them in a folder name.<: elif k | select('lt', ' ') | list | length > 0 or '\x7f' in k :>Leave out tabs and other control characters: no disk keeps them safely in a folder name.<: elif k[-1] in '. ' or k[0] == ' ' :>Do not end the name with a dot or a space, or begin it with a space: Windows drops them, which is also why . and .. are refused.<: elif stem in ['CON', 'PRN', 'AUX', 'NUL', 'CONIN$', 'CONOUT$'] or (stem | length == 4 and stem[:3] in ['COM', 'LPT'] and stem[3] in '123456789¹²³') :>Windows reserves that name in any case, before any dot (CON, PRN, AUX, NUL, COM1 to COM9, LPT1 to LPT9 and the like): choose another.<: elif k | length > 64 :>Keep the name to 64 characters or fewer.<: elif k | lower in [DATA_KIND_DOCS | lower, DATA_KIND_PHOTOS | lower] :>Give audio a folder of its own: documents use '<% DATA_KIND_DOCS %>' and images '<% DATA_KIND_PHOTOS %>', and a difference of case alone is the same folder on some disks.<: elif q and k != q and k | lower == q | lower :>This project's audio is filed under '<% q %>'. A change of case alone makes a second folder on some disks and the same folder on others: keep '<% q %>', or choose another name.<: elif not q and p and k != p and k | lower == p | lower :>The other template files audio under '<% p %>'. A difference of case alone makes a second folder on some disks and the same folder on others: answer '<% p %>' exactly.<: elif not q and p and k != p :>One project, one layout: the other template files audio under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

DATA_KIND_VIDEOS:
  type: str
  help: >-
    The folder under the area for video, such as footage and renders.
  default: "<% (_external_data.prev or {}).get('DATA_KIND_VIDEOS') or (_external_data.peer or {}).get('DATA_KIND_VIDEOS') or 'videos' %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set k = DATA_KIND_VIDEOS :><: set p = (_external_data.peer or {}).get('DATA_KIND_VIDEOS') :><: set q = (_external_data.prev or {}).get('DATA_KIND_VIDEOS') :><: set stem = k.split('.')[0].rstrip(' ').upper() :><: if not k :>Name the folder for video: for example videos.<: elif k | select('in', '<>:"/\\|?*') | list | length > 0 :>Leave out < > : " / \ | ? and *: Windows and network disks refuse them in a folder name.<: elif k | select('lt', ' ') | list | length > 0 or '\x7f' in k :>Leave out tabs and other control characters: no disk keeps them safely in a folder name.<: elif k[-1] in '. ' or k[0] == ' ' :>Do not end the name with a dot or a space, or begin it with a space: Windows drops them, which is also why . and .. are refused.<: elif stem in ['CON', 'PRN', 'AUX', 'NUL', 'CONIN$', 'CONOUT$'] or (stem | length == 4 and stem[:3] in ['COM', 'LPT'] and stem[3] in '123456789¹²³') :>Windows reserves that name in any case, before any dot (CON, PRN, AUX, NUL, COM1 to COM9, LPT1 to LPT9 and the like): choose another.<: elif k | length > 64 :>Keep the name to 64 characters or fewer.<: elif k | lower in [DATA_KIND_DOCS | lower, DATA_KIND_PHOTOS | lower, DATA_KIND_AUDIO | lower] :>Give video a folder of its own: documents use '<% DATA_KIND_DOCS %>', images '<% DATA_KIND_PHOTOS %>' and audio '<% DATA_KIND_AUDIO %>', and a difference of case alone is the same folder on some disks.<: elif q and k != q and k | lower == q | lower :>This project's video is filed under '<% q %>'. A change of case alone makes a second folder on some disks and the same folder on others: keep '<% q %>', or choose another name.<: elif not q and p and k != p and k | lower == p | lower :>The other template files video under '<% p %>'. A difference of case alone makes a second folder on some disks and the same folder on others: answer '<% p %>' exactly.<: elif not q and p and k != p :>One project, one layout: the other template files video under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

# Which service keeps a copy of the data root. The values are stable; the labels may change.
# The answer runs nothing: the owner sets up and runs the service, and the data-root tool
# tailors its advice and checks to the answer. It is asked always and never refused: a
# difference from the other template's answer moves no file, so the tool reports it instead.
#
# The default keeps a recorded answer. Failing that, it maps a retired yes-or-no answer about
# Google Drive workflows that an older record may hold (true becomes google-drive, false
# none), so the update that first asks this keeps what the project had; then it takes the
# other template's recorded answer; and otherwise none. This project's own record, current or
# retired, outranks the other template's.
DATA_PROVIDER:
  type: str
  help: >-
    Which service keeps a copy of this project's data root, the folder outside the repository
    that holds its documents, images, audio and video? You set that service up and run it
    yourself: the template never syncs, uploads or deletes anything there, and only tailors
    the checks and advice of its data-root tool. Point the service at the data root, never at
    this repository: a sync service corrupts a Git repository. While the files are kept in the
    repository, the answer applies once you move them out. Where this template ships GitHub
    workflows for your provider, they need the files kept in the repository; choosing another
    provider, or keeping the files outside, later deletes them, including your edits.
  choices:
    "None — the data root stays on this machine only (back it up yourself)": none
    "Google Drive — Drive for desktop, or rclone on Linux": google-drive
    "OneDrive or SharePoint — the OneDrive sync app": onedrive
    "Dropbox — the Dropbox app": dropbox
    "Another cloud service — synced by a tool you run, such as rclone": other-cloud
    "A NAS or server on your network — SMB or NFS, on the LAN or over WireGuard": nas
  default: "<% (_external_data.prev or {}).get('DATA_PROVIDER') if (_external_data.prev or {}).get('DATA_PROVIDER') in ['none', 'google-drive', 'onedrive', 'dropbox', 'other-cloud', 'nas'] else ('google-drive' if (_external_data.prev or {}).get('INCLUDE_DRIVE_SYNC') is sameas true else ('none' if (_external_data.prev or {}).get('INCLUDE_DRIVE_SYNC') is sameas false else ((_external_data.peer or {}).get('DATA_PROVIDER') if (_external_data.peer or {}).get('DATA_PROVIDER') in ['none', 'google-drive', 'onedrive', 'dropbox', 'other-cloud', 'nas'] else 'none'))) %>"
# END family-shared questions (D48)

# There are no computed values at 0.1.0 (DESIGN.md Section 2). A later one is `when: false`,
# derived only from answers and never from _external_data (D14), and like every variant token
# it may appear only in the spine set.

# ── Migrations ───────────────────────────────────────────────────────────────
#
# Run on `copier update` only, never on `copier copy`, when the update crosses the declared
# version. They exist for the one thing Copier's merge cannot do on its own: move files the
# AUTHOR wrote. Copier only tracks what it generated, so a renamed folder takes its
# governance pair to the new path and leaves every brief, script, edit decision list and
# register behind — with no conflict and no error.
#
# NONE BEFORE 0.4.2. The rule from the first release: folder names and workflow numbers are
# frozen and append-only (DESIGN.md D32), and any release that renames or moves a folder that
# can hold author work ships a version-keyed migration IN THE SAME COMMIT, or it silently
# strands that work.
#
# NONE FOR THE 0.2.0 WORK EITHER (D63): the website, blog and newsletter profiles are new
# seeds, the show registers' folder and the feed workflow are new paths, and nothing an author
# wrote is renamed or moved; no existing seed's required content changes (the reworded social
# plan line and the play-button hook reach new projects only, and thumbnail-brief patches a
# piece's copy of an older layout).
#
# Seeds are the second case. The seeds of DESIGN.md Section 3.1 are never re-rendered once
# they exist, so a release that changes what a seed must contain ships that change as a
# migration too. And a release that stops shipping a seed ships a migration that preserves it
# first: a seed dropped from template/ is deleted from the project by the next update, filled
# in or not (probe h2; Section 10). The fifty shared paths are not seeds of media's to
# migrate: media never mutates a shared file (D11) but by its stated exceptions. THERE ARE
# THREE (D11, D76, D81). D76's v0.4.2 migration below replaces the shipped .agents -> .claude
# link with the real folder, because the link breaks every sandboxed Codex command in the
# project. The unversioned agents-outside-link.py pair, the second and transient one, renames
# an .agents link that leaves the project aside before the render and back after it: the net
# change is zero, and the link's target is never touched. And since 0.6.0 D81's update script,
# migrations/family-update.py, run by the family 'update' entry that closes this list: its
# lanes refresh the twenty-seven listed
# family-shared files the owner never changed, write one only where the owner never had it,
# offer the listed settings entries, top-level values and MCP servers once each, and put the
# guide under how-to/ back, as migrations/family-refresh.json lists them (D81, D84). Every
# other change to what a shared file should hold reaches a project only as a hand edit that
# the release's notes and README.md name.
#
# House shape for a migration script: it lives in migrations/ at this repository's root
# (outside template/, so it never ships) and is read from the template clone through
# _copier_conf.src_path. It is idempotent; it never overwrites and never deletes; it acts only
# where exactly one destination or value is correct and reports everything else with file and
# line; it guards on the folders' CONTEXT.md markers, so a folder Copier has not retired (or a
# destination it has not delivered) is never touched; and it always exits 0, because a
# non-zero exit aborts every migration declared after it and leaves the project half-upgraded.
# Key it to the release the folder MOVED in, never the release somebody noticed: every
# migration is keyed to a release, with TWO STATED EXCEPTIONS, each of which must run on every
# update and so carries no `version:`: the agents-outside-link.py pair at the top of the list
# (D76), and D81's family 'update' entry at the bottom, which closes the list; D81 is the
# maintainer's approval and the DESIGN.md decision that .claude/CLAUDE.md Section 7.7 asks for.
# Migrations run in declaration order, from the destination folder. A script is bash or
# python3, standard library only, and ends by printing the command that runs it again, because
# the update's clone of the template is deleted when the update ends (the outside-link pair
# needs no clone and prints its hand fix instead; the update script prints its own report).
# Python 3.14 is media's base since 0.6.0 (D81): the vendored scripts need it and, below it,
# do nothing but print a framed message and exit 0. Media's own scripts keep to D85: the
# v0.4.2 script keeps its python3 entry, and one media adds from 0.6.0 on (its v0.6.0
# crossing report, migrations/v0.6.0-how-to.py, first) runs through _copier_python, as the
# family entries do, and parses and exits 0 on Python 3.10, the oldest Copier 9.12.0
# supports (D84).
#
# A `version:` entry runs only when the update crosses that version (new >= version > old),
# which Copier reads from the template's git tags (PEP 440): an update to an untagged HEAD
# that is still numbered 0.4.1 does not run it. An entry with no `version:` runs on every
# update (Copier 9.17.1, _template.py:429-456). No migration ever runs on `copier copy`.
_migrations:
  # D76, D11's second exception: Copier checks that no destination resolves outside the
  # project BEFORE it reads _exclude (9.17.1, _main.py:810-812), so an .agents link that
  # leaves the project fails every update. Unversioned on purpose, the one pair not keyed to a
  # release: it must run on every update. hold renames that link to .agents.syntek-held
  # before the render (after Copier's dirty check) and prints the hand fix first; restore,
  # declared before every other after-stage entry, renames it back. Nothing else is touched,
  # never the link's target; each stage always exits 0 (--self-test, which no update runs,
  # exits 1 when a probe fails). Migrations never run on a copy: the copy recipe is in the
  # bridge, .claude/syntek-media-agents.md, and README.md.
  #
  # Since 0.4.5 the pair is syntek-author's family-shared 'migrations' block (D85; syntek-author
  # D48): the lines strictly between the two marker lines below are that block's bytes, since
  # 0.6.0 at syntek-author's v0.8.0 tag (D81), as migrations/agents-outside-link.py is its
  # script. The block's bytes are unchanged since v0.5.0; the script now needs Python 3.14 and,
  # below it, moves nothing and prints a framed message naming the Python found. Never edit
  # either here; both come again only from a later syntek-author tag (shipped-seeds.sh checks
  # 21 and 22 pin them). The marker lines are syntek-author's too, byte for byte, so that its
  # family-shared.sh finds the block: their D48 is syntek-author's decision, never media's D48.
  # The entries run the script with _copier_python, the interpreter running Copier.
# BEGIN family-shared migrations (D48)
  # Unversioned on purpose, so they run on every update and never on a copy. Where .agents
  # is a link that resolves outside the project, which Copier refuses to render beneath even
  # where _exclude names it, hold renames the link to .agents.syntek-held before the render
  # and restore renames it back after; the link's target is never touched. Both always exit
  # 0. Keep this pair first: restore must run before every other after-stage migration.
  - command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/agents-outside-link.py" hold'
    when: "<% _stage == 'before' %>"
  - command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/agents-outside-link.py" restore'
    when: "<% _stage == 'after' %>"
# END family-shared migrations (D48)
  # v0.4.2 (D76) retires the shipped `.agents -> .claude` link for a real .agents/ folder. An
  # update never touches /.agents (its update gate above), so without this the link survives
  # and every sandboxed Codex command keeps failing. Only where .agents is a symbolic link
  # whose target is exactly `.claude` or `.claude/` does it act: it removes the link (never a
  # file or folder), creates .agents/, links .agents/skills -> ../.claude/skills, and moves
  # .claude/mcp_config.json to .agents/mcp_config.json only where the new path is free. A real
  # folder, a link elsewhere, a text file left by core.symlinks=false or no .agents at all is
  # left untouched and reported. It never deletes author content, is idempotent and always
  # exits 0. This is D11's first stated exception (D76), the only one keyed to a release.
  - version: v0.4.2
    command: python3 "<% _copier_conf.src_path %>/migrations/v0.4.2-agents-folder.py"
    when: "<% _stage == 'after' %>"
  # v0.6.0 (D84) adds the user guide, how-to/, read-only, and moves nothing. Media's own
  # report-only crossing check, on the model of syntek-author's v0.6.0-how-to.sh: it reports
  # once, on the update that crosses 0.6.0, where the guide starts, the update procedure and
  # that the guide is read-only; syntek-author's guide beside it, or that syntek-author must
  # be v0.6.0 or later; how-to as a link, a case twin or ignored by Git; the owner's files at
  # the guide's paths, which the 'update' block below then puts back; every file under how-to/
  # no template ships; and the permissions script's --check and --write where opencode.json
  # exists. It writes nothing and always exits 0, because a non-zero exit would abort the
  # 'update' block that follows. It runs through _copier_python, as the family entries do
  # (amending D85), and parses and exits 0 on Python 3.10. shipped-seeds.sh check 32 holds it
  # here: after v0.4.2's entry and before the 'update' block's BEGIN marker.
  - version: v0.6.0
    command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/v0.6.0-how-to.py"'
    when: "<% _stage == 'after' %>"
  # D81 (0.6.0): syntek-author's family-shared 'update' block, byte for byte from its v0.8.0
  # tag; the marker lines are syntek-author's too, so their D48 is syntek-author's decision,
  # never media's D48. Its one entry runs migrations/family-update.py, vendored from the same
  # tag and never edited here, through _copier_python. It is the second stated exception to
  # the version-keyed rule (above, and .claude/CLAUDE.md Section 7.7), and it stays LAST, so it
  # sees what every earlier entry left. On Python 3.14 it ends every update with media's own
  # report, refs/syntek-media/ inside .git, and the refresh, offers and restore that
  # migrations/family-refresh.json lists; without that file it reports and changes nothing.
  # Nothing follows its END marker inside _migrations (shipped-seeds.sh check 20).
# BEGIN family-shared update (D48)
  # Unversioned and last, so it runs after every other migration on every update. It reports
  # each file this update did not deliver, refreshes the shared files the owner had not
  # changed, and records the render in refs/<template>/ inside .git. Always exits 0.
  - command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/family-update.py" update --src "<% _copier_conf.src_path %>" --to <% _copier_conf.vcs_ref_hash %> --answers "<% _copier_conf.answers_file %>"'
    when: "<% _stage == 'after' %>"
# END family-shared update (D48)

# ── Before an update ─────────────────────────────────────────────────────────
#
# DESIGN.md D16, Section 3.5. Printed on every `copier update`, BEFORE the questions are asked
# — which is also why it cannot be tailored to the project: Copier renders it before any
# answer, the previous ones included, is loaded (checked in the 9.18.2 source, 03/10/2026),
# and an _external_data read here aborts the update (probe c3). So it is static text naming
# what removing each platform and each media kind deletes, workflows by full folder name
# (D32), and the author reads the lines for theirs. update-test.sh check 12 proves it is
# printed, naming every platform and media kind, and check 22 that it ends with the crash
# pointer (DESIGN.md Section 10); a quiet run (--quiet) suppresses it. The
# text is DESIGN.md Section 3.5's, verbatim; since 0.2.0 it names the three own-channel
# platforms (D53) and what taking podcast away also deletes — the feed's folder pair,
# workflow and guide, never the show registers and saved feeds the author's project wrote
# there (D59), which update-test.sh check 13 proves. Since 0.5.0 one sentence names the
# fifteen family-shared questions an update asks for the first time and says their defaults
# keep the project as it is, or take syntek-author's recorded answers (D80, D81), without
# reading any answer itself: no client's file is written (the questions' own help says the
# rest). Since 0.6.0 the 0.4.4 paragraph no longer gives the two remix asks by hand: D81's
# update script adds both once, on Python 3.14, never one the owner removed after committing
# it, and until then check --setup reports each missing one; the Consent and credits-log
# edits stay by hand. And a 0.6.0 paragraph, before the BRAND_KIND one (D81, D84): Python
# 3.14 and the framed message; syntek-author first; the read-only guide; untracked files
# under how-to/; how-to as a file or a link (FileExistsError, NotADirectoryError,
# ForbiddenPathError). The crash pointer stays the last paragraph, word for word. It reads
# no answer.
_message_before_update: |

  Before you answer: removing a platform or a media kind deletes EVERY file it generated,
  including the seeds you have filled in (git history keeps the last committed copy). Copy out
  and commit anything you need first. Your own files are never deleted.

    PLATFORMS without <platform>     brand/src/platforms/<platform>.md (your profile) and
                                     publishing/docs/reference/<platform>.md — for each of
                                     youtube, tiktok, instagram, linkedin, facebook, podcast,
                                     website, blog, newsletter
    PLATFORMS without podcast        also publishing/src/podcast/ (its pair; your show
                                     registers and saved feeds stay),
                                     publishing/workflows/08-publish-the-podcast-feed/ and
                                     publishing/docs/reference/podcast-feed.md
    MEDIA_KINDS without audiobook    the narrate-audiobook skill; production/src/audiobook/ (its
                                     pair and the generated/ and renders/ READMEs; your chapter
                                     registers stay); production/workflows/05-narrate-an-audiobook/,
                                     production/workflows/06-master-an-audiobook/ and
                                     production/docs/reference/audiobook-narration.md
    MEDIA_KINDS without podcast      scripts/docs/reference/podcast-episodes.md and
                                     production/workflows/04-master-a-podcast-episode/
    MEDIA_KINDS without trailer      scripts/docs/reference/trailers.md
    MEDIA_KINDS without short-video  scripts/docs/reference/short-video.md
    MEDIA_KINDS without long-video   scripts/docs/reference/long-video.md
    MEDIA_KINDS without voiceover    scripts/docs/reference/standalone-voiceovers.md (the
                                     voiceover skill and its workflow stay)

  A list answer replaces the whole list: --data 'PLATFORMS=[youtube, podcast]' removes every
  platform not named.

  Crossing 0.4.2, one migration runs after the update (D76): where .agents is a symbolic link
  to .claude, it replaces the link with a real .agents/ folder, links .agents/skills to
  ../.claude/skills and moves .claude/mcp_config.json to .agents/mcp_config.json if that path
  is free. A real .agents folder, a link anywhere else or no .agents at all is left as it is
  and reported. It deletes nothing you wrote; review its report and commit the change.

  Where .agents is a symbolic link to a folder outside this project, every update renames it
  to .agents.syntek-held before the render and back afterwards; its target is never
  touched. If the update stops before it ends, put the link back in the order the update
  printed, or as README.md 'Updating a project' (Migrations), at the template's source,
  says. Never move the held link back while .agents still stands.

  Updating to 0.4.4: two "ask" entries in .claude/settings.json keep voice remix run, which
  spends ElevenLabs credits, from running without a prompt. From 0.6.0 the update adds both
  once, where Copier runs on Python 3.14 (never one you removed after committing it). Until
  then, python3 toolkit/media.py check --setup reports each missing one as a FAIL with the
  line to add. Seeds are never updated, so edit by hand the Consent rule of
  brand/src/voice/voice.md (a voice remixed from a clone cites the source clone's consent
  ID) and the rules of production/src/credits-log.md (Tool voice remix, the row voice remix
  run writes itself).

  Updating to 0.5.0: fifteen questions shared with syntek-author are asked once (the coding
  agents you use besides Claude Code, their models, and where binary files are kept); their
  defaults keep the project as it is, or take what syntek-author's answers file records, and
  no client file is written.

  Updating to 0.6.0: run Copier on Python 3.14 or later, as README.md 'Updating a project',
  at the template's source, shows. On an older one a message framed in lines of = says that
  family-update did NOT run, and nothing is reported, refreshed, added or put back; where
  .agents links outside the project the update then stops with ForbiddenPathError. Over
  syntek-author, update syntek-author to v0.6.0 or later first. This release adds the user
  guide, how-to/, read-only: every full update puts its files back as the template wrote
  them (Git keeps your version) and never touches a file there that no template ships.
  Commit or move any untracked file under how-to/ first, and if how-to is a file or a link
  rather than a folder, rename it: the update stops on a file (FileExistsError or
  NotADirectoryError) or a link outside the project (ForbiddenPathError), and writes through
  a link inside it. If it stops, never commit what it left: README.md 'Updating a project'
  gives the recovery.

  BRAND_KIND never changes: the update refuses it, because a different brand kind is a new
  project. After a platform or media-kind change, edit by hand the files that describe your
  options: README.md, CONTEXT.md and .claude/CLAUDE.md Section 1 in a standalone project (over
  syntek-author they are syntek-author's), and any rows for a removed platform in
  brand/src/platforms/overrides.toml. The brand section of the media rules updates itself.

  If this update stops with OSError: [Errno 39] Directory not empty, never commit what it
  left: README.md 'Updating a project', at the template's source, gives the recovery and the
  command to use.

# ── After a copy ─────────────────────────────────────────────────────────────
#
# DESIGN.md D13 and Section 8: what coexistence leaves to the author, in D13's order — (1) the
# shared paths a copy writes (D84's fourteen among them since 0.6.0) and the skip rule (Copier
# prints an existing one as `conflict` then `skip`, or `identical`), the client files only for
# the clients ticked in AGENT_CLIENTS, with Section 8's hand edits 2 and 3: the optional index
# lines, and nothing to add to .gitignore or .mcp.json. Since 0.6.0 the family questions block
# takes syntek-author's recorded clients over syntek-author (D81), so no static advice on
# matching them stands here; (2) since 0.6.0 (D81) the six allows, which no lane offers, to
# add by hand to an existing settings.json; the entries migrations/family-refresh.json lists
# (the two compaction values, media's eleven asks and syntek-author D54's eight, the five denies,
# the guide's Edit(/how-to/**) among them, and the handoff-hook and guide-guard entries of the
# seed's hooks object) by hand only where the copy's baseline task printed, framed in lines of
# =, that family-update did NOT run (a Python older than 3.14) or the copy took --skip-tasks,
# since on 3.14 that task offers them to the file the copy kept; and the data-root guard, which
# no lane offers, for a settings file that lacks it (syntek-author's update never adds it either);
# then the permissions script's --write, which carries the asks and denies to the other
# clients' files (D80; syntek-author D49); (3) the ElevenLabs line, with the rule that its base
# path must contain the project; (4) the LFS tripwire's write to this repository's
# .git/config; (5) the setup check (D49); (6) the update command with `-a`, run as
# `uvx --python '>=3.14' copier` (D3, D81), with Git's housekeeping off (DESIGN.md Section 10);
# (7) since 0.6.0 (D84), where the user guide starts, by its full path,
# how-to/src/TEMPLATE-GUIDE/syntek-media/01-overview.md (a chapter that ships ungated, never a
# shared chapter, which names no template), and that the guide is read-only.
# Unlike the message before an update it renders answers (probe c1), but never _external_data
# (D14). Messages go to stderr, and --quiet suppresses them.
#
# coexist-test.sh check 19 and generate-all.sh check 4 hold this output to the lists in
# .github/scripts/_common.sh, the same lists shipped-seeds.sh check 12 holds the standalone
# .claude/settings.json to, so the message and the seed cannot drift apart: change an entry
# here, there and in the seed in the same commit.
_message_after_copy: |

  syntek-media is in place for <% BRAND_NAME %> (<% BRAND_KIND %>).
    Platforms:    <% PLATFORMS | join(', ') %>
    Media kinds:  <% MEDIA_KINDS | join(', ') %>

  1. Shared files. README.md, CONTEXT.md, .gitignore, .mcp.json, .claude/CLAUDE.md,
     .claude/CONTEXT.md, .claude/MEMORY.md, .claude/settings.json, .claude/skills/CONTEXT.md,
     .claude/skills/CLAUDE.md, the working-practice skills .claude/skills/grill-me/SKILL.md,
     .claude/skills/grill-with-docs/SKILL.md, .claude/skills/grilling/SKILL.md,
     .claude/skills/handoff/SKILL.md, .claude/skills/to-questionnaire/SKILL.md,
