# copier.yml — the contract a project's audio and video production layers are generated from.
#
#   uvx --python '>=3.14' copier copy --trust gh:Syntek-Dev/syntek-media .
#
# Usually applied INTO a project generated by syntek-author, never with --overwrite (DESIGN.md
# D4, Section 8); it also renders on its own into an empty folder.
#
# User guide: README.md. Design contract: DESIGN.md — where this file and DESIGN.md disagree,
# DESIGN.md wins and this file is the one that is wrong.

# 9.12.0 since 0.4.5 (22/10/2026; DESIGN.md D2, D85); 9.6.0 before it (03/10/2026), never
# 9.0.0. The copy-only shared files, the seed-once example gates in _exclude and the copy-only
# _tasks below all read `_copier_operation`, which did not exist until Copier 9.6.0. On anything
# older the expression is undefined, and it fails in BOTH directions at once: the copy-only
# tasks hold SHUT, so a fresh generation never runs `git init` or sets the LFS tripwire, and the
# update gates hold OPEN, so every shared file and every example an author deleted comes back on
# the next update — the shared ones inside syntek-author's project. A floor that admits a
# Copier which cannot read the file's own safety mechanism is not a floor. Nor is 9.6.0 itself
# one: it fails every update (ValueError: Invalid choice, as it replays a multiselect answer),
# and 9.10.3 and 9.11.0 refuse an .agents link outside the project with ForbiddenPathError
# before D76's hold can move it aside. 9.12.0 is the lowest release measured to pass every
# update-test.sh check (22/10/2026: a real run on 9.12.0 and 9.19.1, the self-test on every
# release from 9.12.0 to 9.19.1). `multiselect`, which PLATFORMS and MEDIA_KINDS need,
# predates it (proven on 9.18.2). Since 0.5.0 the family-shared questions block (D80;
# syntek-author D48, D50) renders Copier's `UNSET` in DATA_SLUG's default, which first exists
# in 9.11.0 (absent from 9.6.0 through 9.10.3): the 9.12.0 floor already admits it, so the
# floor does not move. Since 0.6.0 (D81): syntek-author D2's floor is 9.12.0 too, since its
# v0.6.0, so media no longer overrides it; the floor admits _copier_conf.vcs_ref_hash,
# _copier_conf.answers_file and _copier_python, which the family 'update' block, the baseline
# task and media's v0.6.0 crossing entry read; and the 9.12.0 measurement is run again with
# the 0.6.0 entries before the release.
_min_copier_version: "9.12.0"

# Everything that ships lives at its real path under template/ (DESIGN.md D1). The repository
# root holds the template's OWN state — DESIGN.md, this file, VERSION, CHANGELOG.md, the audits
# in .github/scripts/, the example answers in examples/ and its community files (LICENSE,
# CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, and .github/'s issue forms, pull-request
# template and CODEOWNERS; D83) — and none of it is rendered. No community file needs an
# _exclude line, and none is placed under template/: a generated project's licence is its
# owner's choice.
#
# This is why there is no anchored list of root state files below, no .copier/ staging folder
# and no `mv` seed task: syntek-media is not itself a production project, so nothing at this
# root needs keeping out of a generated one. It also keeps this repository's own CI inert in
# every project: media ships no .github/ at all (D11).
_subdirectory: template

# A named answers file, not the default .copier-answers.yml (DESIGN.md D3, Section 9 rule 1).
# syntek-media is applied on top of a syntek-author project (D4), which already keeps its own
# record in .copier-answers.syntek-author.yml, and two templates writing one answers file would
# overwrite each other's record on every update.
#
# THE COST, AND IT IS REAL: `copier update` looks for .copier-answers.yml unless it is told
# otherwise (verified in the Copier 9.18.2 source, 03/10/2026), so every update must be run
# as `uvx --python '>=3.14' copier update --trust -a .copier-answers.syntek-media.yml`, with
# Git's housekeeping off as README.md 'Updating a project' gives it. Without `-a` it stops with
# no answers to read; it never updates the wrong thing. README.md, the rendered answers file
# and the message printed after a copy all say so.
#
# `copier copy` takes an absolute template path or gh:Syntek-Dev/syntek-media: Copier records
# the path as typed, and a relative one makes every later update fail (probe i1).
_answers_file: .copier-answers.syntek-media.yml

# The previous answers, read back so that BRAND_KIND's validator can refuse a change of brand
# kind on update (DESIGN.md D14; syntek-author D35). The path is the destination's: on
# `copier update` it is the project's own record. On a fresh `copier copy` — over a
# syntek-author project or into an empty folder — the file does not exist yet: Copier prints a
# MissingFileWarning and `_external_data.prev` is empty, which the validator's
# `default(BRAND_KIND, true)` reads as "no previous answer". Copier prints the warning on every
# update too, because its temporary renders of the old and new template read the path as well.
# That warning is the accepted cost. Never test `_copier_operation` in a validator instead: it
# is undefined there. Since 0.5.0 the family-shared questions block reads the same record for
# its defaults (DESIGN.md D80): a recorded answer is kept, and a record without one (a project
# from before 0.5.0) keeps the project as it is.
#
# `peer` is syntek-author's record (D14 as D80 widens it; syntek-author D50). It is read for
# its data-root answers (DATA_*) and, since 0.6.0, inside the family block, for its client and
# model answers (AGENT_CLIENTS, CODEX_MODEL, GEMINI_MODEL and the OPENCODE_* keys; D81,
# syntek-author D47), and for whether it exists at all: a first data-root answer here defaults
# to syntek-author's and must equal it, a syntek-author record without DATA_STORE (from before
# its data root) makes media's first store `repo`, and the client and model defaults take
# syntek-author's recorded values where media's own record holds none. Nothing reads
# syntek-author's `_commit`. It sits here, outside the block, because each template names the
# OTHER one's file. Where syntek-author has never been applied, Copier prints a second
# MissingFileWarning, for this file, and `_external_data.peer` is empty: the same accepted
# cost, doubled.
#
# THE READS OF EXTERNAL DATA ARE THESE THREE, AND NO OTHER (D14, widened by D80; its text
# corrected, not amended, by D81): BRAND_KIND's validator (prev); the defaults and validators
# inside the family-shared questions block (prev and peer); and _message_after_update, which
# reads peer alone to report a data-root disagreement. Never in a file body, a computed value,
# an _exclude gate, _message_after_copy or _message_before_update: an update's temporary
# renders find no answers file, so data rendered into a body differs between the old and the
# new render and leaves conflict markers on the first update (probe c2c), and a read in
# _message_before_update aborts the update (probe c3). A skill that needs to know whether
# syntek-author is present checks for its file at run time, as the copy-time warning task
# does (D84): it reads files, never _external_data.
_external_data:
  prev: .copier-answers.syntek-media.yml
  peer: .copier-answers.syntek-author.yml

# Every file is a template — tokens are not confined to a suffixed subset. template/ ships no
# binary at all (DESIGN.md Section 10): no audio, video, image or font.
_templates_suffix: ""

# D76 (amends D73): .agents/ is a real folder whose one link, .agents/skills, targets
# ../.claude/skills, so Codex and Antigravity read the one skill tree without a second copy.
# Preserve that link rather than rendering the skills twice. .agents itself is never a link
# again: Codex mounts .agents read-only, and its bubblewrap sandbox refuses a read-only path
# that is a link to a writable folder, so every sandboxed command failed in a project with
# .agents -> .claude (syntek-author's reply of 14/10/2026, Codex 0.160.1).
_preserve_symlinks: true

# Tokens are written <%TOKEN%> rather than {{TOKEN}} so they cannot collide with anything a
# media project holds or sits beside: CSS and HTML braces in the brand's layouts, ffmpeg
# filtergraphs, a Jinja-like {{ }} in other tooling, or GitHub Actions expressions (${{ }})
# in a syntek-author business project's Drive workflows. The set is syntek-author's, unchanged
# (DESIGN.md D2). Every text artefact media ships — HTML and CSS templates, ffmpeg filter
# strings, SRT, TOML, @dsCard comments — is scanned for <%, <: and <~ (check-template-tokens.sh
# on the source, shipped-brands.sh check 9 on every render): none may ship where no token is
# meant.
_envops:
  variable_start_string: "<%"
  variable_end_string: "%>"
  block_start_string: "<:"
  block_end_string: ":>"
  comment_start_string: "<~"
  comment_end_string: "~>"
  keep_trailing_newline: true

# Patterns are gitignore-style and are matched against DESTINATION paths, relative to
# template/ (verified in a probe template, 03/10/2026). ANCHORED (leading slash) means
# template content; UNANCHORED means "never part of a checkout" and matches at any depth.
#
# With _subdirectory set, Copier's default _exclude is [] rather than its usual list, and
# defining _exclude replaces the default in any case — so the defaults are re-listed here.
# Without them, a __pycache__ left by running toolkit/*.py inside template/ would ship.
_exclude:
  - .git
  - .svn
  - __pycache__
  - "*.py[co]"
  - .DS_Store
  - "~*"
  # Generated media. A render, a take or a test clip left in template/ by running the toolkit
  # there must never ship: it would carry this repository's output into every project as
  # binary nobody can review in a diff, and big binaries never sit in plain Git (D19). Audio
  # and video by extension, at any depth; `.pcm` is a raw ElevenLabs take (D21).
  - "*.mp4"
  - "*.mov"
  - "*.mkv"
  - "*.webm"
  - "*.wav"
  - "*.mp3"
  - "*.m4a"
  - "*.aac"
  - "*.flac"
  - "*.ogg"
  - "*.pcm"
  # The output folders: each generated/, renders/ and raw/ ships its README.md and nothing
  # else (DESIGN.md D19, D42). Copier matches every file and every folder it walks against
  # these patterns one path at a time and never prunes, so a pattern on a folder's children
  # (`renders/*.png`) misses a per-piece sub-folder, and a list of extensions misses the next
  # output (an SRT or VTT sidecar, an extract, a chunk's text). `/**` takes everything below
  # the folder at any depth, sub-folders included, and the quoted negation after it brings
  # back that folder's own README.md and no other: a README.md in a sub-folder stays out
  # (Copier 9.18.2, pathspec 1.1.1, 05/10/2026). So a per-piece output folder (D64) and
  # anything in it never ships. ANCHORED, never an unanchored `renders/**`, which would reach
  # past the six folders named here.
  - /production/src/renders/**
  - "!/production/src/renders/README.md"
  - /production/src/footage/raw/**
  - "!/production/src/footage/raw/README.md"
  - /production/src/voiceover/generated/**
  - "!/production/src/voiceover/generated/README.md"
  - /publishing/src/renders/**
  - "!/publishing/src/renders/README.md"
  # The audiobook folder's outputs sit under a gated directory (the folder's line, in the gated
  # block below), and take the same pair as every other output folder. Nothing under a gated
  # directory is negated back in except an output folder's own README.md, and only from here,
  # above every gated line (DESIGN.md Section 3.5, Section 10, D19): Copier obeys the LAST
  # pattern that matches a path, so the shut gate, matched after these negations, still
  # excludes the folder and both READMEs, while an open gate renders to nothing and leaves them.
  # Listed after the gate, a negation would bring the READMEs back to a brand that makes no
  # audiobooks (the early fixes' scratch renders, 05/10/2026). shipped-seeds.sh check 16 holds
  # every negation here to that order, and shipped-brands.sh check 12 proves the renders.
  - /production/src/audiobook/generated/**
  - "!/production/src/audiobook/generated/README.md"
  - /production/src/audiobook/renders/**
  - "!/production/src/audiobook/renders/README.md"
  #
  # ── Shared root files: copy only, never on update (DESIGN.md D11, Section 3.6) ──
  #
  # The fifty shared paths (D73, D76, D80, D84): the nineteen below, then D80's seventeen
  # after the D76 note, then D84's fourteen. syntek-author ships every one of them but the
  # retired .claude/mcp_config.json. Each has TWO lines in this file and needs both:
  # this update gate, so Copier's update never renders it and never recreates a copy the
  # author deleted; and its anchored line in _skip_if_exists below, so a copy over a project
  # that already has it skips it (exit 0) instead of stopping with 'Interactive session
  # required'. With both lines Copier writes the file on a copy into an empty place, skips it
  # on a copy over an existing file and never renders it on update (probes b1–b4, h1 and
  # gate.sh, 03/10/2026). D11 still overrides syntek-author D17, but since 0.6.0 its copy-only
  # rule binds Copier alone, and coexistence rule 3 no longer calls media stricter (D81). D81's
  # update script, last in _migrations, is the stated exception for the paths its refresh data
  # lists:
  # it refreshes the twenty-seven listed family-shared files where the project's copy still
  # equals a revision of its render history, and writes one only where the owner never had it
  # (a deleted one stays deleted); it offers the listed settings entries and top-level values
  # to .claude/settings.json and the two MCP servers to the MCP files once each; and it puts
  # the guide under how-to/ back (D84). No other shared path is refreshed, offered to or
  # restored. Existing shared paths remain the author's; media fills only missing paths.
  # Nothing media needs lives only in them (D5, D73).
  #
  # NEVER DELETE ONE OF THESE LINES. Without it the file becomes seed-if-missing, and a shared
  # file the author deleted is recreated from media's copy on the next update — inside
  # syntek-author's project (DESIGN.md Section 10). Nor is the file ever removed from template/
  # or renamed in a later release: a renamed shared file is a second shared path neither
  # template seeds.
  - "<: if _copier_operation == 'update' :>/README.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.gitignore<: endif :>"
  - "<: if _copier_operation == 'update' :>/.mcp.json<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/MEMORY.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/settings.json<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/AGENTS.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/GEMINI.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.agents<: endif :>"
  - "<: if _copier_operation == 'update' :>/.codex/config.toml<: endif :>"
  - "<: if _copier_operation == 'update' :>/.codex/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.codex/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/mcp_config.json<: endif :>"
  - "<: if _copier_operation == 'update' :>/.agents/skills<: endif :>"
  - "<: if _copier_operation == 'update' :>/.agents/mcp_config.json<: endif :>"
  #
  # D76: two of the nineteen no longer ship as they did, and neither line above is deleted.
  # /.agents is now the real folder that holds .agents/skills and .agents/mcp_config.json. Its
  # two lines stay (D11) and still do work: an anchored pattern without a trailing slash
  # matches the folder and every path below it (pathspec, as Copier 9.17.1 calls it), so the
  # update gate keeps the whole folder out of every update, the old release's link and the new
  # release's folder alike, and its _skip_if_exists line already covers both children. The
  # child paths carry their own pair of lines anyway, so each shared path is protected by name
  # and the audits can count them (Section 3.6). Neither line stops a copy creating a MISSING
  # child inside an author's existing .agents/ folder: the skip acts only on a path that
  # exists, which is D11's "media fills only missing paths". And neither saves a copy from a
  # path that resolves to a real directory where the template has a link: Copier asserts
  # before its skip check (probe, 14/10/2026), so a copy over `.agents -> .claude` or over a
  # real .agents/skills folder needs `--exclude /.agents` or `--exclude /.agents/skills`
  # (README.md; Section 3.7).
  # /.claude/mcp_config.json stays in template/ and keeps both its lines (D11, Section 10), but
  # this unconditional line stops a copy shipping it: Antigravity reads .agents/mcp_config.json,
  # and two empty files would leave the author guessing which one the client reads. An existing
  # project's copy is the author's; the v0.4.2 migration below moves it only where the new path
  # is free. This is the one shared-path line that is not an update gate.
  - /.claude/mcp_config.json
  #
  # D80: seventeen more shared paths, syntek-author's family-shared files (syntek-author D48,
  # D51), vendored byte for byte from its v0.8.0 tag and listed in family-shared.json: the
  # Gemini CLI settings and their pair, OpenCode's settings, the SKILL.md of the seven
  # working-practice skills, the two session hooks with the .claude/hooks/ pair, and the
  # handoffs/ pair. Each takes the same two lines as the nineteen, FILE by file, never the
  # folder: five of the skill folders also hold media's own MEDIA-<KIND>.md mode files, which
  # are template-owned and update (the generated block below). syntek-author writes the same
  # paths copy-only, so neither template's update renders, merges or deletes the copy the
  # other one wrote, and a combined project holds one copy whichever template came first.
  # A copy-only file reaches an existing project only through an update script: D81's update
  # script delivers the listed ones (the seven SKILL.md, both hooks, the two pairs), never a
  # client file. A line here is never removed once released (D11).
  - "<: if _copier_operation == 'update' :>/.gemini/settings.json<: endif :>"
  - "<: if _copier_operation == 'update' :>/.gemini/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.gemini/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/opencode.json<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/grill-me/SKILL.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/grill-with-docs/SKILL.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/grilling/SKILL.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/handoff/SKILL.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/to-questionnaire/SKILL.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/wait-what/SKILL.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/skills/wayfinder/SKILL.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/hooks/pre-compact-handoff.sh<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/hooks/context-threshold-handoff.sh<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/hooks/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/.claude/hooks/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/handoffs/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/handoffs/CLAUDE.md<: endif :>"
  #
  # D84: fourteen more shared paths, syntek-author's family-shared files for the user guide
  # (syntek-author D56), vendored byte for byte from its v0.8.0 tag with every other family
  # file and listed in family-shared.json: the guide guard, .claude/hooks/how-to-read-only.sh,
  # then the five container pairs of how-to/ and its three shared chapters, in syntek-author's
  # order. Each takes the same two lines as the rest, FILE by file: never a line naming /how-to
  # or a folder under it, because every how-to folder also holds media's own files under its
  # three syntek-media/ folders, which are template-owned and update. Copier never renders one
  # on update; D81's update script writes one only where the project never had it, refreshes
  # one the owner has not changed, and, since how-to/ is read-only (family-refresh.json
  # "restore"), puts the new render's bytes back on any file under how-to/ that differs, never
  # over another template's version of a shared one (D84). These lines are permanent (D11).
  - "<: if _copier_operation == 'update' :>/.claude/hooks/how-to-read-only.sh<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/docs/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/docs/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/src/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/src/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/src/TEMPLATE-GUIDE/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/src/TEMPLATE-GUIDE/CLAUDE.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/src/TEMPLATE-GUIDE/agent-clients-and-mcp.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/src/TEMPLATE-GUIDE/the-data-root.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/src/TEMPLATE-GUIDE/updating-and-recovery.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/workflows/CONTEXT.md<: endif :>"
  - "<: if _copier_operation == 'update' :>/how-to/workflows/CLAUDE.md<: endif :>"
  #
  # The two client folders as well, syntek-author's own lines (its copier.yml, D47), so an
  # update never creates an empty .codex/ or .gemini/ in a project that never had one or whose
  # author removed it (/.agents has its line among the nineteen). They are folder guards, not
  # shared paths: no _skip_if_exists line, because every file under them has its own.
  - "<: if _copier_operation == 'update' :>/.codex<: endif :>"
  - "<: if _copier_operation == 'update' :>/.gemini<: endif :>"
  #
  # ── Gated paths ──────────────────────────────────────────────────────────────
  #
  # A templated _exclude entry is the SINGLE conditionalisation mechanism for paths, as in
  # syntek-author and syntek-base. When a gate is shut the path is never rendered at all; when
  # it is open the entry renders to an empty string, which Copier ignores. One line per path,
  # never a multi-pattern block.
  #
  # EVERY LINE READS  "<: if not (GATE) :>/path<: endif :>"  where GATE is the "ships when"
  # expression of DESIGN.md Section 3.5, copied verbatim (D15): `'youtube' in PLATFORMS`,
  # `'audiobook' in MEDIA_KINDS`, the item single-quoted and no parentheses inside the gate, so
  # the audits can negate it mechanically. The index files (a CONTEXT.md or CLAUDE.md whose
  # folder is an ancestor of a gated path, and rules 01 and 02) wrap the same path's row in
  # "<: if GATE :>…<: endif :>" with the SAME string — so an audit can pair every exclusion
  # with every index row, and a gate that drifts in one place shows up as a mismatch rather
  # than as a dangling citation in one render. The one exception is the generated mode-file
  # block at the end, whose lines test BRAND_KIND as gen-mode-excludes.sh writes them.
  #
  # No gate here carries a BRAND_KIND test (D15, overrides syntek-author Section 2, where every
  # gate carries its DOC_TYPE test because its option questions are hidden per variant).
  # PLATFORMS and MEDIA_KINDS are always asked and refuse an empty list, so no hidden default
  # can open a membership gate. A list question added later and hidden by `when:` carries its
  # BRAND_KIND test in every gate, as syntek-author's do.
  #
  # Bare paths name whole directories. That is safe only because nothing under a gated
  # directory is negated back in (DESIGN.md Section 3.5, Section 10), except the README.md of
  # a README-only output folder (D42), whose negation sits ABOVE this block: Copier obeys the
  # LAST pattern that matches a path, so a negation listed after a gate brings its path back
  # with the gate shut, whether the gate reads `/dir` or `/dir/**` (pathspec 1.1.1,
  # 05/10/2026). Never write a `!` line below this point (shipped-seeds.sh check 16).
  #
  # Everything not listed ships always — the voiceover skill, its workflow, its folder and its
