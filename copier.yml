     And from the "hooks" object of template/.claude/settings.json at the template's source:
     the handoff-hook entries (UserPromptSubmit, PreCompact auto and manual, and SessionStart
     compact) and the guide guard's PreToolUse entry.
     Either way, add the data-root guard, the seed's other PreToolUse entry, by hand to a
     settings file that lacks it: it is the one hook entry no lane offers, in either template.
     Then, skipped or not, carry the asks and denies to the other coding agents' files here
     (it never creates one, and prints what a client cannot express):
       python3 .claude/syntek-media-permissions.py --write

  3. ElevenLabs. Add the server once, at user scope, with a base path that CONTAINS this
     project: speech-to-text refuses any file outside it. Use $HOME when every project lives
     under it, otherwise the nearest folder that holds them all. Remove an existing server
     first, then add it again:
       claude mcp remove elevenlabs --scope user
       claude mcp add --env ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY" --env ELEVENLABS_MCP_BASE_PATH="$HOME" \
         --transport stdio --scope user elevenlabs -- uvx elevenlabs-mcp
     Export the key in your shell first; never type it on the command line or commit it.

  4. Git LFS. Where no LFS filter was configured at any scope, this copy set
     filter.lfs.required in this repository's own .git/config, so that adding a large design
     export under brand/src/exports/large/ fails loudly instead of committing the whole file
     as a plain blob. Run `git lfs install` once before you use that folder: it sets the same
     value, and the tripwire is then harmless.

  5. Before the first credit-spending call, check the set-up and clear what it reports:
       python3 toolkit/media.py check --setup

  6. Update this template on its own, from a clean, committed tree, always naming its
     answers file, with Git's automatic housekeeping off for the run (README.md 'Updating
     a project', at the template's source, says why and gives the recovery if it stops):
       GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=gc.auto GIT_CONFIG_VALUE_0=0 GIT_CONFIG_KEY_1=maintenance.auto GIT_CONFIG_VALUE_1=false \
         uvx --python '>=3.14' copier update --trust -a .copier-answers.syntek-media.yml
     Run Copier on Python 3.14 or later, as that command does: the update script that ends
     every update, and the migrations around it, do nothing on an older Python.

  7. The user guide starts at how-to/src/TEMPLATE-GUIDE/syntek-media/01-overview.md.
     Everything under how-to/ is read-only: record a departure from it where project rules
     go, never there, and update with the steps in
     how-to/workflows/syntek-media/04-update-the-template/.

# ── After an update (DESIGN.md D80; D14 as D80 widens it) ────────────────────
#
# Printed after every update. First, since 0.6.0 in place of 0.5.0's known-limitation line,
# syntek-author's static lines on its update report, with media's names (D81; syntek-author
# D52): no '▸ syntek-media update report' line means Copier ran no migration; a framed
# 'family-update did NOT run' means a Python older than 3.14, so nothing was reported,
# refreshed, added or put back, and the same update runs again on 3.14, as README.md
# 'Updating a project' gives it; how to print the report again; the records under
# refs/syntek-media/ and how to delete them before a history rewrite; and the data-root
# guard's PreToolUse entry, which no update of either template offers (syntek-author D17,
# D50). Those lines read no answer. Then the data-root lines, syntek-author's own
# (syntek-author D50, D53) with media's names: each difference from syntek-author's recorded
# answers, read through `_external_data.peer`: its store, its layout while both are external,
# and its provider. A later difference is allowed, and refused only by the data-root
# resolver's data commands, so this is where the author first hears of it. syntek-author's
# own message reports the same difference only after ITS updates, which is why media's says it
# too. Media files nothing under a data root in 0.5.0 (its map names no folder), so there are
# no store or area lines of its own (D80), and the commands are shown as
# `python3 .claude/syntek-media-dataroot.py …`, because media has no Makefile (D20).
#
# Copier renders this message after the update has written the new answers, in the real
# project, so the peer read is safe here (syntek-author's probe on 9.17.1 and 9.18.2; media's
# on 9.12.0 and 9.19.1, 23/10/2026). Never compare with `_external_data.prev` here: Copier
# re-reads it after writing the new answers, so it holds them, not the old ones (9.17.1
# `_main.py:1449`). Every test of DATA_STORE is an equality, one positive block per value
# (DESIGN.md Section 2). The dash that opens each block tag trims the line break before it, so
# a closed block prints no blank line. Messages go to stderr, and --quiet suppresses them.
_message_after_update: |

  If no '▸ syntek-media update report' line appears above, Copier ran no migration (it could
  not read a template version): run git status, and look for .rej files and conflict markers.
  If a message above, framed in lines of =, says family-update did NOT run, Copier ran on a
  Python older than 3.14 and nothing was reported, refreshed, added or put back: upgrade to
  Python 3.14, look for .rej files and conflict markers, commit, then run the same update
  again as README.md 'Updating a project', at the template's source, gives it.
  The report again, after any update that printed it:
    git log -1 --format=%B syntek-media/template
  Its records live in .git under refs/syntek-media/: git push leaves them behind, but
  git push --mirror publishes them, and syntek-media/yours keeps your HEAD at this update
  reachable. Before rewriting history to remove a secret, delete both with git update-ref -d.
  A settings file seeded before the data-root guard shipped gains the guard's PreToolUse
  entry only by hand, as README.md 'Updating a project', at the template's source, gives it:
  no update of either template offers it.
  <:- set pe = _external_data.peer or {} :>
  <:- set ps = pe.get('DATA_STORE') :>
  <:- set pp = pe.get('DATA_PROVIDER') :>
  <:- if DATA_STORE == 'external' and ps == 'repo' :>

  syntek-author's answers file (.copier-answers.syntek-author.yml) records DATA_STORE repo,
  and this one now external. One project keeps one store: until both agree, the data-root
  commands refuse to act (python3 .claude/syntek-media-dataroot.py store shows each record),
  though text work goes on. Update syntek-author with --data DATA_STORE=external, which takes
  this one's folder answers, or this one back with --data DATA_STORE=repo.
  <:- endif :>
  <:- if DATA_STORE == 'repo' and ps == 'external' :>

  syntek-author's answers file (.copier-answers.syntek-author.yml) records DATA_STORE
  external, and this one repo. One project keeps one store: until both agree, the data-root
  commands refuse to act (python3 .claude/syntek-media-dataroot.py store shows each record),
  though text work goes on. Update this template with --data DATA_STORE=external, which takes
  syntek-author's folder answers, or syntek-author with --data DATA_STORE=repo.
  <:- endif :>
  <:- if ps and ps not in ['external', 'repo'] :>

  syntek-author's answers file (.copier-answers.syntek-author.yml) records DATA_STORE
  '<% ps %>', which this version of syntek-media does not offer: the data-root commands
  refuse to act until both templates record one store.
  <:- endif :>
  <:- if DATA_STORE == 'external' and ps == 'external' and [DATA_AREA, DATA_SLUG, DATA_KIND_DOCS, DATA_KIND_PHOTOS, DATA_KIND_AUDIO, DATA_KIND_VIDEOS] != [pe.get('DATA_AREA'), pe.get('DATA_SLUG'), pe.get('DATA_KIND_DOCS'), pe.get('DATA_KIND_PHOTOS'), pe.get('DATA_KIND_AUDIO'), pe.get('DATA_KIND_VIDEOS')] :>

  syntek-author's answers file (.copier-answers.syntek-author.yml) files this project under a
  different layout: DATA_AREA, DATA_SLUG or a kind folder differs. One project keeps one
  layout: until both agree, the data-root commands refuse to act
  (python3 .claude/syntek-media-dataroot.py root names the difference). Update one template
  with --data for each key that differs.
  <:- endif :>
  <:- if pp and pp != DATA_PROVIDER :>

  syntek-author's answers file (.copier-answers.syntek-author.yml) records DATA_PROVIDER
  '<% pp %>', and this one '<% DATA_PROVIDER %>'. One data root has one provider, and
  python3 .claude/syntek-media-dataroot.py root prints the checklist for this template's
  answer. Nothing is refused: answer the same in both templates.
  <:- endif :>

# ── Post-generation ──────────────────────────────────────────────────────────

_tasks:
  # ORDER MATTERS IN THIS LIST: Copier runs _tasks top to bottom, on `copy` AND on `update`.
  # A task that must not touch a live project carries an explicit
  # `when: "<% _copier_operation == 'copy' %>"`; the absence of one means it runs on every
  # update. Every task below is copy-only (five since 0.6.0): media has no database to build,
  # its hooks are copy-only shared files (D80), and an update changes files only through the
  # merge and the migrations, the family 'update' block last, which report what they did
  # (D81). Every task is non-fatal wherever git is installed (DESIGN.md Section 3.5), because
  # a failing task aborts the whole generation, or the whole update, after the files are
  # already written. Tasks 1 and 2 are syntek-author's exact commands, so without git task 1
  # fails as syntek-author's does; the toolkit and the skills need git in any case. Task 5 is
  # syntek-author's too, transcribed byte for byte from its v0.8.0 copier.yml, and stays last.
  # No task runs the permissions script: _message_after_copy item (2) gives its --write.
  #
  # There are no `mv` seed tasks. Seeds are _skip_if_exists, which is safe over an existing
  # project; an `mv` onto an existing file clobbers it (probe e1).
  #
  # 1. A repository first, because the toolkit and the skills locate the project with
  #    `git rev-parse --show-toplevel`, and the tripwire below writes the repository's own
  #    .git/config. Guarded by `[ -d .git ]` because media is usually applied INTO an existing
  #    repository, which must never be re-initialised.
  - command: "[ -d .git ] || git init --initial-branch=main"
    when: "<% _copier_operation == 'copy' %>"

  # 2. The hooks must be executable, and a git checkout of the template does not always carry
  #    the bit (DESIGN.md D80; syntek-author D51, whose task this is, verbatim). Copy only: the
  #    hooks are copy-only shared files, so an update never renders them and must not change
  #    their mode either. Over syntek-author it finds syntek-author's identical copies, already
  #    755, and changes nothing. It never fails, so a copy completes even where no hook is.
  - command: "chmod +x .claude/hooks/*.sh 2>/dev/null || true"
    when: "<% _copier_operation == 'copy' %>"

  # 3. The LFS tripwire (DESIGN.md D19). Git LFS is used only for brand/src/exports/large/,
  #    whose nested .gitattributes marks every file `filter=lfs`. Where no LFS filter is
  #    configured at any scope — git-lfs absent, or installed without `git lfs install` — git
  #    treats that filter as a pass-through and commits the whole file as a plain blob,
  #    silently. Setting filter.lfs.required makes that `git add` fail loudly instead ("clean
  #    filter 'lfs' failed", exit 128). It tests the configured filter, never the program:
  #    `git lfs version` passes when git-lfs is installed but no filter is configured, and the
  #    blob went in whole (mechanics review probe, 03/10/2026). It writes this repository's
  #    own .git/config, which _message_after_copy says; `git lfs install` later sets the same
  #    value, so the setting is then harmless. Copy-only, and never undone by media. Non-fatal:
  #    the final `echo` runs only when `git config` itself failed. `media.py check` is the
  #    second guard (D19), and toolkit-smoke.sh check 8 applies this same condition.
  - command: >-
      git config --get filter.lfs.process >/dev/null 2>&1 ||
      git config --get filter.lfs.clean >/dev/null 2>&1 ||
      git config filter.lfs.required true ||
      echo 'LFS tripwire not set (git config failed): run python3 toolkit/media.py check before you add a large design export.'
    when: "<% _copier_operation == 'copy' %>"

  # 4. The copy-time warning (DESIGN.md D84). syntek-author ships its user guide from v0.6.0,
  #    ungated, starting at how-to/src/TEMPLATE-GUIDE/syntek-author/01-overview.md; a project
  #    whose syntek-author answers file stands without that file was made by an older
  #    syntek-author, which a combined project must not keep, because the guide's shared files
  #    and read-only rule are both templates' from 0.6.0. It is a task, not message text,
  #    because it tests files at run time: a message may read _external_data only in D14's
  #    three places, and this reads no answer, no token and nothing of syntek-author's record.
  #    It prints to stdout and never fails; coexist-test.sh check 23 reads it, and check 19's
  #    copy over a syntek-author render that has its guide proves it silent there.
  - command: >-
      [ ! -f .copier-answers.syntek-author.yml ] ||
      [ -f how-to/src/TEMPLATE-GUIDE/syntek-author/01-overview.md ] ||
      echo 'syntek-media: .copier-answers.syntek-author.yml stands here without how-to/src/TEMPLATE-GUIDE/syntek-author/01-overview.md, so this syntek-author is older than v0.6.0, which a combined project must not keep. Update syntek-author to v0.6.0 or later now, from a clean tree, and update it before syntek-media from then on.'
    when: "<% _copier_operation == 'copy' %>"

  # 5. LAST: syntek-author's baseline task (DESIGN.md D81; syntek-author D51, D52), verbatim.
  #    On Python 3.14 it records this project's render of the version just copied in
  #    refs/syntek-media/ inside .git, so the first update reports from a recorded render, and
  #    offers the settings entries and MCP servers migrations/family-refresh.json lists to the
  #    files the copy kept (an existing .claude/settings.json or MCP file), once each. It needs
  #    the repository task 1 made and always exits 0. On an older Python it records nothing and
  #    prints a framed message that family-update did NOT run, which item (2) of
  #    _message_after_copy answers; a copy with --skip-tasks does not run it at all.
  #    shipped-seeds.sh check 30 holds it here, line for line.
  - command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/family-update.py" baseline --src "<% _copier_conf.src_path %>" --to <% _copier_conf.vcs_ref_hash %> --answers "<% _copier_conf.answers_file %>"'
    when: "<% _copier_operation == 'copy' %>"
